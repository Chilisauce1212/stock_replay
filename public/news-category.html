<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新闻类别评审</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0b0e11;
      --panel: #161a1e;
      --panel-2: #1e2329;
      --line: #2b313a;
      --text: #cccccc;
      --muted: #8994a2;
      --accent: #f0b90b;
      --good: #3fb950;
      --bad: #f05298;
      --warn: #e3a008;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .toolbar {
      position: sticky; top: 0; z-index: 2;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
      padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .toolbar h1 { font-size: 16px; margin: 0; color: #eaecef; font-weight: 600; }
    select, button, input[type="text"] {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
      border-radius: 4px; padding: 4px 8px; font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: #3d4550; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; }
    .tab { padding: 6px 10px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); }
    .tab.active { border-color: var(--accent); color: #eaecef; }
    .tab .sub { color: var(--muted); font-size: 12px; margin-left: 4px; }
    .tab .dis { color: var(--bad); }
    .hint { color: var(--muted); font-size: 12px; padding: 6px 16px 0; }
    main { padding: 10px 16px 40px; max-width: 1100px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .card.focus { border-color: var(--accent); }
    .card.ok { border-left: 3px solid var(--good); }
    .card.wrongCategory { border-left: 3px solid var(--warn); }
    .card.notImportant { border-left: 3px solid var(--bad); }
    .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
    .title { color: #eaecef; font-size: 14px; font-weight: 600; text-decoration: none; }
    a.title:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 12px; }
    .chip { display: inline-block; padding: 0 6px; border-radius: 3px; background: #2a2f37; font-size: 12px; margin-right: 4px; }
    .chip.cur { background: #3a3220; color: var(--accent); }
    .row { margin-top: 4px; }
    .row b { color: var(--muted); font-weight: normal; margin-right: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
    .actions button.on.ok { border-color: var(--good); color: var(--good); }
    .actions button.on.wrongCategory { border-color: var(--warn); color: var(--warn); }
    .actions button.on.notImportant { border-color: var(--bad); color: var(--bad); }
    .pick { display: none; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .pick.show { display: flex; }
    .pick label { display: inline-flex; gap: 4px; align-items: center; }
    .note { flex: 1 1 220px; min-width: 160px; }
    .body { display: none; margin-top: 6px; padding: 8px; background: var(--panel-2); border-radius: 4px; white-space: pre-wrap; max-height: 260px; overflow: auto; color: #b7bdc6; }
    .body.show { display: block; }
    .status { font-size: 12px; color: var(--muted); }
    .pager { display: flex; gap: 8px; align-items: center; margin: 14px 0; }
    .empty { color: var(--muted); padding: 30px 0; }
    @media (max-width: 640px) { .toolbar, .tabs, main, .hint { padding-left: 10px; padding-right: 10px; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>新闻类别评审</h1>
    <label>样本 <select id="report"></select></label>
    <label>显示 <select id="filter">
      <option value="unreviewed">未评审</option>
      <option value="all">全部</option>
      <option value="only">只属于这一类</option>
      <option value="reviewed">已评审</option>
      <option value="disagree">有异议</option>
    </select></label>
    <span class="status" id="status"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="hint">每条是大模型判为重要的新闻。快捷键：J / K 上下移动，1 判断对，2 类别不对，3 不算重要，0 撤销，B 展开原文。顺序是打乱的，评几十条就能看出这一类的问题。</div>
  <main>
    <div id="list"></div>
    <div class="pager">
      <button type="button" id="prev">上一页</button>
      <span id="pageInfo" class="status"></span>
      <button type="button" id="next">下一页</button>
    </div>
  </main>
<script>
  const state = { report: '', category: '', filter: 'unreviewed', page: 1, data: null, focus: 0 };
  const VERDICT_TEXT = { ok: '判断对', wrongCategory: '类别不对', notImportant: '不算重要' };
  const $ = id => document.getElementById(id);
  const escapeHtml = text => String(text ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  async function api(url, options) {
    const response = await fetch(url, options);
    const payload = await response.json();
    if (payload.status_code !== 0) throw new Error(payload.msg || `请求失败 (HTTP ${response.status})`);
    return payload;
  }

  async function loadReports() {
    const { files } = await api('/api/theme-gantt');
    const preferred = files.includes('一进二题材演绎') ? '一进二题材演绎' : files[0];
    $('report').innerHTML = files.map(file => `<option${file === preferred ? ' selected' : ''}>${escapeHtml(file)}</option>`).join('');
    state.report = preferred;
  }

  async function load(keepFocus) {
    $('status').textContent = '加载中…';
    const params = new URLSearchParams({ report: state.report, category: state.category, filter: state.filter, page: state.page });
    try {
      state.data = await api(`/api/news-category?${params}`);
      // 首次打开还不知道类别列表，拿到后按第一类重新加载
      if (!state.category) { state.category = state.data.categories[0]; return load(); }
      if (!keepFocus) state.focus = 0;
      render();
      $('status').textContent = '';
    } catch (error) {
      $('status').textContent = error.message;
    }
  }

  function renderTabs() {
    const { categories, counts } = state.data;
    $('tabs').innerHTML = categories.map(name => {
      const count = counts[name];
      const rate = count.reviewed ? `，异议 <span class="dis">${count.disagree}</span>（${Math.round(count.disagree / count.reviewed * 100)}%）` : '';
      return `<button type="button" class="tab${name === state.category ? ' active' : ''}" data-cat="${escapeHtml(name)}">${escapeHtml(name)}<span class="sub">${count.total} 条，已评 ${count.reviewed}${rate}</span></button>`;
    }).join('');
  }

  function cardHtml(item, index) {
    const review = item.review;
    const verdict = review?.verdict || '';
    const chips = item.categories.map(name => `<span class="chip${name === state.category ? ' cur' : ''}">${escapeHtml(name)}</span>`).join('');
    const picked = new Set(review?.categories || []);
    const title = item.url
      ? `<a class="title" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>`
      : `<span class="title">${escapeHtml(item.title)}</span>`;
    return `<div class="card ${verdict}${index === state.focus ? ' focus' : ''}" data-index="${index}">
      <div class="head">${title}</div>
      <div class="meta">${escapeHtml(item.name)} · 首板 ${escapeHtml(item.date)} · 新闻 ${escapeHtml(item.time)}</div>
      <div class="row"><b>涨停原因</b>${escapeHtml(item.limitUpReason)}</div>
      <div class="row"><b>模型类别</b>${chips}</div>
      <div class="row"><b>新东西</b>${escapeHtml(item.newThing || '—')}</div>
      <div class="row"><b>判断依据</b>${escapeHtml(item.reason)}</div>
      <div class="actions">
        <button type="button" data-act="ok" class="ok${verdict === 'ok' ? ' on' : ''}">1 判断对</button>
        <button type="button" data-act="wrongCategory" class="wrongCategory${verdict === 'wrongCategory' ? ' on' : ''}">2 类别不对</button>
        <button type="button" data-act="notImportant" class="notImportant${verdict === 'notImportant' ? ' on' : ''}">3 不算重要</button>
        ${verdict ? '<button type="button" data-act="clear">0 撤销</button>' : ''}
        <input type="text" class="note" placeholder="理由（可选，回车保存）" value="${escapeHtml(review?.note || '')}">
        ${item.url ? '<button type="button" data-act="body">B 原文</button>' : ''}
      </div>
      <div class="pick${verdict === 'wrongCategory' ? ' show' : ''}">
        <span class="meta">正确类别：</span>
        ${state.data.categories.map(name => `<label><input type="checkbox" value="${escapeHtml(name)}"${picked.has(name) ? ' checked' : ''}>${escapeHtml(name)}</label>`).join('')}
        <button type="button" data-act="saveCategory">保存类别</button>
      </div>
      <div class="body"></div>
    </div>`;
  }

  function render() {
    renderTabs();
    const { items, total, page, pageSize } = state.data;
    $('list').innerHTML = items.length ? items.map(cardHtml).join('') : '<div class="empty">这一类没有符合条件的新闻。</div>';
    const pages = Math.max(1, Math.ceil(total / pageSize));
    $('pageInfo').textContent = `第 ${page} / ${pages} 页，共 ${total} 条`;
    $('prev').disabled = page <= 1;
    $('next').disabled = page >= pages;
  }

  function setFocus(index, scroll = true) {
    const cards = [...document.querySelectorAll('.card')];
    if (!cards.length) return;
    state.focus = Math.max(0, Math.min(cards.length - 1, index));
    cards.forEach((card, i) => card.classList.toggle('focus', i === state.focus));
    if (scroll) cards[state.focus].scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  async function save(index, verdict, extra = {}) {
    const item = state.data.items[index];
    const card = document.querySelector(`.card[data-index="${index}"]`);
    const note = card.querySelector('.note').value;
    try {
      const { review } = await api('/api/news-category/review', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: item.id, verdict, note, ...extra }),
      });
      updateCounts(item, item.review, review);
      item.review = review;
      card.outerHTML = cardHtml(item, index);
      renderTabs();
      $('status').textContent = review ? `已保存：${VERDICT_TEXT[review.verdict]}` : '已撤销';
    } catch (error) {
      $('status').textContent = error.message;
    }
  }

  // 本地更新标签上的计数，不必整页重载
  function updateCounts(item, before, after) {
    for (const name of item.categories) {
      const count = state.data.counts[name];
      if (!count) continue;
      if (before) { count.reviewed--; if (before.verdict !== 'ok') count.disagree--; }
      if (after) { count.reviewed++; if (after.verdict !== 'ok') count.disagree++; }
    }
  }

  async function toggleBody(index) {
    const item = state.data.items[index];
    const box = document.querySelector(`.card[data-index="${index}"] .body`);
    if (box.classList.toggle('show') && !box.textContent) {
      box.textContent = '加载中…';
      const { text } = await api(`/api/news-category/body?url=${encodeURIComponent(item.url)}`);
      box.textContent = text || '没有抓到原文';
    }
  }

  function act(index, action) {
    const card = document.querySelector(`.card[data-index="${index}"]`);
    if (!card) return;
    if (action === 'ok' || action === 'notImportant') return save(index, action);
    if (action === 'clear') return save(index, '');
    if (action === 'wrongCategory') { card.querySelector('.pick').classList.add('show'); return; }
    if (action === 'saveCategory') {
      const categories = [...card.querySelectorAll('.pick input:checked')].map(input => input.value);
      return save(index, 'wrongCategory', { categories });
    }
    if (action === 'body') return toggleBody(index);
  }

  $('tabs').addEventListener('click', event => {
    const tab = event.target.closest('.tab');
    if (!tab) return;
    state.category = tab.dataset.cat;
    state.page = 1;
    load();
  });
  $('list').addEventListener('click', event => {
    const card = event.target.closest('.card');
    if (!card) return;
    const index = Number(card.dataset.index);
    setFocus(index, false);
    const button = event.target.closest('button[data-act]');
    if (button) act(index, button.dataset.act);
  });
  $('list').addEventListener('keydown', event => {
    if (event.key === 'Enter' && event.target.classList.contains('note')) {
      const index = Number(event.target.closest('.card').dataset.index);
      const verdict = state.data.items[index].review?.verdict;
      if (verdict) save(index, verdict, { categories: state.data.items[index].review.categories });
      event.target.blur();
    }
  });
  document.addEventListener('keydown', event => {
    if (event.target.matches('input, select, textarea') || event.ctrlKey || event.metaKey || event.altKey) return;
    const key = event.key.toLowerCase();
    const actions = { 1: 'ok', 2: 'wrongCategory', 3: 'notImportant', 0: 'clear', b: 'body' };
    if (key === 'j') setFocus(state.focus + 1);
    else if (key === 'k') setFocus(state.focus - 1);
    else if (actions[key]) act(state.focus, actions[key]);
    else return;
    event.preventDefault();
  });
  $('filter').addEventListener('change', () => { state.filter = $('filter').value; state.page = 1; load(); });
  $('report').addEventListener('change', () => { state.report = $('report').value; state.page = 1; load(); });
  $('prev').addEventListener('click', () => { state.page--; load(); window.scrollTo(0, 0); });
  $('next').addEventListener('click', () => { state.page++; load(); window.scrollTo(0, 0); });

  loadReports().then(() => load()).catch(error => { $('status').textContent = error.message; });
</script>
</body>
</html>
