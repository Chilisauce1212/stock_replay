<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0e11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>K线训练与盲盒回放工具 (TradingView Lightweight Charts)</title>
  <!-- 引入 TradingView 开源 lightweight-charts -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    * {
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background-color: #0b0e11;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: clamp(8px, 2vw, 16px);
      box-sizing: border-box;
    }
    .container {
      width: min(1600px, 100%);
      max-width: 100%;
      min-width: 0;
      margin: 0 auto;
      height: calc(100dvh - clamp(16px, 4vw, 32px));
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 901px) {
      .container {
        width: 100%;
        max-width: none;
      }
    }
    .workspace {
      min-height: 0;
      min-width: 0;
      flex: 1;
      display: grid;
      grid-template-rows: 14.2857% minmax(0, 85.7143%);
      gap: 0;
    }
    input {
      background: #1e2329;
      color: #fff;
      border: 1px solid #474d57;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      max-width: 100%;
      box-sizing: border-box;
    }
    select {
      background: #1e2329;
      color: #fff;
      border: 1px solid #474d57;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      max-width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #1e2329;
      color: #f0b90b;
      border: 1px solid #474d57;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover {
      background: #2b313a;
    }
    button:disabled {
      color: #666;
      cursor: not-allowed;
    }
    #buyButton {
      background: #d9363e;
      color: #fff;
      border-color: #d9363e;
    }
    #buyButton:hover:not(:disabled) {
      background: #b52b33;
    }
    #nextCaseButton {
      background: #1f9d55;
      color: #fff;
      border-color: #1f9d55;
    }
    #nextCaseButton:hover:not(:disabled) {
      background: #187a43;
    }
    #nextStepButton {
      background: #1677ff;
      color: #fff;
      border-color: #1677ff;
    }
    #nextStepButton:hover:not(:disabled) {
      background: #0d5dcc;
    }
    .info-board {
      margin-left: auto;
      font-size: 14px;
      font-family: monospace;
    }
    .legend {
      display: flex;
      gap: 15px;
      font-size: 13px;
      margin-bottom: 8px;
      font-family: monospace;
      overflow-x: hidden;
      white-space: nowrap;
      padding-bottom: 2px;
    }
    .chart-area {
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .chart-area .legend {
      flex: 0 0 auto;
      position: relative;
    }
    #reviewWheelToggle {
      position: absolute;
      z-index: 7;
      top: 38px;
      left: 8px;
      padding: 5px 9px;
      background: rgba(17, 20, 25, 0.92);
      color: #f0b90b;
    }
    #reviewStockWheel {
      position: absolute;
      z-index: 7;
      top: 76px;
      left: 8px;
      width: min(240px, calc(100vw - 32px));
      padding: 9px;
      box-sizing: border-box;
      border: 1px solid #526176;
      background: rgba(17, 20, 25, 0.96);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      max-height: calc(100% - 84px);
    }
    #reviewDateButton {
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      height: auto;
      padding: 6px 10px;
      font-size: 14px;
      color: #fff;
    }
    #reviewCalendar {
      position: fixed;
      z-index: 8;
      top: 0;
      left: 0;
      width: min(350px, calc(100vw - 32px));
      padding: 9px;
      box-sizing: border-box;
      border: 1px solid #526176;
      background: rgba(17, 20, 25, 0.97);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    #reviewCalendar[hidden] { display: none; }
    .review-calendar-head {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .review-calendar-head select { flex: 1 1 0; min-width: 0; padding: 4px 6px; }
    .review-calendar-head button { padding: 2px 9px; }
    .review-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
    }
    .review-calendar-weekday { color: #7d8794; font-size: 12px; padding: 3px 0; }
    .review-calendar-day {
      min-width: 0;
      height: 44px;
      padding: 4px 0;
      overflow: hidden;
      border-radius: 3px;
      font-size: 13px;
      font-weight: normal;
      color: #fff;
    }
    .review-calendar-day:disabled {
      color: #4a515b;
      background: transparent;
      border-color: transparent;
      cursor: not-allowed;
    }
    .review-calendar-day.is-done:not(:disabled) { color: #7d8794; }
    .review-calendar-day.is-selected { background: #f0b90b; color: #111; border-color: #f0b90b; font-weight: bold; }
    .review-calendar-pnl { display: block; font-size: 10px; line-height: 1.2; font-weight: normal; white-space: nowrap; overflow: hidden; }
    .review-calendar-pnl.is-empty { visibility: hidden; }
    .review-calendar-pnl.is-up { color: #ff5a5f; }
    .review-calendar-pnl.is-down { color: #2ecc71; }
    .review-calendar-pnl.is-flat { color: #aeb8c5; }
    .review-calendar-day.is-selected .review-calendar-pnl { color: #111; }
    #reviewStockWheel[hidden],
    #reviewWheelToggle[hidden] { display: none; }
    .review-wheel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      color: #f0b90b;
      font-size: 13px;
    }
    .review-wheel-heading button {
      padding: 2px 7px;
    }
    #reviewWheelList {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      overscroll-behavior: contain;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #526176 transparent;
    }
    .review-wheel-item {
      display: block;
      flex: 0 0 40px;
      width: 100%;
      height: 40px;
      padding: 0 8px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #aeb8c5;
      font-size: 14px;
      font-weight: normal;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .review-wheel-item.is-bought {
      color: #d9363e;
    }
    .review-wheel-item.is-skipped {
      color: #1f9d55;
    }
    .review-wheel-item.is-bought .review-wheel-name::before,
    .review-wheel-item.is-skipped .review-wheel-name::before {
      content: '*[';
    }
    .review-wheel-item.is-bought .review-wheel-name::after,
    .review-wheel-item.is-skipped .review-wheel-name::after {
      content: ']*';
    }
    .review-wheel-item.is-current {
      border-block: 1px solid #f0b90b;
      color: #f0b90b;
      font-weight: bold;
    }
    #newsButton {
      position: absolute;
      z-index: 7;
      top: 38px;
      right: 84px;
      padding: 5px 9px;
      background: rgba(17, 20, 25, 0.92);
      color: #b7d7ff;
    }
    #newsPanel {
      position: absolute;
      z-index: 5;
      top: 72px;
      right: 0;
      bottom: 0;
      width: min(620px, 100%);
      padding: 10px 12px;
      box-sizing: border-box;
      background: rgba(17, 20, 25, 0.94);
      border: 1px solid #526176;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      white-space: normal;
      overflow-y: auto;
      overscroll-behavior: contain;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    #newsPanel[hidden] { display: none; }
    .news-list { display: grid; gap: 10px; }
    .news-item { padding-bottom: 9px; border-bottom: 1px solid #2b3440; }
    .news-date { color: #f0b90b; font-family: monospace; }
    .news-title { margin: 4px 0 0; color: #f2f4f7; line-height: 1.45; }
    .news-pin { display: inline-block; margin-right: 6px; padding: 1px 5px; border: 1px solid #f0b90b; border-radius: 3px; color: #f0b90b; font-size: 12px; line-height: 1.3; vertical-align: 1px; }
    .test-panel {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(180px, 1.5fr) minmax(150px, 1fr) minmax(150px, 1fr) minmax(180px, 2fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid #2b2f36;
      background: #111419;
      overflow: hidden;
    }
    .test-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }
    .favorite-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }
    .favorite-controls input,
    .favorite-controls select {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
    }
    .favorite-controls button {
      flex: 0 0 auto;
      width: 38px;
      height: 34px;
      padding: 0;
      font-size: 22px;
      line-height: 1;
      color: #f0b90b;
      white-space: nowrap;
    }
    .favorite-controls button.is-saved {
      color: #f0b90b;
    }
    .test-status { color: #f0b90b; font-family: monospace; }
    .result-board { color: #aeb8c5; font-family: monospace; }
    #dailyRecordStatus { color: #d9363e; }
    #chartContainer {
      width: 100%;
      max-width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border: 1px solid #2b2f36;
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
      touch-action: none;
    }
    @media (max-width: 700px) {
      .test-panel {
        grid-template-columns: minmax(120px, 1fr) minmax(150px, 1.5fr);
        gap: 8px;
        padding: 6px;
      }
      .workspace {
        gap: 0;
      }
      .test-panel > label:first-child {
        grid-column: 1;
        min-width: 0;
      }
      .test-panel > label:nth-child(2) {
        grid-column: 2;
        min-width: 0;
      }
      .test-panel > span {
        display: none;
      }
      .test-panel select {
        width: 100%;
        min-height: 38px;
      }
      .favorite-controls {
        grid-column: 1 / -1;
      }
      .test-actions {
        grid-column: 2 / -1;
        justify-content: stretch;
      }
      .test-actions button {
        flex: 1;
        min-height: 38px;
      }
      .test-status {
        grid-column: 1 / -1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
    @media (max-width: 900px) and (orientation: landscape) {
      body {
        padding: 8px;
      }
      .test-panel {
        display: grid;
        grid-template-columns: minmax(110px, 1fr) minmax(150px, 1.5fr) minmax(170px, 1.5fr) minmax(175px, 2fr);
        gap: 6px;
        padding: 6px;
        font-size: 12px;
      }
      .test-panel > label:first-child {
        grid-column: 1;
      }
      .test-panel > label:nth-child(2) {
        grid-column: 2;
      }
      .test-panel > span {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .test-panel > #stockNameVal,
      .test-panel > #testStatus {
        display: none;
      }
      .test-panel select {
        min-height: 32px;
        max-width: 100%;
        font-size: 12px;
      }
      .test-actions {
        grid-column: 4;
        grid-row: 1;
        gap: 6px;
        width: 100%;
      }
      .test-actions button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 32px;
        padding: 4px 6px;
        font-size: 12px;
        white-space: nowrap;
      }
      .favorite-controls {
        grid-column: 3;
        grid-row: 1;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="workspace">
    <div class="test-panel">
      <label>
        <select id="dataSource" onchange="switchDataSource()">
          <option value="dailyReview">每日复盘 JSON</option>
          <option value="testcases">测试用例 JSON</option>
          <option value="favorites">收藏 JSON</option>
        </select>
      </label>
      <label>
        <select id="testCaseFile" onchange="loadTestCaseFile()">
          <option value="">请选择测试用例</option>
        </select>
      </label>
      <span id="stockNameVal" style="color:#f0b90b;">股票名称: --</span>
      <span id="testStatus" class="test-status">请选择测试用例 JSON 或收藏分组</span>
      <div class="favorite-controls">
        <select id="favoriteGroup" aria-label="收藏分组" onchange="updateFavoriteButton()"></select>
        <input id="newFavoriteGroup" type="text" placeholder="新建分组">
        <button id="favoriteButton" type="button" onclick="toggleFavorite()" aria-label="添加收藏" title="添加收藏">☆</button>
        <button id="reviewDateButton" type="button" hidden aria-haspopup="true" aria-expanded="false" aria-label="选择复盘日期" onclick="toggleReviewCalendar()">选择日期</button>
      </div>
      <div class="test-actions">
        <button id="buyButton" onclick="buyAtCurrentCandle()" disabled>买入</button>
        <button id="nextStepButton" onclick="nextStep()">快进</button>
        <button id="nextCaseButton" onclick="nextTestCase()" disabled>空仓</button>
      </div>
    </div>

    <div class="chart-area">
      <button id="reviewWheelToggle" type="button" hidden aria-expanded="false" aria-controls="reviewStockWheel" onclick="toggleReviewWheel()">选择股票</button>
      <div id="reviewCalendar" hidden>
        <div class="review-calendar-head">
          <button type="button" id="reviewCalendarPrev" aria-label="上个月" onclick="shiftReviewCalendarMonth(-1)">‹</button>
          <select id="reviewCalendarYear" aria-label="年" onchange="changeReviewCalendarView()"></select>
          <select id="reviewCalendarMonth" aria-label="月" onchange="changeReviewCalendarView()"></select>
          <button type="button" id="reviewCalendarNext" aria-label="下个月" onclick="shiftReviewCalendarMonth(1)">›</button>
        </div>
        <div class="review-calendar-grid" id="reviewCalendarGrid"></div>
      </div>
      <div id="reviewStockWheel" hidden>
        <div class="review-wheel-heading">
          <span>点击股票跳转</span>
          <button type="button" aria-label="收起股票选择" onclick="toggleReviewWheel(false)">收起</button>
        </div>
        <div id="reviewWheelList"></div>
      </div>
      <div class="legend">
        <span id="codeVal" style="color: #f0b90b;">股票代码: --</span>
        <span id="dateVal" style="color: #fff;">日期: --</span>
        <span id="amountVal" style="color: #b0b8c4;">成交金额: --</span>
        <span id="successBoard" class="result-board">成功: <span id="successCount">0</span></span>
        <span id="failureBoard" class="result-board">失败: <span id="failureCount">0</span></span>
        <span id="totalBoard" class="result-board">总数: <span id="totalCount">0</span><span id="dailyRecordStatus"></span></span>
        <span id="reviewPnlBoard" class="result-board" hidden>当日盈亏: <span id="reviewDayPnl">--</span> 累计盈亏: <span id="reviewTotalPnl">--</span></span>
      </div>
      <button id="newsButton" type="button" onclick="toggleNewsPanel()" aria-label="显示新闻" title="显示新闻">新闻</button>
      <div id="newsPanel" hidden>
        <div id="newsList" class="news-list"></div>
      </div>
      <div id="chartContainer"></div>
    </div>
  </div>
</div>

<script>
  let fullData = [];
  let currentIndex = 0; // 当前推演到的索引位置
  const DEFAULT_VISIBLE_CANDLE_COUNT = 120;
  
  let chart, candlestickSeries, volumeSeries, ma5Series, ma10Series, ma20Series;
  let priceLine = null;
  let sellPriceLine = null;
  let reviewPnlResults = new Map();
  let preloadedReviewCases = null;
  let loadedReviewFile = '';
  let candleMarkers = [];
  let markerController = null;
  let testCases = [];
  let shuffledCases = [];
  let casePosition = 0;
  let favoriteGroups = {};
  let activeCase = null;
  let activeTrade = null;
  let caseResolved = false;
  let successCount = 0;
  let failureCount = 0;
  let favoriteSaved = false;
  let boughtStockNames = [];
  let selectedReviewDate = '';
  let reviewDates = [];
  let skippedReviewCaseIds = new Set();
  let boughtReviewCaseIds = new Set();
  let boughtReviewViews = new Map();
  let keepReviewPosition = false;
  let pendingCaseNotice = '';
  let calendarYear = 0;
  let calendarMonth = 1;
  let currentCaseHasFutureData = true;
  let currentCaseBought = false;
  let currentNews = [];
  let currentNewsLoading = false;
  let currentNewsError = '';
  let currentNewsAbortController = null;

  function isDailyReviewSource() {
    return document.getElementById('dataSource').value === 'dailyReview';
  }

  function loadFilesForSource() {
    const source = document.getElementById('dataSource').value;
    if (source === 'dailyReview') return loadDailyReviewFiles();
    if (source === 'testcases') return loadTestCaseFiles();
  }

  function updateSourceMode() {
    const dailyReview = isDailyReviewSource();
    document.querySelector('.test-panel').classList.toggle('daily-review-mode', dailyReview);
    document.getElementById('successBoard').style.display = dailyReview ? 'none' : '';
    document.getElementById('failureBoard').style.display = dailyReview ? 'none' : '';
    document.getElementById('totalBoard').style.display = '';
    document.getElementById('favoriteGroup').hidden = dailyReview;
    document.getElementById('newFavoriteGroup').hidden = dailyReview;
    document.getElementById('reviewDateButton').hidden = !dailyReview;
    document.getElementById('reviewDateButton').disabled = reviewDates.length <= 1;
    document.getElementById('reviewWheelToggle').hidden = !dailyReview;
    if (!dailyReview) {
      toggleReviewWheel(false);
      toggleReviewCalendar(false);
    }
    document.getElementById('favoriteButton').disabled = dailyReview || !activeCase;
    document.getElementById('favoriteButton').hidden = dailyReview;
  }

  function displayCodeLabel() {
    const code = activeCase?.marketCode || activeCase?.code || '--';
    if (isDailyReviewSource()) return `股票名称: ${activeCase?.stockName || code}`;
    return `股票代码: ${code}`;
  }

  function setDailyReviewButtons() {
    document.getElementById('nextStepButton').disabled = isDailyReviewSource() && !currentCaseHasFutureData;
  }

  function formatNewsDate(publishTime) {
    return new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit',
    }).format(new Date(publishTime));
  }

  function updateNewsDisplay() {
    const list = document.getElementById('newsList');
    list.replaceChildren();
    if (currentNewsLoading) {
      const loading = document.createElement('div');
      loading.className = 'news-title';
      loading.textContent = '正在加载回测日前5个交易日新闻...';
      list.appendChild(loading);
      return;
    }
    if (currentNewsError) {
      const failure = document.createElement('div');
      failure.className = 'news-title';
      failure.textContent = `实时新闻加载失败: ${currentNewsError}`;
      list.appendChild(failure);
      return;
    }
    if (!currentNews.length) {
      const empty = document.createElement('div');
      empty.className = 'news-title';
      empty.textContent = '当前股票在回测日前5个交易日没有新闻';
      list.appendChild(empty);
      return;
    }
    currentNews.forEach(item => {
      const article = document.createElement('article');
      article.className = 'news-item';
      const date = document.createElement('div');
      date.className = 'news-date';
      date.textContent = formatNewsDate(item.publishTime);
      const title = document.createElement('p');
      title.className = 'news-title';
      if (item.isPinned) {
        const pin = document.createElement('span');
        pin.className = 'news-pin';
        pin.textContent = '置顶';
        title.appendChild(pin);
      }
      title.append(document.createTextNode(item.title || '无标题'));
      article.append(date, title);
      list.appendChild(article);
    });
  }

  function updateNewsPanel() {
    currentNews = [];
    currentNewsLoading = Boolean(activeCase);
    currentNewsError = '';
    document.getElementById('newsButton').disabled = !activeCase;
    updateNewsDisplay();
  }

  function loadCurrentNews(caseItem) {
    if (currentNewsAbortController) currentNewsAbortController.abort();
    const controller = new AbortController();
    currentNewsAbortController = controller;
    const timeoutId = setTimeout(() => controller.abort(), 30000);
    fetch(`/api/news?code=${encodeURIComponent(caseItem.code)}&date=${encodeURIComponent(caseItem.date)}&ts=${Date.now()}`, {
      cache: 'no-store',
      signal: controller.signal,
    })
      .then(async response => {
        const result = await response.json();
        if (!response.ok || result.status_code !== 0) {
          throw new Error(result.msg || `HTTP ${response.status}`);
        }
        return result;
      })
      .then(result => {
        if (activeCase !== caseItem) return;
        currentNews = Array.isArray(result.data)
          ? result.data.sort((left, right) => (
            Number(Boolean(right.isPinned)) - Number(Boolean(left.isPinned))
            || Number(right.publishTime) - Number(left.publishTime)
          ))
          : [];
        currentNewsLoading = false;
        currentNewsError = '';
        updateNewsDisplay();
      })
      .catch(error => {
        if (activeCase !== caseItem) return;
        currentNews = [];
        currentNewsLoading = false;
        currentNewsError = error.name === 'AbortError'
          ? '请求超时，请检查代理和服务是否正常运行'
          : error.message;
        updateNewsDisplay();
      })
      .finally(() => {
        clearTimeout(timeoutId);
        if (currentNewsAbortController === controller) currentNewsAbortController = null;
      });
  }

  function toggleNewsPanel() {
    const panel = document.getElementById('newsPanel');
    panel.hidden = !panel.hidden;
    if (!panel.hidden) updateNewsDisplay();
  }

  function formatAmount(amount) {
    const value = Number(amount);
    if (!Number.isFinite(value)) return '成交金额: --';
    if (Math.abs(value) < 1e8) {
      return `成交金额: ${(value / 1e7).toFixed(2)}千万`;
    }
    return `成交金额: ${(value / 1e8).toFixed(2)}亿`;
  }

  function sortCasesByDate(items) {
    return [...items].sort((left, right) => String(left.date || '').localeCompare(String(right.date || '')));
  }

  function reviewCaseDate(item) {
    return String(item.date || '').trim();
  }

  function getReviewCasesForDate(date) {
    return testCases.filter(item => reviewCaseDate(item) === date);
  }

  function isReviewCaseDone(item) {
    const id = String(item.id);
    return skippedReviewCaseIds.has(id) || boughtReviewCaseIds.has(id);
  }

  function initReviewDates(items) {
    reviewDates = [...new Set(items.map(reviewCaseDate).filter(Boolean))].sort();
    selectedReviewDate = reviewDates[0] || '';
    skippedReviewCaseIds = new Set();
    boughtReviewCaseIds = new Set();
    boughtReviewViews = new Map();
    reviewPnlResults = new Map();
    preloadedReviewCases = null;
    toggleReviewCalendar(false);
    updateReviewDateButton();
  }

  function updateReviewDateButton() {
    const button = document.getElementById('reviewDateButton');
    button.textContent = selectedReviewDate || '选择日期';
    button.disabled = reviewDates.length <= 1;
    if (!document.getElementById('reviewCalendar').hidden) renderReviewCalendar();
  }

  function startDailyReviewSession() {
    shuffledCases = getReviewCasesForDate(selectedReviewDate);
    casePosition = 0;
    successCount = 0;
    failureCount = 0;
    boughtStockNames = [];
    keepReviewPosition = false;
    activeTrade = null;
    caseResolved = false;
    currentCaseBought = false;
    currentCaseHasFutureData = true;
    updateSourceMode();
    updateReviewWheel();
    updateTestProgress();
    startNextCase();
  }

  function changeReviewDate(date) {
    if (!isDailyReviewSource() || !reviewDates.includes(date)) return;
    toggleReviewCalendar(false);
    selectedReviewDate = date;
    shuffledCases = getReviewCasesForDate(date);
    casePosition = 0;
    keepReviewPosition = true;
    updateReviewDateButton();
    startNextCase();
  }

  // 当天剩余股票全部处理完后自动切换到下一个仍有未处理股票的日期
  function resolveReviewPosition() {
    if (keepReviewPosition) {
      keepReviewPosition = false;
      return;
    }
    for (;;) {
      while (casePosition < shuffledCases.length && isReviewCaseDone(shuffledCases[casePosition])) casePosition++;
      if (casePosition < shuffledCases.length) return;
      const nextDate = reviewDates.find(date => date > selectedReviewDate
        && getReviewCasesForDate(date).some(item => !isReviewCaseDone(item)));
      if (!nextDate) return;
      selectedReviewDate = nextDate;
      shuffledCases = getReviewCasesForDate(nextDate);
      casePosition = 0;
      updateReviewDateButton();
    }
  }

  function toggleReviewCalendar(forceOpen) {
    const calendar = document.getElementById('reviewCalendar');
    const open = typeof forceOpen === 'boolean' ? forceOpen : calendar.hidden;
    if (open && !reviewDates.length) return;
    calendar.hidden = !open;
    document.getElementById('reviewDateButton').setAttribute('aria-expanded', String(open));
    if (!open) return;
    toggleReviewWheel(false);
    const [year, month] = selectedReviewDate.split('-').map(Number);
    calendarYear = year;
    calendarMonth = month;
    renderReviewCalendar();
    positionReviewCalendar();
  }

  function positionReviewCalendar() {
    const calendar = document.getElementById('reviewCalendar');
    if (calendar.hidden) return;
    const rect = document.getElementById('reviewDateButton').getBoundingClientRect();
    const left = Math.max(4, Math.min(rect.left, window.innerWidth - calendar.offsetWidth - 4));
    calendar.style.left = `${left}px`;
    calendar.style.top = `${rect.bottom + 4}px`;
  }
  window.addEventListener('resize', positionReviewCalendar);

  function shiftReviewCalendarMonth(delta) {
    const index = calendarYear * 12 + calendarMonth - 1 + delta;
    calendarYear = Math.floor(index / 12);
    calendarMonth = index % 12 + 1;
    renderReviewCalendar();
  }

  function changeReviewCalendarView() {
    calendarYear = Number(document.getElementById('reviewCalendarYear').value);
    calendarMonth = Number(document.getElementById('reviewCalendarMonth').value);
    renderReviewCalendar();
  }

  function renderReviewCalendar() {
    const firstYear = Number(reviewDates[0].slice(0, 4));
    const lastYear = Number(reviewDates[reviewDates.length - 1].slice(0, 4));
    const yearSelect = document.getElementById('reviewCalendarYear');
    const monthSelect = document.getElementById('reviewCalendarMonth');
    yearSelect.replaceChildren(...Array.from({ length: lastYear - firstYear + 1 }, (_, i) => {
      const option = new Option(`${firstYear + i}年`, String(firstYear + i));
      return option;
    }));
    monthSelect.replaceChildren(...Array.from({ length: 12 }, (_, i) => new Option(`${i + 1}月`, String(i + 1))));
    yearSelect.value = String(calendarYear);
    monthSelect.value = String(calendarMonth);
    const monthIndex = calendarYear * 12 + calendarMonth - 1;
    document.getElementById('reviewCalendarPrev').disabled = monthIndex <= firstYear * 12;
    document.getElementById('reviewCalendarNext').disabled = monthIndex >= lastYear * 12 + 11;

    const grid = document.getElementById('reviewCalendarGrid');
    const cells = ['日', '一', '二', '三', '四', '五', '六'].map(name => {
      const cell = document.createElement('div');
      cell.className = 'review-calendar-weekday';
      cell.textContent = name;
      return cell;
    });
    const leading = new Date(calendarYear, calendarMonth - 1, 1).getDay();
    for (let i = 0; i < leading; i++) cells.push(document.createElement('div'));
    const daysInMonth = new Date(calendarYear, calendarMonth, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
      const date = `${calendarYear}-${String(calendarMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'review-calendar-day';
      button.textContent = String(day);
      const dayPnl = getReviewPnlByDate().get(date);
      const label = document.createElement('span');
      label.className = 'review-calendar-pnl';
      if (dayPnl) {
        label.textContent = formatPnl(dayPnl.sum / dayPnl.count);
        label.classList.add(dayPnl.sum > 0 ? 'is-up' : dayPnl.sum < 0 ? 'is-down' : 'is-flat');
      } else {
        // 占位文本与最宽的盈亏文本等宽，保证所有日期格大小一致
        label.textContent = '+10.00%';
        label.classList.add('is-empty');
      }
      button.appendChild(label);
      const dayCases = reviewDates.includes(date) ? getReviewCasesForDate(date) : [];
      button.disabled = !dayCases.length;
      if (dayCases.length && dayCases.every(isReviewCaseDone)) button.classList.add('is-done');
      if (date === selectedReviewDate) button.classList.add('is-selected');
      button.addEventListener('click', () => changeReviewDate(date));
      cells.push(button);
    }
    grid.replaceChildren(...cells);
  }

  function toggleReviewWheel(forceOpen) {
    const wheel = document.getElementById('reviewStockWheel');
    const open = typeof forceOpen === 'boolean' ? forceOpen : wheel.hidden;
    wheel.hidden = !open;
    document.getElementById('reviewWheelToggle').setAttribute('aria-expanded', String(open));
    if (open) {
      toggleReviewCalendar(false);
      updateReviewWheel();
    }
  }

  function updateReviewWheel() {
    const list = document.getElementById('reviewWheelList');
    if (!list || !isDailyReviewSource() || document.getElementById('reviewStockWheel').hidden) return;
    const fragment = document.createDocumentFragment();
    shuffledCases.forEach((item, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'review-wheel-item';
      button.dataset.caseIndex = String(index);
      const name = document.createElement('span');
      name.className = 'review-wheel-name';
      name.textContent = item.stockName || item.marketCode || item.code || '未知股票';
      button.appendChild(name);
      button.title = `${name.textContent} ${item.date || ''}`;
      const pnl = reviewPnlResults.get(String(item.id));
      if (pnl && boughtReviewCaseIds.has(String(item.id))) {
        const pnlLabel = document.createElement('span');
        pnlLabel.className = 'review-wheel-pnl';
        pnlLabel.textContent = ` ${formatPnl(pnl.pnlPct)}`;
        button.appendChild(pnlLabel);
      }
      if (index === casePosition) button.classList.add('is-current');
      if (boughtReviewCaseIds.has(String(item.id))) button.classList.add('is-bought');
      else if (skippedReviewCaseIds.has(String(item.id))) button.classList.add('is-skipped');
      button.addEventListener('click', () => selectReviewCase(index));
      fragment.appendChild(button);
    });
    list.replaceChildren(fragment);
    const current = list.querySelector('.is-current');
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  function selectReviewCase(index) {
    if (!isDailyReviewSource() || index < 0 || index >= shuffledCases.length) return;
    toggleReviewWheel(false);
    if (index === casePosition && activeCase?.id === shuffledCases[index].id) return;
    casePosition = index;
    caseResolved = false;
    keepReviewPosition = true;
    startNextCase();
  }

  function markReviewCaseSkipped() {
    if (!isDailyReviewSource() || !activeCase?.id) return;
    skippedReviewCaseIds.add(String(activeCase.id));
    updateReviewWheel();
    updateTestProgress();
  }

  function getProgressStorageKey() {
    const source = document.getElementById('dataSource').value;
    const fileName = document.getElementById('testCaseFile').value;
    if (!fileName) return '';
    if (source === 'dailyReview') return `kline-replay-progress:daily:${fileName}`;
    return `kline-replay-progress:v2:${source}:${fileName}`;
  }

  function hasReviewProgress() {
    return skippedReviewCaseIds.size > 0 || boughtReviewCaseIds.size > 0;
  }

  function saveReviewProgress(key) {
    if (!loadedReviewFile || loadedReviewFile !== document.getElementById('testCaseFile').value) return;
    if (!hasReviewProgress()) {
      localStorage.removeItem(key);
      return;
    }
    try {
      localStorage.setItem(key, JSON.stringify({
        selectedReviewDate,
        skippedReviewCaseIds: [...skippedReviewCaseIds],
        boughtReviewCaseIds: [...boughtReviewCaseIds],
        boughtReviewViews: [...boughtReviewViews],
        reviewPnlResults: [...reviewPnlResults],
        boughtStockNames,
        savedAt: new Date().toISOString(),
      }));
    } catch (error) {
      console.warn('保存每日复盘进度失败:', error.message);
    }
  }

  function readReviewProgress(key) {
    try {
      const saved = JSON.parse(localStorage.getItem(key) || 'null');
      if (!saved || !/^\d{4}-\d{2}-\d{2}$/.test(saved.selectedReviewDate || '')) return null;
      const doneCount = (saved.skippedReviewCaseIds?.length || 0) + (saved.boughtReviewCaseIds?.length || 0);
      return doneCount ? saved : null;
    } catch (error) {
      console.warn('读取每日复盘进度失败:', error.message);
      return null;
    }
  }

  // 恢复后若保存的日期已不存在则忽略
  function applyReviewProgress(saved) {
    if (!reviewDates.includes(saved.selectedReviewDate)) return false;
    selectedReviewDate = saved.selectedReviewDate;
    skippedReviewCaseIds = new Set((saved.skippedReviewCaseIds || []).map(String));
    boughtReviewCaseIds = new Set((saved.boughtReviewCaseIds || []).map(String));
    boughtReviewViews = new Map(saved.boughtReviewViews || []);
    reviewPnlResults = new Map(saved.reviewPnlResults || []);
    boughtStockNames = Array.isArray(saved.boughtStockNames) ? saved.boughtStockNames : [];
    updateReviewDateButton();
    return true;
  }

  function describeReviewProgress(saved) {
    const dayCases = getReviewCasesForDate(saved.selectedReviewDate);
    const ids = new Set([...(saved.skippedReviewCaseIds || []), ...(saved.boughtReviewCaseIds || [])].map(String));
    const done = dayCases.filter(item => ids.has(String(item.id))).length;
    const [year, month, day] = saved.selectedReviewDate.split('-');
    return `${year}年${Number(month)}月${Number(day)}日，当天已测试 ${done}/${dayCases.length}`;
  }

  function saveProgressCheckpoint() {
    const key = getProgressStorageKey();
    if (isDailyReviewSource()) {
      if (key) saveReviewProgress(key);
      return;
    }
    if (!key || !shuffledCases.length) return;
    const checkpointPosition = caseResolved ? casePosition + 1 : casePosition;
    if (checkpointPosition === 0 && successCount === 0 && failureCount === 0
      && !boughtStockNames.length && !skippedReviewCaseIds.size) {
      localStorage.removeItem(key);
      return;
    }
    try {
      localStorage.setItem(key, JSON.stringify({
        shuffledCases,
        // 已结算的用例下次直接从下一条开始，避免 iPhone 被挂起后重复计数。
        casePosition: checkpointPosition,
        successCount,
        failureCount,
        boughtStockNames,
        skippedReviewCaseIds: [...skippedReviewCaseIds],
        savedAt: new Date().toISOString(),
      }));
    } catch (error) {
      console.warn('保存回测进度失败:', error.message);
    }
  }

  function readProgressCheckpoint() {
    const key = getProgressStorageKey();
    if (!key) return null;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || 'null');
      if (!saved || !Array.isArray(saved.shuffledCases) || !saved.shuffledCases.length) return null;
      if (Number(saved.casePosition) === 0 && !Number(saved.successCount) && !Number(saved.failureCount)
      && (!Array.isArray(saved.boughtStockNames) || !saved.boughtStockNames.length)
      && (!Array.isArray(saved.skippedReviewCaseIds) || !saved.skippedReviewCaseIds.length)) {
        localStorage.removeItem(key);
        return null;
      }
      return saved;
    } catch (error) {
      console.warn('读取回测进度失败:', error.message);
      return null;
    }
  }

  function clearProgressCheckpoint() {
    const key = getProgressStorageKey();
    if (!key) return;
    localStorage.removeItem(key);
  }

  function setTestButtons(enabled) {
    document.getElementById('buyButton').disabled = !enabled;
    document.getElementById('nextCaseButton').disabled = !activeCase || (!enabled && !caseResolved);
  }

  function updateTestProgress() {
    document.getElementById('successCount').innerText = successCount;
    document.getElementById('failureCount').innerText = failureCount;
    if (isDailyReviewSource()) {
      const done = shuffledCases.filter(isReviewCaseDone).length;
      document.getElementById('totalCount').innerText = `${done}/${shuffledCases.length}`;
    } else {
      document.getElementById('totalCount').innerText = `${Math.min(casePosition + 1, shuffledCases.length)}/${shuffledCases.length}`;
    }
    document.getElementById('dailyRecordStatus').innerText = currentCaseBought ? ' 已加入记录' : '';
    updateReviewPnlBoard();
    saveProgressCheckpoint();
  }

  function formatPnl(value) {
    return `${value > 0 ? '+' : ''}${value.toFixed(2)}%`;
  }

  // 各日盈亏 = 当日所有盈亏点数之和 / 当日买入数
  function getReviewPnlByDate() {
    const byDate = new Map();
    reviewPnlResults.forEach(({ date, pnlPct }) => {
      const entry = byDate.get(date) || { sum: 0, count: 0 };
      entry.sum += pnlPct;
      entry.count++;
      byDate.set(date, entry);
    });
    return byDate;
  }

  // 当日盈亏 = 当日所有盈亏点数之和 / 当日买入数；累计盈亏 = 各日盈亏之和
  function updateReviewPnlBoard() {
    const board = document.getElementById('reviewPnlBoard');
    board.hidden = !isDailyReviewSource();
    if (board.hidden) return;
    const byDate = getReviewPnlByDate();
    const format = (value, el) => {
      el.innerText = value === null ? '--' : formatPnl(value);
      el.style.color = value === null || value === 0 ? '' : value > 0 ? '#d9363e' : '#1f9d55';
    };
    const day = byDate.get(selectedReviewDate);
    let total = 0;
    byDate.forEach(({ sum, count }) => { total += sum / count; });
    format(day ? day.sum / day.count : null, document.getElementById('reviewDayPnl'));
    format(byDate.size ? total : null, document.getElementById('reviewTotalPnl'));
  }

  function clearTradeDrawing() {
    if (priceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(priceLine);
    }
    if (sellPriceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(sellPriceLine);
    }
    priceLine = null;
    sellPriceLine = null;
    candleMarkers = [];
    if (candlestickSeries) setCandleMarkers(candleMarkers);
  }

  function setCandleMarkers(markers) {
    if (typeof candlestickSeries.setMarkers === 'function') {
      candlestickSeries.setMarkers(markers);
      return;
    }
    if (!markerController && LightweightCharts.createSeriesMarkers) {
      markerController = LightweightCharts.createSeriesMarkers(candlestickSeries, markers);
    } else if (markerController) {
      markerController.setMarkers(markers);
    }
  }

  function drawTradeMarker() {
    if (!activeTrade) return;
    if (priceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(priceLine);
      priceLine = null;
    }
    if (sellPriceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(sellPriceLine);
      sellPriceLine = null;
    }
    candleMarkers = [{
      time: activeTrade.buyDate,
      position: 'belowBar',
      color: '#f0b90b',
      shape: 'arrowUp',
      text: 'B',
    }];
    if (activeTrade.sellDate) {
      candleMarkers.push({
        time: activeTrade.sellDate,
        position: 'aboveBar',
        color: '#4cc9f0',
        shape: 'arrowDown',
        text: 'S',
      });
      sellPriceLine = candlestickSeries.createPriceLine({
        price: activeTrade.sellPrice,
        color: '#4cc9f0',
        lineWidth: 2,
        lineStyle: 2,
        axisLabelVisible: true,
        title: '卖出',
      });
    }
    setCandleMarkers(candleMarkers);
    priceLine = candlestickSeries.createPriceLine({
      price: activeTrade.buyPrice,
      color: '#f0b90b',
      lineWidth: 2,
      lineStyle: 2,
      axisLabelVisible: true,
      title: '买入',
    });
  }

  function initChart() {
    const container = document.getElementById('chartContainer');
    
    chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: container.clientHeight,
      layout: {
        background: { type: 'solid', color: '#111419' },
        textColor: '#818998',
      },
      grid: {
        vertLines: { color: '#1e232a' },
        horzLines: { color: '#1e232a' },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
      },
      rightPriceScale: {
        borderColor: '#2b2f36',
      },
      timeScale: {
        borderColor: '#2b2f36',
        timeVisible: false,
      },
      handleScroll: {
        mouseWheel: true,
        pressedMouseMove: true,
        horzTouchDrag: true,
        vertTouchDrag: false,
      },
      handleScale: {
        mouseWheel: true,
        pinch: true,
        axisPressedMouseMove: false,
        axisDoubleClickReset: true,
      },
    });

    const resizeChart = () => chart.resize(container.clientWidth, container.clientHeight);
    window.addEventListener('resize', resizeChart);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeChart).observe(container);
    }

    // 1. K 线主图层
    candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#ff3333',
      downColor: '#00b050',
      borderVisible: false,
      wickUpColor: '#ff3333',
      wickDownColor: '#00b050',
    });

    // 【关键配置 1】：设置 K 线主 Y 轴 (right)，底部留出 30% 的空间给成交量
    chart.priceScale('right').applyOptions({
      autoScale: true,
      scaleMargins: {
        top: 0.05,   // 顶部留白 5%
        bottom: 0.3, // 底部留白 30%（K线不会落入底部30%的成交量区域）
      },
    });

    ma5Series = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#ffb000',
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
    });
    ma10Series = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#00a0e9',
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
    });
    ma20Series = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#e4007f',
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
    });

    // 2. 成交量图层 (给它单独指定 priceScaleId: 'volume')
    volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: 'volume' },
      priceScaleId: 'volume', // 指定独立 Y 轴
      priceLineVisible: false , 
      lastValueVisible: false
    });

    // 【关键配置 2】：设置成交量专属 Y 轴的高度比例与隐藏数字
    chart.priceScale('volume').applyOptions({
      autoScale: true,
      scaleMargins: {
        top: 0.8,   // 顶部留白 80% -> 即成交量最高只占底部 20% 高度
        bottom: 0,
      },
      visible: true, // 隐藏成交量 Y 轴右侧的数字，避免和 K 线价格重叠
    });

    // 十字光标移动监听
    chart.subscribeCrosshairMove(param => {
      if (!param.time || !param.seriesData) return;
      const candle = param.seriesData.get(candlestickSeries);

      if (candle) {
        document.getElementById('codeVal').innerText = displayCodeLabel();
        document.getElementById('dateVal').innerText = `日期: ${param.time}`;
        const hoveredData = fullData.find(item => item.date === param.time);
        document.getElementById('amountVal').innerText = formatAmount(hoveredData?.amount);
      }
    });
  }

  // 核心更新逻辑：将数据写入各个 Series
  function updateChartData() {
    const displayData = fullData.slice(0, currentIndex);

    if (displayData.length === 0) return;

    // 格式化 TradingView 所需数据结构（确保 date 格式为字符串 "YYYY-MM-DD"）
    const candles = [];
    const volumes = [];
    const ma5Data = [];
    const ma10Data = [];
    const ma20Data = [];

    displayData.forEach(d => {
      // 提取纯 YYYY-MM-DD 日期
      const timeStr = typeof d.date === 'string' ? d.date.split('T')[0] : d.date;
      const candleColor = {
        'limit-up': '#f0b90b',
        'touch-limit-up-up': '#ff69b4',
        'touch-limit-up-down': '#c2185b',
        'limit-down': '#8e44ad',
        up: '#ff3333',
        down: '#00b050',
      }[d.limitStatus] || (Number(d.close) >= Number(d.open) ? '#ff3333' : '#00b050');

      candles.push({
        time: timeStr,
        open: Number(d.open),
        high: Number(d.high),
        low: Number(d.low),
        close: Number(d.close),
        color: candleColor,
        borderColor: candleColor,
        wickColor: candleColor
      });

      volumes.push({
        time: timeStr,
        value: Number(d.volume),
        color: `${candleColor}80`
      });

      if (d.ma5 !== null && d.ma5 !== undefined) {
        ma5Data.push({ time: timeStr, value: Number(d.ma5) });
      }
      if (d.ma10 !== null && d.ma10 !== undefined) {
        ma10Data.push({ time: timeStr, value: Number(d.ma10) });
      }
      if (d.ma20 !== null && d.ma20 !== undefined) {
        ma20Data.push({ time: timeStr, value: Number(d.ma20) });
      }

    });

    // 写入数据到序列
    candlestickSeries.setData(candles);
    volumeSeries.setData(volumes);
    ma5Series.setData(ma5Data);
    ma10Series.setData(ma10Data);
    ma20Series.setData(ma20Data);
    if (activeTrade) drawTradeMarker();

    // 【修正缩放】：使用 setVisibleRange 代替 Range index
    if (candles.length > 0) {
      const startIndex = Math.max(0, candles.length - DEFAULT_VISIBLE_CANDLE_COUNT);
      chart.timeScale().setVisibleRange({
        from: candles[startIndex].time,
        to: candles[candles.length - 1].time,
      });
    }

    // 更新 Legend
    const last = displayData[displayData.length - 1];
    if (last) {
      document.getElementById('codeVal').innerText = displayCodeLabel();
      document.getElementById('dateVal').innerText = `日期: ${last.date}`;
      document.getElementById('amountVal').innerText = formatAmount(last.amount);
    }
  }

  function updateFavoriteGroups() {
    const select = document.getElementById('favoriteGroup');
    const current = select.value;
    select.options.length = 0;
    Object.keys(favoriteGroups).forEach(group => {
      const option = document.createElement('option');
      option.value = group;
      option.textContent = group;
      select.appendChild(option);
    });
    if (current && favoriteGroups[current]) select.value = current;
    if (!select.options.length) {
      const option = document.createElement('option');
      option.value = '默认';
      option.textContent = '默认';
      select.appendChild(option);
    }
    updateFavoriteButton();
  }

  function updateFavoriteButton() {
    const button = document.getElementById('favoriteButton');
    if (!button) return;
    const group = document.getElementById('favoriteGroup').value || '默认';
    const saved = Boolean(activeCase && favoriteGroups[group]?.some(item => (
      item.code === activeCase.code && item.date === activeCase.date
    )));
    favoriteSaved = saved;
    button.textContent = saved ? '★' : '☆';
    button.classList.toggle('is-saved', saved);
    button.disabled = isDailyReviewSource() || !activeCase;
    button.setAttribute('aria-label', saved ? '取消收藏' : '添加收藏');
    button.title = saved ? '取消收藏' : '添加收藏';
  }

  function updateDataSourceOptions(files) {
    const select = document.getElementById('testCaseFile');
    const source = document.getElementById('dataSource').value;
    select.options.length = 1;
    select.options[0].textContent = source === 'favorites'
      ? '请选择收藏分组'
      : source === 'testcases' ? '请选择测试用例 JSON' : '请选择每日复盘 JSON';
    files.forEach(file => {
      const option = document.createElement('option');
      option.value = file;
      option.textContent = file;
      select.appendChild(option);
    });
  }

  function switchDataSource() {
    const source = document.getElementById('dataSource').value;
    if (source === 'favorites') {
      updateDataSourceOptions(Object.keys(favoriteGroups));
    } else {
      loadFilesForSource();
    }
    updateSourceMode();
  }

  function loadDailyReviewFiles() {
    const status = document.getElementById('testStatus');
    fetch(`/api/daily-review?ts=${Date.now()}`, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(res => {
        if (res.status_code !== 0 || !Array.isArray(res.files)) {
          throw new Error(res.msg || '每日复盘接口返回格式错误');
        }
        updateDataSourceOptions(res.files);
        if (!res.files.length) status.innerText = 'daily-review 文件夹中没有 JSON 文件';
      })
      .catch(error => {
        status.innerText = `无法读取测试用例: ${error.message}`;
      });
  }

  function loadTestCaseFiles() {
    const status = document.getElementById('testStatus');
    fetch(`/api/test-cases?ts=${Date.now()}`, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(res => {
        if (res.status_code !== 0 || !Array.isArray(res.files)) {
          throw new Error(res.msg || '测试用例接口返回格式错误');
        }
        updateDataSourceOptions(res.files);
        if (!res.files.length) status.innerText = 'test-cases 文件夹中没有 JSON 文件';
      })
      .catch(error => {
        status.innerText = `无法读取测试用例: ${error.message}`;
      });
  }

  function loadTestCaseFile() {
    const fileName = document.getElementById('testCaseFile').value;
    if (!fileName) return;
    const source = document.getElementById('dataSource').value;
    const request = source === 'favorites'
      ? fetch('/api/favorites').then(res => res.json()).then(res => ({
        status_code: res.status_code,
        data: res.data?.groups?.[fileName] || [],
      }))
      : source === 'dailyReview'
        ? fetch(`/api/daily-review/${encodeURIComponent(fileName)}`).then(res => res.json())
        : fetch(`/api/test-cases/${encodeURIComponent(fileName)}`).then(res => res.json());
    request
      .then(res => {
        if (res.status_code !== 0 || !res.data.length) {
          alert(res.msg || 'JSON 中没有有效每日复盘数据');
          return;
        }
        testCases = res.data;
        if (isDailyReviewSource()) {
          loadedReviewFile = '';
          initReviewDates(testCases);
          const key = getProgressStorageKey();
          const saved = key ? readReviewProgress(key) : null;
          if (saved && reviewDates.includes(saved.selectedReviewDate)
            && confirm(`检测到未完成的每日复盘进度（${describeReviewProgress(saved)}），是否继续？`)) {
            applyReviewProgress(saved);
          } else if (key) {
            localStorage.removeItem(key);
          }
          loadedReviewFile = document.getElementById('testCaseFile').value;
          startDailyReviewSession();
          return;
        }
        const savedProgress = readProgressCheckpoint();
        const resume = savedProgress && confirm(`检测到未完成的回测进度（${savedProgress.casePosition}/${savedProgress.shuffledCases.length}），是否继续？`);
        if (resume) {
          shuffledCases = savedProgress.shuffledCases;
          casePosition = Math.min(Number(savedProgress.casePosition) || 0, shuffledCases.length);
          successCount = Number(savedProgress.successCount) || 0;
          failureCount = Number(savedProgress.failureCount) || 0;
          boughtStockNames = Array.isArray(savedProgress.boughtStockNames) ? savedProgress.boughtStockNames : [];
        } else {
          if (savedProgress) clearProgressCheckpoint();
          shuffledCases = sortCasesByDate(testCases);
          casePosition = 0;
          successCount = 0;
          failureCount = 0;
          boughtStockNames = [];
          skippedReviewCaseIds = new Set();
        }
        activeTrade = null;
        currentCaseBought = false;
        currentCaseHasFutureData = true;
        updateSourceMode();
        updateTestProgress();
        startNextCase();
      })
      .catch(() => alert('读取测试用例失败'));
  }

  function toggleFavorite() {
    if (isDailyReviewSource()) return;
    if (!activeCase) {
      alert('请先加载一个测试用例');
      return;
    }
    const inputGroup = document.getElementById('newFavoriteGroup').value.trim();
    const group = inputGroup || document.getElementById('favoriteGroup').value || '默认';
    const saved = favoriteGroups[group]?.some(item => (
      item.code === activeCase.code && item.date === activeCase.date
    ));
    if (saved) {
      removeCurrentFavorite(group);
      return;
    }
    saveCurrentFavorite(group);
  }

  function saveCurrentFavorite(group) {
    if (!activeCase) {
      alert('请先加载一个测试用例');
      return;
    }
    if (favoriteGroups[group]?.some(item => (
      item.code === activeCase.code && item.date === activeCase.date
    ))) {
      favoriteSaved = true;
      updateFavoriteButton();
      return;
    }
    fetch('/api/favorites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group, item: activeCase }),
    })
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0) throw new Error(res.msg || '收藏失败');
        favoriteGroups = res.data.groups || {};
        updateFavoriteGroups();
        document.getElementById('favoriteGroup').value = group;
        document.getElementById('newFavoriteGroup').value = '';
        favoriteGroups = res.data.groups || {};
        favoriteSaved = true;
        updateFavoriteButton();
        document.getElementById('testStatus').innerText = `股票代码 ${activeCase.marketCode || activeCase.code} 股票名称 ${activeCase.stockName || '--'} 时间 ${activeCase.date} 添加收藏夹成功`;
      })
      .catch(error => alert(error.message));
  }

  function removeCurrentFavorite(group) {
    fetch('/api/favorites', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        group,
        code: activeCase.code,
        date: activeCase.date,
      }),
    })
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0) throw new Error(res.msg || '取消收藏失败');
        favoriteGroups = res.data.groups || {};
        updateFavoriteGroups();
        favoriteSaved = false;
        updateFavoriteButton();
        document.getElementById('testStatus').innerText = `股票代码 ${activeCase.marketCode || activeCase.code} 股票名称 ${activeCase.stockName || '--'} 时间 ${activeCase.date} 取消收藏成功`;
      })
      .catch(error => alert(error.message));
  }

  function startNextCase() {
    if (isDailyReviewSource()) {
      resolveReviewPosition();
      if (shuffledCases !== preloadedReviewCases) {
        preloadedReviewCases = shuffledCases;
        preloadReviewPnl(shuffledCases);
      }
    }
    if (currentNewsAbortController) currentNewsAbortController.abort();
    document.getElementById('newsPanel').hidden = true;
    currentNews = [];
    currentNewsLoading = false;
    currentNewsError = '';
    document.getElementById('newsButton').disabled = !activeCase;
    clearTradeDrawing();
    activeTrade = null;
    caseResolved = false;
    favoriteSaved = false;
    currentCaseHasFutureData = true;
    updateFavoriteButton();
    updateSourceMode();
    document.getElementById('nextCaseButton').innerText = '空仓';
    if (casePosition >= shuffledCases.length) {
      clearProgressCheckpoint();
      if (isDailyReviewSource()) loadedReviewFile = '';
      activeCase = null;
      updateReviewWheel();
      updateNewsPanel();
      setTestButtons(false);
      document.getElementById('stockNameVal').innerText = '股票名称: --';
      document.getElementById('codeVal').innerText = isDailyReviewSource() ? '每日复盘完成' : '股票代码: --';
      if (isDailyReviewSource()) {
        document.getElementById('testStatus').innerText = boughtStockNames.length
          ? `买入记录：${boughtStockNames.join(' ')}`
          : '每日复盘完成，没有点击买入的股票';
        window.prompt(
          '每日复盘买入股票名称（可直接选择并复制）',
          boughtStockNames.join(' ') || '每日复盘完成，没有点击买入的股票'
        );
      } else {
        document.getElementById('testStatus').innerText = `回测结束，成功率 ${(successCount / (successCount + failureCount || 1) * 100).toFixed(2)}%`;
        alert(`回测结束\n成功：${successCount}\n失败：${failureCount}\n成功率：${(successCount / (successCount + failureCount || 1) * 100).toFixed(2)}%`);
      }
      return;
    }

    activeCase = shuffledCases[casePosition];
    updateReviewWheel();
    updateNewsPanel();
    loadCurrentNews(activeCase);
  currentCaseBought = false;
    updateFavoriteButton();
    document.getElementById('stockNameVal').innerText = '股票名称: --';
    document.getElementById('stockNameVal').style.visibility = 'hidden';
    const requestedCase = activeCase;
    document.getElementById('testStatus').innerText = `${pendingCaseNotice ? `${pendingCaseNotice}；` : ''}正在回放 ${isDailyReviewSource() ? (activeCase.stockName || activeCase.marketCode) : activeCase.marketCode} ${activeCase.date}`;
    pendingCaseNotice = '';
    setTestButtons(false);
    setDailyReviewButtons();

    fetch(`/api/kline?code=${encodeURIComponent(activeCase.code)}&cutoffDate=${encodeURIComponent(activeCase.date)}`, {
      cache: 'no-store',
    })
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0 || !res.data.length) {
          skipUnavailableCase(requestedCase, '行情源没有返回 K 线数据');
          return;
        }
        fullData = res.data;
        const startIndex = fullData.findIndex(item => item.date >= requestedCase.date);
        if (startIndex < 0) {
          skipUnavailableCase(requestedCase, '没有回放日期对应的 K 线');
          return;
        }
        currentCaseHasFutureData = startIndex + 1 < fullData.length;
        currentIndex = startIndex + 1;
        const boughtView = isDailyReviewSource() ? boughtReviewViews.get(String(requestedCase.id)) : null;
        if (boughtView && currentCaseHasFutureData) {
          activeTrade = boughtView.trade;
          currentIndex = Math.min(boughtView.shown, fullData.length);
          updateChartData();
          setTestButtons(true);
          setDailyReviewButtons();
          document.getElementById('nextStepButton').disabled = true;
          document.getElementById('buyButton').disabled = true;
          document.getElementById('nextCaseButton').disabled = false;
          document.getElementById('nextCaseButton').innerText = '继续';
          caseResolved = true;
          document.getElementById('testStatus').innerText = boughtView.message;
          updateTestProgress();
          return;
        }
        updateTestProgress();
        updateChartData();
        setTestButtons(true);
        setDailyReviewButtons();
      })
      .catch(() => {
        if (activeCase === requestedCase) skipUnavailableCase(requestedCase, 'K 线请求失败');
      });
  }

  function skipUnavailableCase(failedCase, reason) {
    if (activeCase !== failedCase) return;
    const name = failedCase.stockName || failedCase.marketCode || failedCase.code;
    pendingCaseNotice = `${name} ${failedCase.date}：${reason}，已跳过`;
    if (isDailyReviewSource()) skippedReviewCaseIds.add(String(failedCase.id));
    casePosition++;
    updateTestProgress();
    startNextCase();
  }

  function finishCurrentCase(message) {
    document.getElementById('testStatus').innerText = message;
    caseResolved = true;
    document.getElementById('buyButton').disabled = true;
    document.getElementById('nextCaseButton').disabled = false;
    document.getElementById('nextCaseButton').innerText = '继续';
    updateTestProgress();
  }

  // 买入时向服务端取收益；服务端已在后台排队预算，算好的直接返回，没算好的优先计算
  function getReviewPnl(item) {
    const query = new URLSearchParams({
      code: item.code,
      date: item.date,
      name: item.stockName || '',
    });
    return fetch(`/api/review-pnl?${query}`, { cache: 'no-store' })
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0) throw new Error(res.msg || '盈亏计算失败');
        return res;
      });
  }

  // 每天开始加载时只提交一次预加载列表，由服务端串行限速异步计算，不占用 K 线请求
  function preloadReviewPnl(items) {
    fetch('/api/review-pnl/preload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: items.map(item => ({ code: item.code, date: item.date, name: item.stockName || '' })),
      }),
    }).catch(() => {});
  }

  function buyDailyReviewWithPnl() {
    const requestedCase = activeCase;
    const buyIndex = currentIndex - 1;
    const buyCandle = fullData[buyIndex];
    boughtReviewCaseIds.add(String(requestedCase.id));
    updateReviewWheel();
    if (!fullData[buyIndex + 1]) {
      finishCurrentCase('没有下一根 K 线，无法计算盈亏');
      return;
    }
    document.getElementById('buyButton').disabled = true;
    document.getElementById('nextStepButton').disabled = true;
    document.getElementById('nextCaseButton').disabled = true;
    document.getElementById('testStatus').innerText = '正在获取逐笔成交并计算盈亏...';

    const entryDate = buyCandle.date;
    getReviewPnl(requestedCase)
      .then(res => ({ res }), error => ({ error }))
      .then(({ res, error }) => {
        if (activeCase !== requestedCase) return;
        const entryIndex = buyIndex + 1;
        let message;
        let trade = null;
        let shown = Math.min(entryIndex + 8, fullData.length);
        if (res) {
          trade = {
            buyDate: res.buyDate,
            buyPrice: res.buyChartPrice,
            sellDate: res.sellDate,
            sellPrice: res.sellChartPrice,
            pnlPct: res.pnlPct,
          };
          const sellIndex = fullData.findIndex(item => item.date === res.sellDate);
          if (sellIndex >= 0) shown = Math.min(Math.max(shown, sellIndex + 3), fullData.length);
          else shown = fullData.length;
          const sign = res.pnlPct > 0 ? '+' : '';
          message = `买入 ${res.buyPrice}（${res.buyDate}）卖出 ${res.sellPrice}（${res.sellDate} ${res.sellTick.time}）盈亏 ${sign}${res.pnlPct}%：${res.sellReason}`;
          reviewPnlResults.set(String(requestedCase.id), { date: reviewCaseDate(requestedCase), pnlPct: res.pnlPct });
          updateReviewWheel();
          updateReviewDateButton();
        } else {
          message = `${error.message}，已展示后续 K 线`;
        }
        activeTrade = trade;
        currentIndex = shown;
        updateChartData();
        finishCurrentCase(message);
        boughtReviewViews.set(String(requestedCase.id), { shown, message, trade });
        saveProgressCheckpoint();
      });
  }

  function buyAtCurrentCandle() {
    if (!activeCase || activeTrade || currentIndex === 0) return;
    if (isDailyReviewSource()) {
      if (!currentCaseHasFutureData) {
        boughtReviewCaseIds.add(String(activeCase.id));
        updateReviewWheel();
        boughtStockNames.push(activeCase.stockName || activeCase.marketCode || activeCase.code);
        currentCaseBought = true;
        finishCurrentCase(`已记录买入：${activeCase.stockName || activeCase.marketCode || activeCase.code}`);
      } else {
        buyDailyReviewWithPnl();
      }
      return;
    }
    const buyIndex = currentIndex - 1;
    const entryIndex = buyIndex + 1;
    const resultIndex = buyIndex + 2;
    const entryCandle = fullData[entryIndex];
    const resultCandle = fullData[resultIndex];
    if (!entryCandle || !resultCandle) {
      finishCurrentCase('没有下一根 K 线，跳过本用例');
      return;
    }

    activeTrade = {
      buyDate: entryCandle.date,
      buyPrice: Number(entryCandle.close),
    };
    // 展示 B 点以及其后的 7 根 K 线
    currentIndex = Math.min(entryIndex + 8, fullData.length);
    updateChartData();

    const reachedLimitUp = resultCandle.limitStatus === 'limit-up'
      || resultCandle.limitStatus.startsWith('touch-limit-up-');
    if (reachedLimitUp) {
      successCount++;
      finishCurrentCase(`成功：${resultCandle.date} 为 B 点后的第二根 K 线且最高价达到涨停价`);
    } else {
      failureCount++;
      finishCurrentCase(`失败：${resultCandle.date} 为 B 点后的第二根 K 线且最高价未达到涨停价`);
    }
  }

  function nextTestCase() {
    if (!activeCase) return;
    if (isDailyReviewSource() && !currentCaseHasFutureData) {
      caseResolved = true;
      markReviewCaseSkipped();
      document.getElementById('buyButton').disabled = true;
      document.getElementById('nextCaseButton').innerText = '继续';
      if (casePosition + 1 < shuffledCases.length) {
        casePosition++;
        caseResolved = false;
        updateTestProgress();
        startNextCase();
      } else {
        casePosition++;
        caseResolved = false;
        startNextCase();
      }
      return;
    }
    if (!caseResolved) {
      const buyIndex = currentIndex - 1;
      const entryIndex = buyIndex + 1;
      currentIndex = Math.min(entryIndex + 8, fullData.length);
      updateChartData();
      caseResolved = true;
      if (isDailyReviewSource()) markReviewCaseSkipped();
      document.getElementById('buyButton').disabled = true;
      document.getElementById('nextCaseButton').innerText = '继续';
      document.getElementById('testStatus').innerText = '空仓：已展示后续 K 线，再次点击进入下一题';
      return;
    }
    clearTradeDrawing();
    activeTrade = null;
    casePosition++;
    caseResolved = false;
    updateTestProgress();
    startNextCase();
  }

  // 快捷键推进
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      nextStep();
    }
  });

  function requestLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  }

  window.addEventListener('pointerdown', requestLandscape, { once: true });
  window.addEventListener('pagehide', saveProgressCheckpoint);

  function nextStep() {
    if (currentIndex < fullData.length && currentCaseHasFutureData) {
      currentIndex++;
      updateChartData();
    }
  }

  window.onload = () => {
    initChart();
    loadFilesForSource();
    updateSourceMode();
    fetch('/api/favorites')
      .then(res => res.json())
      .then(res => {
        favoriteGroups = res.data?.groups || {};
        updateFavoriteGroups();
      })
      .catch(() => updateFavoriteGroups());
    requestLandscape();
  };
</script>

</body>
</html>
