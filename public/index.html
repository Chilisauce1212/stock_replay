  function startNextCase() {
    if (isDailyReviewSource()) {
      resolveReviewPosition();
      if (shuffledCases !== preloadedReviewCases) {
        preloadedReviewCases = shuffledCases;
        preloadReviewPnl(shuffledCases);
      }
    }
    if (currentNewsAbortController) currentNewsAbortController.abort();
    document.getElementById('newsPanel').hidden = true;
    currentNews = [];
    currentNewsLoading = false;
    currentNewsError = '';
    document.getElementById('newsButton').disabled = !activeCase;
    clearTradeDrawing();
    activeTrade = null;
    caseResolved = false;
    favoriteSaved = false;
    currentCaseHasFutureData = true;
    updateFavoriteButton();
    updateSourceMode();
    document.getElementById('nextCaseButton').innerText = '空仓';
    if (casePosition >= shuffledCases.length) {
      clearProgressCheckpoint();
      if (isDailyReviewSource()) loadedReviewFile = '';
      activeCase = null;
      updateReviewWheel();
      updateNewsPanel();
      setTestButtons(false);
      document.getElementById('stockNameVal').innerText = '股票名称: --';
      document.getElementById('codeVal').innerText = isDailyReviewSource() ? '每日复盘完成' : '股票代码: --';
      if (isDailyReviewSource()) {
        document.getElementById('testStatus').innerText = boughtStockNames.length
          ? `买入记录：${boughtStockNames.join(' ')}`
          : '每日复盘完成，没有点击买入的股票';
        window.prompt(
          '每日复盘买入股票名称（可直接选择并复制）',
          boughtStockNames.join(' ') || '每日复盘完成，没有点击买入的股票'
        );
      } else {
        document.getElementById('testStatus').innerText = `回测结束，成功率 ${(successCount / (successCount + failureCount || 1) * 100).toFixed(2)}%`;
        alert(`回测结束\n成功：${successCount}\n失败：${failureCount}\n成功率：${(successCount / (successCount + failureCount || 1) * 100).toFixed(2)}%`);
      }
      return;
    }

    activeCase = shuffledCases[casePosition];
    updateReviewWheel();
    updateNewsPanel();
    loadCurrentNews(activeCase);
  currentCaseBought = false;
    updateFavoriteButton();
    document.getElementById('stockNameVal').innerText = '股票名称: --';
    document.getElementById('stockNameVal').style.visibility = 'hidden';
    const requestedCase = activeCase;
    document.getElementById('testStatus').innerText = `${pendingCaseNotice ? `${pendingCaseNotice}；` : ''}正在回放 ${isDailyReviewSource() ? (activeCase.stockName || activeCase.marketCode) : activeCase.marketCode} ${activeCase.date}`;
    pendingCaseNotice = '';
    setTestButtons(false);
    setDailyReviewButtons();

    fetch(`/api/kline?code=${encodeURIComponent(activeCase.code)}&cutoffDate=${encodeURIComponent(activeCase.date)}`, {
      cache: 'no-store',
    })
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0 || !res.data.length) {
          skipUnavailableCase(requestedCase, '行情源没有返回 K 线数据');
          return;
        }
        fullData = res.data;
        const startIndex = fullData.findIndex(item => item.date >= requestedCase.date);
        if (startIndex < 0) {
          skipUnavailableCase(requestedCase, '没有回放日期对应的 K 线');
          return;
        }
        currentCaseHasFutureData = startIndex + 1 < fullData.length;
        currentIndex = startIndex + 1;
        const boughtView = isDailyReviewSource() ? boughtReviewViews.get(String(requestedCase.id)) : null;
        if (boughtView && currentCaseHasFutureData) {
          activeTrade = boughtView.trade;
          currentIndex = Math.min(boughtView.shown, fullData.length);
          updateChartData();
          setTestButtons(true);
          setDailyReviewButtons();
          document.getElementById('nextStepButton').disabled = true;
          document.getElementById('buyButton').disabled = true;
          document.getElementById('nextCaseButton').disabled = false;
          document.getElementById('nextCaseButton').innerText = '继续';
          caseResolved = true;
          document.getElementById('testStatus').innerText = boughtView.message;
          updateTestProgress();
          return;
        }
        updateTestProgress();
        updateChartData();
        setTestButtons(true);
        setDailyReviewButtons();
      })
      .catch(() => {
        if (activeCase === requestedCase) skipUnavailableCase(requestedCase, 'K 线请求失败');
      });
  }

  function skipUnavailableCase(failedCase, reason) {
    if (activeCase !== failedCase) return;
    const name = failedCase.stockName || failedCase.marketCode || failedCase.code;
    pendingCaseNotice = `${name} ${failedCase.date}：${reason}，已跳过`;
    if (isDailyReviewSource()) skippedReviewCaseIds.add(String(failedCase.id));
    casePosition++;
    updateTestProgress();
    startNextCase();
  }

  function finishCurrentCase(message) {
    document.getElementById('testStatus').innerText = message;
    caseResolved = true;
    document.getElementById('buyButton').disabled = true;
    document.getElementById('nextCaseButton').disabled = false;
    document.getElementById('nextCaseButton').innerText = '继续';
    updateTestProgress();
  }

  // 买入时向服务端取收益；服务端已在后台排队预算，算好的直接返回，没算好的优先计算
  function getReviewPnl(item) {
    const query = new URLSearchParams({
      code: item.code,
      date: item.date,
      name: item.stockName || '',
    });
    return fetch(`/api/review-pnl?${query}`, { cache: 'no-store' })
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0) throw new Error(res.msg || '盈亏计算失败');
        return res;
      });
  }

  // 每天开始加载时只提交一次预加载列表，由服务端串行限速异步计算，不占用 K 线请求
  function preloadReviewPnl(items) {
    fetch('/api/review-pnl/preload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: items.map(item => ({ code: item.code, date: item.date, name: item.stockName || '' })),
      }),
    }).catch(() => {});
  }

  function buyDailyReviewWithPnl() {
    const requestedCase = activeCase;
    const existingIndex = portfolioTrades.findIndex(trade => trade.id === String(requestedCase.id));
    const existingTrade = existingIndex >= 0 ? portfolioTrades[existingIndex] : null;
    if (existingTrade
      && Number(existingTrade.portfolioSchemaVersion) >= PORTFOLIO_SCHEMA_VERSION
      && Number(existingTrade.pnlRulesVersion) >= PORTFOLIO_PNL_RULES_VERSION) {
      boughtReviewCaseIds.add(String(requestedCase.id));
      updateReviewWheel();
      finishCurrentCase('该标的已记录在本文件账户中，未重复下单');
      return;
    }
    if (!existingTrade && getBoughtCountForSignalDate(reviewCaseDate(requestedCase)) >= 2) {
      document.getElementById('buyButton').disabled = true;
      document.getElementById('testStatus').innerText = '当日最多买入2只，请点击空仓逐只查看剩余候选';
      return;
    }
    const buyIndex = currentIndex - 1;
    if (!fullData[buyIndex + 1]) {
      finishCurrentCase('没有下一根 K 线，无法计算盈亏');
      return;
    }
    document.getElementById('buyButton').disabled = true;
    document.getElementById('nextStepButton').disabled = true;
    document.getElementById('nextCaseButton').disabled = true;
    document.getElementById('testStatus').innerText = '正在获取逐笔成交并计算盈亏...';

    getReviewPnl(requestedCase)
      .then(res => ({ res }), error => ({ error }))
      .then(({ res, error }) => {
        if (activeCase !== requestedCase) return;
        const entryIndex = buyIndex + 1;
        let message;
        let trade = null;
        let shown = Math.min(entryIndex + 8, fullData.length);
        if (res) {
          const portfolioTrade = createPortfolioTrade(requestedCase, res, fullData);
          if (existingTrade) portfolioTrade.order = existingTrade.order;
          const proposed = existingTrade
            ? portfolioTrades.map((item, index) => index === existingIndex ? portfolioTrade : item)
            : [...portfolioTrades, portfolioTrade];
          const account = simulatePortfolio(proposed);
          if (account.error) {
            skippedReviewCaseIds.add(String(requestedCase.id));
            updateReviewWheel();
            finishCurrentCase(`未能买入：${account.error}。该候选已标记空仓`);
            return;
          }
          portfolioTrades = proposed;
          savePortfolioState();
          boughtReviewCaseIds.add(String(requestedCase.id));
          skippedReviewCaseIds.delete(String(requestedCase.id));
          boughtStockNames.push(requestedCase.stockName || requestedCase.marketCode || requestedCase.code);
          currentCaseBought = true;
          trade = {
            buyDate: res.buyDate,
            buyPrice: res.buyChartPrice,
            sellDate: res.sellDate,
            sellPrice: res.sellChartPrice,
            pnlPct: res.pnlPct,
          };
          const sellIndex = fullData.findIndex(item => item.date === res.sellDate);
          if (sellIndex >= 0) shown = Math.min(Math.max(shown, sellIndex + 3), fullData.length);
          else shown = fullData.length;
          const sign = res.pnlPct > 0 ? '+' : '';
          message = `买入 ${res.buyPrice}（${res.buyDate}）卖出 ${res.sellPrice}（${res.sellDate} ${res.sellTick.time}）盈亏 ${sign}${res.pnlPct}%：${res.sellReason}`;
          reviewPnlResults.set(String(requestedCase.id), { date: reviewCaseDate(requestedCase), pnlPct: res.pnlPct });
          updateReviewWheel();
          updateReviewDateButton();
        } else {
          message = `${error.message}，已展示后续 K 线`;
          skippedReviewCaseIds.add(String(requestedCase.id));
          updateReviewWheel();
        }
        activeTrade = trade;
        currentIndex = shown;
        updateChartData();
        finishCurrentCase(message);
        boughtReviewViews.set(String(requestedCase.id), { shown, message, trade });
        saveProgressCheckpoint();
      });
  }

  function buyAtCurrentCandle() {
    if (!activeCase || activeTrade || currentIndex === 0) return;
    if (isDailyReviewSource()) {
      if (!currentCaseHasFutureData) {
        boughtReviewCaseIds.add(String(activeCase.id));
        updateReviewWheel();
        boughtStockNames.push(activeCase.stockName || activeCase.marketCode || activeCase.code);
        currentCaseBought = true;
        finishCurrentCase(`已记录买入：${activeCase.stockName || activeCase.marketCode || activeCase.code}`);
      } else {
        buyDailyReviewWithPnl();
      }
      return;
    }
    const buyIndex = currentIndex - 1;
    const entryIndex = buyIndex + 1;
    const resultIndex = buyIndex + 2;
    const entryCandle = fullData[entryIndex];
    const resultCandle = fullData[resultIndex];
    if (!entryCandle || !resultCandle) {
      finishCurrentCase('没有下一根 K 线，跳过本用例');
      return;
    }

    activeTrade = {
      buyDate: entryCandle.date,
      buyPrice: Number(entryCandle.close),
    };
    // 展示 B 点以及其后的 7 根 K 线
    currentIndex = Math.min(entryIndex + 8, fullData.length);
    updateChartData();

    const reachedLimitUp = resultCandle.limitStatus === 'limit-up'
      || resultCandle.limitStatus.startsWith('touch-limit-up-');
    if (reachedLimitUp) {
      successCount++;
      finishCurrentCase(`成功：${resultCandle.date} 为 B 点后的第二根 K 线且最高价达到涨停价`);
    } else {
      failureCount++;
      finishCurrentCase(`失败：${resultCandle.date} 为 B 点后的第二根 K 线且最高价未达到涨停价`);
    }
  }

  function nextTestCase() {
    if (!activeCase) return;
    if (isDailyReviewSource() && !currentCaseHasFutureData) {
      caseResolved = true;
      markReviewCaseSkipped();
      document.getElementById('buyButton').disabled = true;
      document.getElementById('nextCaseButton').innerText = '继续';
      if (casePosition + 1 < shuffledCases.length) {
        casePosition++;
        caseResolved = false;
        updateTestProgress();
        startNextCase();
      } else {
        casePosition++;
        caseResolved = false;
        startNextCase();
      }
      return;
    }
    if (!caseResolved) {
      const buyIndex = currentIndex - 1;
      const entryIndex = buyIndex + 1;
      currentIndex = Math.min(entryIndex + 8, fullData.length);
      updateChartData();
      caseResolved = true;
      if (isDailyReviewSource()) markReviewCaseSkipped();
      document.getElementById('buyButton').disabled = true;
      document.getElementById('nextCaseButton').innerText = '继续';
      document.getElementById('testStatus').innerText = '空仓：已展示后续 K 线，再次点击进入下一题';
      return;
    }
    clearTradeDrawing();
    activeTrade = null;
    casePosition++;
    caseResolved = false;
    updateTestProgress();
    startNextCase();
  }

  // 快捷键推进
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      nextStep();
    }
  });

  function requestLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  }

  window.addEventListener('pointerdown', requestLandscape, { once: true });
  window.addEventListener('pagehide', saveProgressCheckpoint);

  function nextStep() {
    if (currentIndex < fullData.length && currentCaseHasFutureData) {
      currentIndex++;
      updateChartData();
    }
  }

  window.onload = () => {
    initChart();
    loadFilesForSource();
    updateSourceMode();
    fetch('/api/favorites')
      .then(res => res.json())
      .then(res => {
        favoriteGroups = res.data?.groups || {};
        updateFavoriteGroups();
      })
      .catch(() => updateFavoriteGroups());
    requestLandscape();
  };
</script>

</body>
</html>
