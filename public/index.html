<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0e11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>K线训练与盲盒回放工具 (TradingView Lightweight Charts)</title>
  <!-- 引入 TradingView 开源 lightweight-charts -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    * {
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background-color: #0b0e11;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: clamp(8px, 2vw, 16px);
      box-sizing: border-box;
    }
    .container {
      width: min(1600px, 100%);
      max-width: 100%;
      min-width: 0;
      margin: 0 auto;
      height: calc(100dvh - clamp(16px, 4vw, 32px));
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 901px) {
      .container {
        width: 100%;
        max-width: none;
      }
    }
    .workspace {
      min-height: 0;
      min-width: 0;
      flex: 1;
      display: grid;
      grid-template-rows: 14.2857% minmax(0, 85.7143%);
      gap: 0;
    }
    input {
      background: #1e2329;
      color: #fff;
      border: 1px solid #474d57;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      max-width: 100%;
      box-sizing: border-box;
    }
    select {
      background: #1e2329;
      color: #fff;
      border: 1px solid #474d57;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      max-width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #1e2329;
      color: #f0b90b;
      border: 1px solid #474d57;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover {
      background: #2b313a;
    }
    button:disabled {
      color: #666;
      cursor: not-allowed;
    }
    #buyButton {
      background: #d9363e;
      color: #fff;
      border-color: #d9363e;
    }
    #buyButton:hover:not(:disabled) {
      background: #b52b33;
    }
    #nextCaseButton {
      background: #1f9d55;
      color: #fff;
      border-color: #1f9d55;
    }
    #nextCaseButton:hover:not(:disabled) {
      background: #187a43;
    }
    #nextStepButton {
      background: #1677ff;
      color: #fff;
      border-color: #1677ff;
    }
    #nextStepButton:hover:not(:disabled) {
      background: #0d5dcc;
    }
    .info-board {
      margin-left: auto;
      font-size: 14px;
      font-family: monospace;
    }
    .legend {
      display: flex;
      gap: 15px;
      font-size: 13px;
      margin-bottom: 8px;
      font-family: monospace;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 2px;
    }
    .chart-area {
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .chart-area .legend {
      flex: 0 0 auto;
      position: relative;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    #reviewWheelToggle {
      position: absolute;
      z-index: 7;
      top: 38px;
      left: 8px;
      padding: 5px 9px;
      background: rgba(17, 20, 25, 0.92);
      color: #f0b90b;
    }
    #reviewStockWheel {
      position: absolute;
      z-index: 7;
      top: 76px;
      left: 8px;
      width: min(240px, calc(100vw - 32px));
      padding: 9px;
      box-sizing: border-box;
      border: 1px solid #526176;
      background: rgba(17, 20, 25, 0.96);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      max-height: calc(100% - 84px);
    }
    #reviewDateButton {
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      height: auto;
      padding: 6px 10px;
      font-size: 14px;
      color: #fff;
    }
    #reviewCalendar {
      position: fixed;
      z-index: 8;
      top: 0;
      left: 0;
      width: min(350px, calc(100vw - 32px));
      padding: 9px;
      box-sizing: border-box;
      border: 1px solid #526176;
      background: rgba(17, 20, 25, 0.97);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    #reviewCalendar[hidden] { display: none; }
    .review-calendar-head {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .review-calendar-head select { flex: 1 1 0; min-width: 0; padding: 4px 6px; }
    .review-calendar-head button { padding: 2px 9px; }
    .review-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
    }
    .review-calendar-weekday { color: #7d8794; font-size: 12px; padding: 3px 0; }
    .review-calendar-day {
      min-width: 0;
      height: 44px;
      padding: 4px 0;
      overflow: hidden;
      border-radius: 3px;
      font-size: 13px;
      font-weight: normal;
      color: #fff;
    }
    .review-calendar-day:disabled {
      color: #4a515b;
      background: transparent;
      border-color: transparent;
      cursor: not-allowed;
    }
    .review-calendar-day.is-done:not(:disabled) { color: #7d8794; }
    .review-calendar-day.is-selected { background: #f0b90b; color: #111; border-color: #f0b90b; font-weight: bold; }
    #reviewStockWheel[hidden],
    #reviewWheelToggle[hidden] { display: none; }
    .review-wheel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      color: #f0b90b;
      font-size: 13px;
    }
    .review-wheel-heading button {
      padding: 2px 7px;
    }
    #reviewWheelList {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      overscroll-behavior: contain;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #526176 transparent;
    }
    .review-wheel-item {
      display: block;
      flex: 0 0 40px;
      width: 100%;
      height: 40px;
      padding: 0 8px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #aeb8c5;
      font-size: 14px;
      font-weight: normal;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .review-wheel-item.is-bought {
      color: #d9363e;
    }
    .review-wheel-item.is-skipped {
      color: #1f9d55;
    }
    .review-wheel-item.is-bought .review-wheel-name::before,
    .review-wheel-item.is-skipped .review-wheel-name::before {
      content: '*[';
    }
    .review-wheel-item.is-bought .review-wheel-name::after,
    .review-wheel-item.is-skipped .review-wheel-name::after {
      content: ']*';
    }
    .review-wheel-item.is-current {
      border-block: 1px solid #f0b90b;
      color: #f0b90b;
      font-weight: bold;
    }
    #newsButton {
      margin-left: auto;
      padding: 2px 7px;
      font-size: 12px;
      color: #b7d7ff;
    }
    #newsButton,
    .portfolio-button { flex: 0 0 auto; }
    .portfolio-button {
      padding: 2px 7px;
      font-size: 12px;
      color: #f0b90b;
    }
    #portfolioOverlay[hidden] { display: none; }
    #portfolioOverlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.72);
      white-space: normal;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .portfolio-dialog {
      display: flex;
      flex-direction: column;
      width: min(900px, 100%);
      max-height: 92dvh;
      padding: 14px;
      box-sizing: border-box;
      border: 1px solid #526176;
      background: #111419;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
    }
    .portfolio-dialog-head,
    .portfolio-dialog-tabs,
    .portfolio-metrics,
    .portfolio-chart-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .portfolio-dialog-head { justify-content: space-between; margin-bottom: 10px; }
    .portfolio-dialog-head strong { color: #f0b90b; font-size: 16px; }
    .portfolio-dialog-tabs { margin-bottom: 10px; }
    .portfolio-dialog-tabs button.is-active,
    .portfolio-chart-head button.is-active { border-color: #f0b90b; color: #f0b90b; }
    .portfolio-content { min-height: 0; overflow: auto; }
    .portfolio-metrics { flex-wrap: wrap; margin-bottom: 12px; }
    .portfolio-note { margin: -4px 0 8px; color: #8994a2; font-size: 11px; }
    .portfolio-metric {
      flex: 1 1 150px;
      min-width: 0;
      padding: 9px;
      background: #1a1f26;
      border: 1px solid #2b3440;
    }
    .portfolio-metric span { display: block; color: #8994a2; font-size: 12px; }
    .portfolio-metric strong { display: block; margin-top: 4px; color: #f2f4f7; font-family: monospace; font-size: 16px; }
    .portfolio-chart-head { justify-content: space-between; margin: 12px 0 6px; }
    .portfolio-chart-head span { color: #aeb8c5; }
    #portfolioCurve { display: block; width: 100%; height: 220px; background: #0c1015; border: 1px solid #2b3440; }
    .portfolio-table-wrap { max-height: 42dvh; overflow: auto; }
    .portfolio-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
    .portfolio-table th,
    .portfolio-table td { padding: 7px 8px; border-bottom: 1px solid #2b3440; text-align: right; }
    .portfolio-table th { position: sticky; top: 0; background: #1a1f26; color: #aeb8c5; }
    .portfolio-table th:first-child,
    .portfolio-table td:first-child { text-align: left; }
    .portfolio-empty { padding: 16px; color: #8994a2; text-align: center; }
    #portfolioSaveStatus { min-height: 18px; margin-top: 8px; color: #8994a2; font-size: 12px; }
    #newsPanel {
      position: absolute;
      z-index: 5;
      top: 28px;
      right: 0;
      bottom: 0;
      width: min(620px, 100%);
      padding: 10px 12px;
      box-sizing: border-box;
      background: rgba(17, 20, 25, 0.94);
      border: 1px solid #526176;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      white-space: normal;
      overflow-y: auto;
      overscroll-behavior: contain;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    #newsPanel[hidden] { display: none; }
    .news-list { display: grid; gap: 10px; }
    .news-item { padding-bottom: 9px; border-bottom: 1px solid #2b3440; }
    .news-date { color: #f0b90b; font-family: monospace; }
    .news-title { margin: 4px 0 0; color: #f2f4f7; line-height: 1.45; }
    .news-pin { display: inline-block; margin-right: 6px; padding: 1px 5px; border: 1px solid #f0b90b; border-radius: 3px; color: #f0b90b; font-size: 12px; line-height: 1.3; vertical-align: 1px; }
    .test-panel {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(180px, 1.5fr) minmax(150px, 1fr) minmax(150px, 1fr) minmax(180px, 2fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid #2b2f36;
      background: #111419;
      overflow: hidden;
    }
    .test-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }
    .favorite-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }
    .favorite-controls input,
    .favorite-controls select {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
    }
    .favorite-controls button {
      flex: 0 0 auto;
      width: 38px;
      height: 34px;
      padding: 0;
      font-size: 22px;
      line-height: 1;
      color: #f0b90b;
      white-space: nowrap;
    }
    .favorite-controls button.is-saved {
      color: #f0b90b;
    }
    .test-status { color: #f0b90b; font-family: monospace; }
    .result-board { color: #aeb8c5; font-family: monospace; }
    #dailyRecordStatus { color: #d9363e; }
    #chartContainer {
      width: 100%;
      max-width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border: 1px solid #2b2f36;
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
      touch-action: none;
    }
    @media (max-width: 700px) {
      body {
        padding-bottom: 0;
      }
      .container {
        height: calc(100dvh - clamp(8px, 2vw, 16px));
      }
      .test-panel {
        grid-template-columns: minmax(120px, 1fr) minmax(150px, 1.5fr);
        gap: 8px;
        padding: 6px;
      }
      .workspace {
        gap: 0;
      }
      .test-panel > label:first-child {
        grid-column: 1;
        min-width: 0;
      }
      .test-panel > label:nth-child(2) {
        grid-column: 2;
        min-width: 0;
      }
      .test-panel > span {
        display: none;
      }
      .test-panel select {
        width: 100%;
        min-height: 38px;
      }
      .favorite-controls {
        grid-column: 1 / -1;
      }
      .test-actions {
        grid-column: 2 / -1;
        justify-content: stretch;
      }
      .test-actions button {
        flex: 1;
        min-height: 38px;
      }
      .test-status {
        grid-column: 1 / -1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
    @media (max-width: 900px) and (orientation: landscape) {
      body {
        padding: 8px;
        padding-bottom: 0;
      }
      .container {
        height: calc(100dvh - 8px);
      }
      .test-panel {
        display: grid;
        grid-template-columns: minmax(110px, 1fr) minmax(150px, 1.5fr) minmax(170px, 1.5fr) minmax(175px, 2fr);
        gap: 6px;
        padding: 6px;
        font-size: 12px;
      }
      .test-panel > label:first-child {
        grid-column: 1;
      }
      .test-panel > label:nth-child(2) {
        grid-column: 2;
      }
      .test-panel > span {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .test-panel > #stockNameVal,
      .test-panel > #testStatus {
        display: none;
      }
      .test-panel select {
        min-height: 32px;
        max-width: 100%;
        font-size: 12px;
      }
      .test-actions {
        grid-column: 4;
        grid-row: 1;
        gap: 6px;
        width: 100%;
      }
      .test-actions button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 32px;
        padding: 4px 6px;
        font-size: 12px;
        white-space: nowrap;
      }
      .favorite-controls {
        grid-column: 3;
        grid-row: 1;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="workspace">
    <div class="test-panel">
      <label>
        <select id="dataSource" onchange="switchDataSource()">
          <option value="dailyReview">每日复盘 JSON</option>
          <option value="testcases">测试用例 JSON</option>
          <option value="favorites">收藏 JSON</option>
        </select>
      </label>
      <label>
        <select id="testCaseFile" onchange="loadTestCaseFile()">
          <option value="">请选择测试用例</option>
        </select>
      </label>
      <span id="stockNameVal" style="color:#f0b90b;">股票名称: --</span>
      <span id="testStatus" class="test-status">请选择测试用例 JSON 或收藏分组</span>
      <div class="favorite-controls">
        <select id="favoriteGroup" aria-label="收藏分组" onchange="updateFavoriteButton()"></select>
        <input id="newFavoriteGroup" type="text" placeholder="新建分组">
        <button id="favoriteButton" type="button" onclick="toggleFavorite()" aria-label="添加收藏" title="添加收藏">☆</button>
        <button id="reviewDateButton" type="button" hidden aria-haspopup="true" aria-expanded="false" aria-label="选择复盘日期" onclick="toggleReviewCalendar()">选择日期</button>
      </div>
      <div class="test-actions">
        <button id="buyButton" onclick="buyAtCurrentCandle()" disabled>买入</button>
        <button id="nextStepButton" onclick="nextStep()">快进</button>
        <button id="nextCaseButton" onclick="nextTestCase()" disabled>空仓</button>
      </div>
    </div>

    <div class="chart-area">
      <button id="reviewWheelToggle" type="button" hidden aria-expanded="false" aria-controls="reviewStockWheel" onclick="toggleReviewWheel()">选择股票</button>
      <div id="reviewCalendar" hidden>
        <div class="review-calendar-head">
          <button type="button" id="reviewCalendarPrev" aria-label="上个月" onclick="shiftReviewCalendarMonth(-1)">‹</button>
          <select id="reviewCalendarYear" aria-label="年" onchange="changeReviewCalendarView()"></select>
          <select id="reviewCalendarMonth" aria-label="月" onchange="changeReviewCalendarView()"></select>
          <button type="button" id="reviewCalendarNext" aria-label="下个月" onclick="shiftReviewCalendarMonth(1)">›</button>
        </div>
        <div class="review-calendar-grid" id="reviewCalendarGrid"></div>
      </div>
      <div id="reviewStockWheel" hidden>
        <div class="review-wheel-heading">
          <span>点击股票跳转</span>
          <button type="button" aria-label="收起股票选择" onclick="toggleReviewWheel(false)">收起</button>
        </div>
        <div id="reviewWheelList"></div>
      </div>
      <div class="legend">
        <span id="codeVal" style="color: #f0b90b;">股票代码: --</span>
        <span id="amountVal" style="color: #b0b8c4;">成交金额: --</span>
        <span id="successBoard" class="result-board">成功: <span id="successCount">0</span></span>
        <span id="failureBoard" class="result-board">失败: <span id="failureCount">0</span></span>
        <span id="totalBoard" class="result-board">总数: <span id="totalCount">0</span><span id="dailyRecordStatus"></span></span>
        <span id="reviewPnlBoard" class="result-board" hidden>累计盈亏: <span id="reviewTotalPnl">--</span></span>
        <button id="portfolioButton" class="portfolio-button" type="button" hidden onclick="openPortfolioDialog('account')">账户</button>
        <button id="newsButton" type="button" onclick="toggleNewsPanel()" aria-label="显示新闻" title="显示新闻">新闻</button>
      </div>
      <div id="newsPanel" hidden>
        <div id="newsList" class="news-list"></div>
      </div>
      <div id="portfolioOverlay" hidden onclick="closePortfolioDialog(event)">
        <section class="portfolio-dialog" role="dialog" aria-modal="true" aria-labelledby="portfolioTitle" onclick="event.stopPropagation()">
          <div class="portfolio-dialog-head">
            <strong id="portfolioTitle">回测账户</strong>
            <button type="button" onclick="closePortfolioDialog()">关闭</button>
          </div>
          <div class="portfolio-dialog-tabs">
            <button id="portfolioAccountTab" type="button" onclick="showPortfolioTab('account')">账户</button>
            <button id="portfolioStatementTab" type="button" onclick="showPortfolioTab('statement')">交割单</button>
          </div>
          <div id="portfolioAccountContent" class="portfolio-content">
            <div class="portfolio-metrics">
              <div class="portfolio-metric"><span>总资产</span><strong id="portfolioTotalAssets">--</strong></div>
              <div class="portfolio-metric"><span>市值</span><strong id="portfolioMarketValue">--</strong></div>
              <div class="portfolio-metric"><span>可用</span><strong id="portfolioCash">--</strong></div>
              <div class="portfolio-metric"><span>累计盈亏</span><strong id="portfolioProfit">--</strong></div>
            </div>
            <div class="portfolio-note">初始资金100万元；每笔按总资产的1/4买入，100股一手；持仓按历史收盘价估值，未计手续费、税费及滑点。</div>
            <div class="portfolio-chart-head">
              <span id="portfolioAsOf">持仓（最多4只）</span>
              <div>
                <button id="portfolioPercentMode" type="button" onclick="setPortfolioCurveMode('percent')">百分比</button>
                <button id="portfolioAmountMode" type="button" onclick="setPortfolioCurveMode('amount')">金额</button>
              </div>
            </div>
            <svg id="portfolioCurve" role="img" aria-label="账户收益曲线"></svg>
            <div class="portfolio-table-wrap">
              <table class="portfolio-table">
                <thead><tr><th>持仓</th><th>买入日期</th><th>持仓数量</th><th>成本价</th><th>现价</th><th>市值</th><th>盈亏 / 收益率</th></tr></thead>
                <tbody id="portfolioHoldings"></tbody>
              </table>
            </div>
          </div>
          <div id="portfolioStatementContent" class="portfolio-content" hidden>
            <div class="portfolio-chart-head">
              <span>交割明细（买入与卖出）</span>
              <button type="button" onclick="savePortfolioStatement()">保存 CSV</button>
            </div>
            <div class="portfolio-table-wrap">
              <table class="portfolio-table">
                <thead><tr><th>日期</th><th>时点</th><th>方向</th><th>股票</th><th>数量</th><th>价格</th><th>金额</th><th>盈亏</th><th>收益率</th></tr></thead>
                <tbody id="portfolioStatementRows"></tbody>
              </table>
            </div>
            <div id="portfolioSaveStatus" aria-live="polite"></div>
          </div>
        </section>
      </div>
      <div id="chartContainer"></div>
    </div>
  </div>
</div>

<script>
  let fullData = [];
  let currentIndex = 0; // 当前推演到的索引位置
  const DEFAULT_VISIBLE_CANDLE_COUNT = 120;
  
  let chart, candlestickSeries, volumeSeries, ma5Series, ma10Series, ma20Series;
  let priceLine = null;
  let sellPriceLine = null;
  let reviewPnlResults = new Map();
  const PORTFOLIO_INITIAL_CASH = 1000000;
  const PORTFOLIO_PNL_RULES_VERSION = 2;
  const PORTFOLIO_SCHEMA_VERSION = 2;
  let portfolioTrades = [];
  let portfolioFile = '';
  let portfolioCurveMode = 'percent';
  let portfolioTradeOrder = 0;
  let preloadedReviewCases = null;
  let loadedReviewFile = '';
  let candleMarkers = [];
  let markerController = null;
  let testCases = [];
  let shuffledCases = [];
  let casePosition = 0;
  let favoriteGroups = {};
  let activeCase = null;
  let activeTrade = null;
  let caseResolved = false;
  let successCount = 0;
  let failureCount = 0;
  let favoriteSaved = false;
  let boughtStockNames = [];
  let selectedReviewDate = '';
  let reviewDates = [];
  let skippedReviewCaseIds = new Set();
  let boughtReviewCaseIds = new Set();
  let boughtReviewViews = new Map();
  let keepReviewPosition = false;
  let pendingCaseNotice = '';
  let calendarYear = 0;
  let calendarMonth = 1;
  let currentCaseHasFutureData = true;
  let currentCaseBought = false;
  let currentNews = [];
  let currentNewsLoading = false;
  let currentNewsError = '';
  let currentNewsAbortController = null;

  function isDailyReviewSource() {
    return document.getElementById('dataSource').value === 'dailyReview';
  }

  function loadFilesForSource() {
    const source = document.getElementById('dataSource').value;
    if (source === 'dailyReview') return loadDailyReviewFiles();
    if (source === 'testcases') return loadTestCaseFiles();
  }

  function updateSourceMode() {
    const dailyReview = isDailyReviewSource();
    document.querySelector('.test-panel').classList.toggle('daily-review-mode', dailyReview);
    document.getElementById('successBoard').style.display = dailyReview ? 'none' : '';
    document.getElementById('failureBoard').style.display = dailyReview ? 'none' : '';
    document.getElementById('totalBoard').style.display = '';
    document.getElementById('reviewPnlBoard').hidden = !dailyReview;
    document.getElementById('favoriteGroup').hidden = dailyReview;
    document.getElementById('newFavoriteGroup').hidden = dailyReview;
    document.getElementById('reviewDateButton').hidden = !dailyReview;
    document.getElementById('reviewDateButton').disabled = reviewDates.length <= 1;
    document.getElementById('reviewWheelToggle').hidden = !dailyReview;
    document.getElementById('portfolioButton').hidden = !dailyReview || !portfolioFile;
    if (!dailyReview) {
      toggleReviewWheel(false);
      toggleReviewCalendar(false);
    }
    document.getElementById('favoriteButton').disabled = dailyReview || !activeCase;
    document.getElementById('favoriteButton').hidden = dailyReview;
  }

  function displayCodeLabel() {
    const code = activeCase?.marketCode || activeCase?.code || '--';
    if (isDailyReviewSource()) return `股票名称: ${activeCase?.stockName || code}`;
    return `股票代码: ${code}`;
  }

  function setDailyReviewButtons() {
    const dailyReview = isDailyReviewSource();
    document.getElementById('nextStepButton').disabled = dailyReview && !currentCaseHasFutureData;
    if (!dailyReview || caseResolved || !activeCase) return;
    if (getBoughtCountForSignalDate(selectedReviewDate) >= 2) {
      document.getElementById('buyButton').disabled = true;
      document.getElementById('testStatus').innerText = '当日最多买入2只，请点击空仓逐只查看剩余候选';
    }
  }

  function formatNewsDate(publishTime) {
    return new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit',
    }).format(new Date(publishTime));
  }

  function updateNewsDisplay() {
    const list = document.getElementById('newsList');
    list.replaceChildren();
    if (currentNewsLoading) {
      const loading = document.createElement('div');
      loading.className = 'news-title';
      loading.textContent = '正在加载回测日前5个交易日新闻...';
      list.appendChild(loading);
      return;
    }
    if (currentNewsError) {
      const failure = document.createElement('div');
      failure.className = 'news-title';
      failure.textContent = `实时新闻加载失败: ${currentNewsError}`;
      list.appendChild(failure);
      return;
    }
    if (!currentNews.length) {
      const empty = document.createElement('div');
      empty.className = 'news-title';
      empty.textContent = '当前股票在回测日前5个交易日没有新闻';
      list.appendChild(empty);
      return;
    }
    currentNews.forEach(item => {
      const article = document.createElement('article');
      article.className = 'news-item';
      const date = document.createElement('div');
      date.className = 'news-date';
      date.textContent = formatNewsDate(item.publishTime);
      const title = document.createElement('p');
      title.className = 'news-title';
      if (item.isPinned) {
        const pin = document.createElement('span');
        pin.className = 'news-pin';
        pin.textContent = '置顶';
        title.appendChild(pin);
      }
      title.append(document.createTextNode(item.title || '无标题'));
      article.append(date, title);
      list.appendChild(article);
    });
  }

  function updateNewsPanel() {
    currentNews = [];
    currentNewsLoading = Boolean(activeCase);
    currentNewsError = '';
    document.getElementById('newsButton').disabled = !activeCase;
    updateNewsDisplay();
  }

  function loadCurrentNews(caseItem) {
    if (currentNewsAbortController) currentNewsAbortController.abort();
    const controller = new AbortController();
    currentNewsAbortController = controller;
    const timeoutId = setTimeout(() => controller.abort(), 30000);
    fetch(`/api/news?code=${encodeURIComponent(caseItem.code)}&date=${encodeURIComponent(caseItem.date)}&ts=${Date.now()}`, {
      cache: 'no-store',
      signal: controller.signal,
    })
      .then(async response => {
        const result = await response.json();
        if (!response.ok || result.status_code !== 0) {
          throw new Error(result.msg || `HTTP ${response.status}`);
        }
        return result;
      })
      .then(result => {
        if (activeCase !== caseItem) return;
        currentNews = Array.isArray(result.data)
          ? result.data.sort((left, right) => (
            Number(Boolean(right.isPinned)) - Number(Boolean(left.isPinned))
            || Number(right.publishTime) - Number(left.publishTime)
          ))
          : [];
        currentNewsLoading = false;
        currentNewsError = '';
        updateNewsDisplay();
      })
      .catch(error => {
        if (activeCase !== caseItem) return;
        currentNews = [];
        currentNewsLoading = false;
        currentNewsError = error.name === 'AbortError'
          ? '请求超时，请检查代理和服务是否正常运行'
          : error.message;
        updateNewsDisplay();
      })
      .finally(() => {
        clearTimeout(timeoutId);
        if (currentNewsAbortController === controller) currentNewsAbortController = null;
      });
  }

  function toggleNewsPanel() {
    const panel = document.getElementById('newsPanel');
    panel.hidden = !panel.hidden;
    if (!panel.hidden) updateNewsDisplay();
  }

  function formatAmount(amount) {
    const value = Number(amount);
    if (!Number.isFinite(value)) return '成交金额: --';
    if (Math.abs(value) < 1e8) {
      return `成交金额: ${(value / 1e7).toFixed(2)}千万`;
    }
    return `成交金额: ${(value / 1e8).toFixed(2)}亿`;
  }

  function sortCasesByDate(items) {
    return [...items].sort((left, right) => String(left.date || '').localeCompare(String(right.date || '')));
  }

  function reviewCaseDate(item) {
    return String(item.date || '').trim();
  }

  function getReviewCasesForDate(date) {
    return testCases.filter(item => reviewCaseDate(item) === date);
  }

  function isReviewCaseDone(item) {
    const id = String(item.id);
    return skippedReviewCaseIds.has(id) || boughtReviewCaseIds.has(id);
  }

  function initReviewDates(items) {
    reviewDates = [...new Set(items.map(reviewCaseDate).filter(Boolean))].sort();
    selectedReviewDate = reviewDates[0] || '';
    skippedReviewCaseIds = new Set();
    boughtReviewCaseIds = new Set();
    boughtReviewViews = new Map();
    reviewPnlResults = new Map();
    preloadedReviewCases = null;
    toggleReviewCalendar(false);
    updateReviewDateButton();
  }

  function updateReviewDateButton() {
    const button = document.getElementById('reviewDateButton');
    button.textContent = selectedReviewDate || '选择日期';
    button.disabled = reviewDates.length <= 1;
    if (!document.getElementById('reviewCalendar').hidden) renderReviewCalendar();
  }

  function startDailyReviewSession() {
    shuffledCases = getReviewCasesForDate(selectedReviewDate);
    casePosition = 0;
    successCount = 0;
    failureCount = 0;
    boughtStockNames = [];
    keepReviewPosition = false;
    activeTrade = null;
    caseResolved = false;
    currentCaseBought = false;
    currentCaseHasFutureData = true;
    updateSourceMode();
    updateReviewWheel();
    updateTestProgress();
    startNextCase();
  }

  function changeReviewDate(date) {
    if (!isDailyReviewSource() || !reviewDates.includes(date)) return;
    toggleReviewCalendar(false);
    selectedReviewDate = date;
    shuffledCases = getReviewCasesForDate(date);
    casePosition = 0;
    keepReviewPosition = true;
    updateReviewDateButton();
    startNextCase();
  }

  // 当天剩余股票全部处理完后自动切换到下一个仍有未处理股票的日期
  function resolveReviewPosition() {
    if (keepReviewPosition) {
      keepReviewPosition = false;
      return;
    }
    for (;;) {
      if (shuffledCases.length) {
        const startPosition = ((casePosition % shuffledCases.length) + shuffledCases.length) % shuffledCases.length;
        for (let offset = 0; offset < shuffledCases.length; offset++) {
          const nextPosition = (startPosition + offset) % shuffledCases.length;
          if (!isReviewCaseDone(shuffledCases[nextPosition])) {
            casePosition = nextPosition;
            return;
          }
        }
      }
      const nextDate = reviewDates.find(date => date > selectedReviewDate
        && getReviewCasesForDate(date).some(item => !isReviewCaseDone(item)));
      if (!nextDate) return;
      selectedReviewDate = nextDate;
      shuffledCases = getReviewCasesForDate(nextDate);
      casePosition = 0;
      updateReviewDateButton();
    }
  }

  function toggleReviewCalendar(forceOpen) {
    const calendar = document.getElementById('reviewCalendar');
    const open = typeof forceOpen === 'boolean' ? forceOpen : calendar.hidden;
    if (open && !reviewDates.length) return;
    calendar.hidden = !open;
    document.getElementById('reviewDateButton').setAttribute('aria-expanded', String(open));
    if (!open) return;
    toggleReviewWheel(false);
    const [year, month] = selectedReviewDate.split('-').map(Number);
    calendarYear = year;
    calendarMonth = month;
    renderReviewCalendar();
    positionReviewCalendar();
  }

  function positionReviewCalendar() {
    const calendar = document.getElementById('reviewCalendar');
    if (calendar.hidden) return;
    const rect = document.getElementById('reviewDateButton').getBoundingClientRect();
    const left = Math.max(4, Math.min(rect.left, window.innerWidth - calendar.offsetWidth - 4));
    calendar.style.left = `${left}px`;
    calendar.style.top = `${rect.bottom + 4}px`;
  }
  window.addEventListener('resize', positionReviewCalendar);

  function shiftReviewCalendarMonth(delta) {
    const index = calendarYear * 12 + calendarMonth - 1 + delta;
    calendarYear = Math.floor(index / 12);
    calendarMonth = index % 12 + 1;
    renderReviewCalendar();
  }

  function changeReviewCalendarView() {
    calendarYear = Number(document.getElementById('reviewCalendarYear').value);
    calendarMonth = Number(document.getElementById('reviewCalendarMonth').value);
    renderReviewCalendar();
  }

  function renderReviewCalendar() {
    const firstYear = Number(reviewDates[0].slice(0, 4));
    const lastYear = Number(reviewDates[reviewDates.length - 1].slice(0, 4));
    const yearSelect = document.getElementById('reviewCalendarYear');
    const monthSelect = document.getElementById('reviewCalendarMonth');
    yearSelect.replaceChildren(...Array.from({ length: lastYear - firstYear + 1 }, (_, i) => {
      const option = new Option(`${firstYear + i}年`, String(firstYear + i));
      return option;
    }));
    monthSelect.replaceChildren(...Array.from({ length: 12 }, (_, i) => new Option(`${i + 1}月`, String(i + 1))));
    yearSelect.value = String(calendarYear);
    monthSelect.value = String(calendarMonth);
    const monthIndex = calendarYear * 12 + calendarMonth - 1;
    document.getElementById('reviewCalendarPrev').disabled = monthIndex <= firstYear * 12;
    document.getElementById('reviewCalendarNext').disabled = monthIndex >= lastYear * 12 + 11;

    const grid = document.getElementById('reviewCalendarGrid');
    const cells = ['日', '一', '二', '三', '四', '五', '六'].map(name => {
      const cell = document.createElement('div');
      cell.className = 'review-calendar-weekday';
      cell.textContent = name;
      return cell;
    });
    const leading = new Date(calendarYear, calendarMonth - 1, 1).getDay();
    for (let i = 0; i < leading; i++) cells.push(document.createElement('div'));
    const daysInMonth = new Date(calendarYear, calendarMonth, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
      const date = `${calendarYear}-${String(calendarMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'review-calendar-day';
      button.textContent = String(day);
      const dayCases = reviewDates.includes(date) ? getReviewCasesForDate(date) : [];
      button.disabled = !dayCases.length;
      if (dayCases.length && dayCases.every(isReviewCaseDone)) button.classList.add('is-done');
      if (date === selectedReviewDate) button.classList.add('is-selected');
      button.addEventListener('click', () => changeReviewDate(date));
      cells.push(button);
    }
    grid.replaceChildren(...cells);
  }

  function toggleReviewWheel(forceOpen) {
    const wheel = document.getElementById('reviewStockWheel');
    const open = typeof forceOpen === 'boolean' ? forceOpen : wheel.hidden;
    wheel.hidden = !open;
    document.getElementById('reviewWheelToggle').setAttribute('aria-expanded', String(open));
    if (open) {
      toggleReviewCalendar(false);
      updateReviewWheel();
    }
  }

  function updateReviewWheel() {
    const list = document.getElementById('reviewWheelList');
    if (!list || !isDailyReviewSource() || document.getElementById('reviewStockWheel').hidden) return;
    const fragment = document.createDocumentFragment();
    shuffledCases.forEach((item, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'review-wheel-item';
      button.dataset.caseIndex = String(index);
      const name = document.createElement('span');
      name.className = 'review-wheel-name';
      name.textContent = item.stockName || item.marketCode || item.code || '未知股票';
      button.appendChild(name);
      button.title = `${name.textContent} ${item.date || ''}`;
      const pnl = reviewPnlResults.get(String(item.id));
      if (pnl && boughtReviewCaseIds.has(String(item.id))) {
        const pnlLabel = document.createElement('span');
        pnlLabel.className = 'review-wheel-pnl';
        pnlLabel.textContent = ` ${formatPnl(pnl.pnlPct)}`;
        button.appendChild(pnlLabel);
      }
      if (index === casePosition) button.classList.add('is-current');
      if (boughtReviewCaseIds.has(String(item.id))) button.classList.add('is-bought');
      else if (skippedReviewCaseIds.has(String(item.id))) button.classList.add('is-skipped');
      button.addEventListener('click', () => selectReviewCase(index));
      fragment.appendChild(button);
    });
    list.replaceChildren(fragment);
    const current = list.querySelector('.is-current');
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  function selectReviewCase(index) {
    if (!isDailyReviewSource() || index < 0 || index >= shuffledCases.length) return;
    toggleReviewWheel(false);
    if (index === casePosition && activeCase?.id === shuffledCases[index].id) return;
    casePosition = index;
    caseResolved = false;
    keepReviewPosition = true;
    startNextCase();
  }

  function markReviewCaseSkipped() {
    if (!isDailyReviewSource() || !activeCase?.id) return;
    skippedReviewCaseIds.add(String(activeCase.id));
    updateReviewWheel();
    updateTestProgress();
  }

  function getProgressStorageKey() {
    const source = document.getElementById('dataSource').value;
    const fileName = document.getElementById('testCaseFile').value;
    if (!fileName) return '';
    if (source === 'dailyReview') return `kline-replay-progress:daily:${fileName}`;
    return `kline-replay-progress:v2:${source}:${fileName}`;
  }

  function clearDailyReviewFileCache(fileName) {
    for (const key of [
      `kline-replay-progress:daily:${fileName}`,
      portfolioStorageKey(fileName),
    ]) {
      try {
        localStorage.removeItem(key);
      } catch (error) {
        console.warn(`清除回测缓存失败（${key}）: ${error.message}`);
      }
    }
    portfolioTrades = [];
    portfolioTradeOrder = 0;
    updatePortfolioButtons();
    updateReviewPnlBoard();
  }

  function hasReviewProgress() {
    return skippedReviewCaseIds.size > 0 || boughtReviewCaseIds.size > 0;
  }

  function saveReviewProgress(key) {
    if (!loadedReviewFile || loadedReviewFile !== document.getElementById('testCaseFile').value) return;
    if (!hasReviewProgress()) {
      localStorage.removeItem(key);
      return;
    }
    try {
      localStorage.setItem(key, JSON.stringify({
        selectedReviewDate,
        skippedReviewCaseIds: [...skippedReviewCaseIds],
        boughtReviewCaseIds: [...boughtReviewCaseIds],
        boughtReviewViews: [...boughtReviewViews],
        reviewPnlResults: [...reviewPnlResults],
        boughtStockNames,
        savedAt: new Date().toISOString(),
      }));
    } catch (error) {
      console.warn('保存每日复盘进度失败:', error.message);
    }
  }

  function readReviewProgress(key) {
    try {
      const saved = JSON.parse(localStorage.getItem(key) || 'null');
      if (!saved || !/^\d{4}-\d{2}-\d{2}$/.test(saved.selectedReviewDate || '')) return null;
      const doneCount = (saved.skippedReviewCaseIds?.length || 0) + (saved.boughtReviewCaseIds?.length || 0);
      return doneCount ? saved : null;
    } catch (error) {
      console.warn('读取每日复盘进度失败:', error.message);
      return null;
    }
  }

  // 恢复后若保存的日期已不存在则忽略
  function applyReviewProgress(saved) {
    if (!reviewDates.includes(saved.selectedReviewDate)) return false;
    selectedReviewDate = saved.selectedReviewDate;
    skippedReviewCaseIds = new Set((saved.skippedReviewCaseIds || []).map(String));
    boughtReviewCaseIds = new Set((saved.boughtReviewCaseIds || []).map(String));
    boughtReviewViews = new Map(saved.boughtReviewViews || []);
    reviewPnlResults = new Map(saved.reviewPnlResults || []);
    boughtStockNames = Array.isArray(saved.boughtStockNames) ? saved.boughtStockNames : [];
    updateReviewDateButton();
    return true;
  }

  function describeReviewProgress(saved) {
    const dayCases = getReviewCasesForDate(saved.selectedReviewDate);
    const ids = new Set([...(saved.skippedReviewCaseIds || []), ...(saved.boughtReviewCaseIds || [])].map(String));
    const done = dayCases.filter(item => ids.has(String(item.id))).length;
    const [year, month, day] = saved.selectedReviewDate.split('-');
    return `${year}年${Number(month)}月${Number(day)}日，当天已测试 ${done}/${dayCases.length}`;
  }

  function saveProgressCheckpoint() {
    const key = getProgressStorageKey();
    if (isDailyReviewSource()) {
      if (key) saveReviewProgress(key);
      return;
    }
    if (!key || !shuffledCases.length) return;
    const checkpointPosition = caseResolved ? casePosition + 1 : casePosition;
    if (checkpointPosition === 0 && successCount === 0 && failureCount === 0
      && !boughtStockNames.length && !skippedReviewCaseIds.size) {
      localStorage.removeItem(key);
      return;
    }
    try {
      localStorage.setItem(key, JSON.stringify({
        shuffledCases,
        // 已结算的用例下次直接从下一条开始，避免 iPhone 被挂起后重复计数。
        casePosition: checkpointPosition,
        successCount,
        failureCount,
        boughtStockNames,
        skippedReviewCaseIds: [...skippedReviewCaseIds],
        savedAt: new Date().toISOString(),
      }));
    } catch (error) {
      console.warn('保存回测进度失败:', error.message);
    }
  }

  function readProgressCheckpoint() {
    const key = getProgressStorageKey();
    if (!key) return null;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || 'null');
      if (!saved || !Array.isArray(saved.shuffledCases) || !saved.shuffledCases.length) return null;
      if (Number(saved.casePosition) === 0 && !Number(saved.successCount) && !Number(saved.failureCount)
      && (!Array.isArray(saved.boughtStockNames) || !saved.boughtStockNames.length)
      && (!Array.isArray(saved.skippedReviewCaseIds) || !saved.skippedReviewCaseIds.length)) {
        localStorage.removeItem(key);
        return null;
      }
      return saved;
    } catch (error) {
      console.warn('读取回测进度失败:', error.message);
      return null;
    }
  }

  function clearProgressCheckpoint() {
    const key = getProgressStorageKey();
    if (!key) return;
    localStorage.removeItem(key);
  }

  function setTestButtons(enabled) {
    document.getElementById('buyButton').disabled = !enabled;
    document.getElementById('nextCaseButton').disabled = !activeCase || (!enabled && !caseResolved);
  }

  function updateTestProgress() {
    document.getElementById('successCount').innerText = successCount;
    document.getElementById('failureCount').innerText = failureCount;
    if (isDailyReviewSource()) {
      const done = shuffledCases.filter(isReviewCaseDone).length;
      document.getElementById('totalCount').innerText = `${done}/${shuffledCases.length}`;
    } else {
      document.getElementById('totalCount').innerText = `${Math.min(casePosition + 1, shuffledCases.length)}/${shuffledCases.length}`;
    }
    document.getElementById('dailyRecordStatus').innerText = currentCaseBought ? ' 已加入记录' : '';
    updateReviewPnlBoard();
    saveProgressCheckpoint();
  }

  function formatPnl(value) {
    return `${value > 0 ? '+' : ''}${value.toFixed(2)}%`;
  }

  function updateReviewPnlBoard() {
    const board = document.getElementById('reviewPnlBoard');
    board.hidden = !isDailyReviewSource();
    if (board.hidden) return;
    const model = simulatePortfolio(portfolioTrades);
    const value = document.getElementById('reviewTotalPnl');
    value.textContent = portfolioTrades.length
      ? `${money(model.profitAmount)} (${formatPnl(model.profitPct)})`
      : '--';
    value.style.color = !portfolioTrades.length || model.profitPct === 0
      ? ''
      : model.profitPct > 0 ? '#d9363e' : '#1f9d55';
  }

  function money(value) {
    return `¥${Number(value || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  function portfolioStorageKey(file = portfolioFile) {
    return file ? `kline-replay-account:v1:${file}` : '';
  }

  function initPortfolioForFile(file) {
    portfolioFile = file;
    portfolioTrades = [];
    try {
      const saved = JSON.parse(localStorage.getItem(portfolioStorageKey(file)) || 'null');
      if (saved && Array.isArray(saved.trades)) {
        portfolioTrades = saved.trades.filter(trade => (
          trade && trade.id && /^\d{4}-\d{2}-\d{2}$/.test(trade.buyDate || '')
          && /^\d{4}-\d{2}-\d{2}$/.test(trade.sellDate || '')
          && Number.isFinite(Number(trade.buyPrice)) && Number(trade.buyPrice) > 0
          && Number.isFinite(Number(trade.sellPrice)) && Number(trade.sellPrice) > 0
          && Array.isArray(trade.prices)
        ));
      }
    } catch (error) {
      console.warn(`读取回测账户失败: ${error.message}`);
    }
    portfolioTradeOrder = portfolioTrades.reduce((next, trade) => (
      Math.max(next, Number(trade.order) + 1 || 0)
    ), 0);
    updatePortfolioButtons();
    updateReviewPnlBoard();
  }

  function savePortfolioState() {

  function invalidateLegacyPortfolioProgress() {
    const legacyIds = new Set();
    for (const trade of portfolioTrades) {
      if (Number(trade.portfolioSchemaVersion) >= PORTFOLIO_SCHEMA_VERSION
        && Number(trade.pnlRulesVersion) >= PORTFOLIO_PNL_RULES_VERSION) continue;
      legacyIds.add(trade.id);
      boughtReviewCaseIds.delete(trade.id);
      skippedReviewCaseIds.delete(trade.id);
      boughtReviewViews.delete(trade.id);
      reviewPnlResults.delete(trade.id);
    }
    if (legacyIds.size) {
      portfolioTrades = portfolioTrades.filter(trade => !legacyIds.has(trade.id));
      savePortfolioState();
    }

  function getPortfolioProgressDate() {
    if (!selectedReviewDate) return '';
    if (activeCase && reviewCaseDate(activeCase) === selectedReviewDate) {
      const nextTradingDay = fullData.find(bar => bar.date > selectedReviewDate);
      return nextTradingDay ? nextTradingDay.date : selectedReviewDate;
    }
    return selectedReviewDate;
  }

  function quotePortfolioTrade(trade, date) {
    let quote = Number(trade.buyPrice);
    for (const item of trade.prices) {
      if (item.date > date) break;
      if (Number.isFinite(Number(item.close)) && Number(item.close) > 0) quote = Number(item.close);
    }
    return date === trade.sellDate ? Number(trade.sellPrice) : quote;
  }

  function quotePortfolioTradeBefore(trade, date) {
    let quote = Number(trade.buyPrice);
    for (const item of trade.prices) {
      if (item.date >= date) break;
      if (Number.isFinite(Number(item.close)) && Number(item.close) > 0) quote = Number(item.close);
    }
    return quote;
  }

  function simulatePortfolio(trades, progressDate = getPortfolioProgressDate()) {
    const dailyCounts = new Map();
    for (const trade of trades) {
      const count = (dailyCounts.get(trade.signalDate) || 0) + 1;
      if (count > 2) return { error: '同一信号日最多买入2只股票' };
      dailyCounts.set(trade.signalDate, count);
    }

    const ordered = [...trades].sort((a, b) => (
      a.buyDate.localeCompare(b.buyDate) || Number(a.order) - Number(b.order)
    ));
    if (!ordered.length) {
      return {
        cash: PORTFOLIO_INITIAL_CASH, marketValue: 0, totalAssets: PORTFOLIO_INITIAL_CASH,
        profitAmount: 0, profitPct: 0, asOfDate: '', positions: [], curve: [], executions: new Map(),
      };
    }

    const latestBuyDate = ordered.reduce((latest, trade) => trade.buyDate > latest ? trade.buyDate : latest, '');
    const asOfDate = progressDate > latestBuyDate ? progressDate : latestBuyDate;
    const firstBuyDate = ordered.reduce((earliest, trade) => trade.buyDate < earliest ? trade.buyDate : earliest, asOfDate);
    const dates = [...new Set(ordered.flatMap(trade => [
      trade.buyDate,
      progressDate,
      ...trade.prices.map(item => item.date),
    ]))].filter(date => date >= firstBuyDate && date <= asOfDate).sort();
    const buysByDate = new Map();
    ordered.forEach(trade => {
      if (!buysByDate.has(trade.buyDate)) buysByDate.set(trade.buyDate, []);
      buysByDate.get(trade.buyDate).push(trade);
    });

    let cash = PORTFOLIO_INITIAL_CASH;
    let holdings = [];
    const executions = new Map();
    const curve = [];
    const mark = date => holdings.reduce((sum, position) => (
      sum + position.shares * quotePortfolioTrade(position.trade, date)
    ), 0);

    for (const date of dates) {
      holdings = holdings.filter(position => {
        if (position.trade.sellDate < date
          || (position.trade.sellDate === date && position.trade.sellTime === '09:25')) {
          cash += position.shares * position.trade.sellPrice;
          return false;
        }
        return true;
      });

      for (const trade of buysByDate.get(date) || []) {
        if (holdings.length >= 4) return { error: `截至 ${date} 已有4只持仓，无法再买入 ${trade.stockName}` };
        const totalBeforeBuy = cash + holdings.reduce((sum, position) => (
          sum + position.shares * quotePortfolioTradeBefore(position.trade, date)
        ), 0);
        const allocation = Math.min(cash, totalBeforeBuy * 0.25);
        const shares = Math.floor((allocation / trade.buyPrice + 1e-8) / 100) * 100;
        if (shares < 100) return { error: `截至 ${date} 可用资金不足以买入 ${trade.stockName} 一手` };
        const amount = shares * trade.buyPrice;
        cash -= amount;
        holdings.push({ trade, shares });
        executions.set(trade.id, { shares, amount });
      }

      holdings = holdings.filter(position => {
        if (position.trade.sellDate === date) {
          cash += position.shares * position.trade.sellPrice;
          return false;
        }
        return true;
      });
      const marketValue = mark(date);
      curve.push({ date, cash, marketValue, totalAssets: cash + marketValue });
    }

    const baseline = new Date(`${firstBuyDate}T00:00:00Z`);
    baseline.setUTCDate(baseline.getUTCDate() - 1);
    curve.unshift({
      date: baseline.toISOString().slice(0, 10),
      cash: PORTFOLIO_INITIAL_CASH,
      marketValue: 0,
      totalAssets: PORTFOLIO_INITIAL_CASH,
    });
    const marketValue = mark(asOfDate);
    const totalAssets = cash + marketValue;
    return {
      cash,
      marketValue,
      totalAssets,
      profitAmount: totalAssets - PORTFOLIO_INITIAL_CASH,
      profitPct: (totalAssets / PORTFOLIO_INITIAL_CASH - 1) * 100,
      asOfDate,
      positions: holdings.map(position => ({
        ...position,
        quote: quotePortfolioTrade(position.trade, asOfDate),
      })),
      curve,
      executions,
    };
  }

  function createPortfolioTrade(item, result, bars) {
    const factor = Number(result.buyPrice) && Number(result.buyChartPrice)
      ? Number(result.buyChartPrice) / Number(result.buyPrice)
      : 1;
    const prices = bars
      .filter(bar => bar.date >= result.buyDate && bar.date <= result.sellDate)
      .map(bar => ({ date: bar.date, close: Number(bar.close) / factor }))
      .filter(bar => Number.isFinite(bar.close) && bar.close > 0);
    if (!prices.some(price => price.date === result.buyDate)) {
      prices.push({ date: result.buyDate, close: Number(result.buyPrice) });
    }
    if (!prices.some(price => price.date === result.sellDate)) {
      prices.push({ date: result.sellDate, close: Number(result.sellPrice) });
    }
    prices.sort((a, b) => a.date.localeCompare(b.date));
    return {
      id: String(item.id),
      order: portfolioTradeOrder++,
      signalDate: reviewCaseDate(item),
      buyDate: result.buyDate,
      sellDate: result.sellDate,
      code: String(item.code || ''),
      stockName: String(item.stockName || item.marketCode || item.code || ''),
      buyPrice: Number(result.buyPrice),
      sellPrice: Number(result.sellPrice),
      pnlPct: Number(result.pnlPct),
      pnlRulesVersion: Number(result.rulesVersion) || 0,
      portfolioSchemaVersion: PORTFOLIO_SCHEMA_VERSION,
      sellReason: String(result.sellReason || ''),
      sellTime: String(result.sellTick?.time || ''),
      prices,
    };
  }

        money(position.trade.buyPrice),
        money(position.quote),
        money(position.shares * position.quote),
        `${money(position.shares * (position.quote - position.trade.buyPrice))} (${formatPnl((position.quote / position.trade.buyPrice - 1) * 100)})`,
      ];
      fields.forEach((text, index) => {
        const cell = row.insertCell();
        cell.textContent = text;
        if (index === 6) {
          const pnl = position.shares * (position.quote - position.trade.buyPrice);

        }
      });

  function renderPortfolioCurve(model) {
    const svg = document.getElementById('portfolioCurve');
    const width = 760;
    const height = 220;
    const pad = { left: 62, right: 14, top: 14, bottom: 30 };
    svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    const points = model.curve.map(point => ({
      date: point.date,
      value: portfolioCurveMode === 'percent'
        ? (point.totalAssets / PORTFOLIO_INITIAL_CASH - 1) * 100
        : point.totalAssets - PORTFOLIO_INITIAL_CASH,
    }));
    if (points.length < 2) {
      const empty = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      empty.setAttribute('x', String(width / 2));
      empty.setAttribute('y', String(height / 2));
      empty.setAttribute('text-anchor', 'middle');
      empty.setAttribute('fill', '#8994a2');
      empty.textContent = '有成交后显示账户收益曲线';
      svg.appendChild(empty);
      return;
    }

    const values = points.map(point => point.value);
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) { min -= 1; max += 1; }
    const gap = (max - min) * 0.12;
    min -= gap;
    max += gap;
    const plotWidth = width - pad.left - pad.right;
    const plotHeight = height - pad.top - pad.bottom;
    for (let i = 0; i <= 3; i++) {
      const y = pad.top + (plotHeight * i) / 3;
      const grid = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      grid.setAttribute('x1', String(pad.left));
      grid.setAttribute('x2', String(width - pad.right));
      grid.setAttribute('y1', String(y));
      grid.setAttribute('y2', String(y));
      grid.setAttribute('stroke', '#2b3440');
      svg.appendChild(grid);
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      const value = max - ((max - min) * i) / 3;
      label.setAttribute('x', String(pad.left - 6));
      label.setAttribute('y', String(y + 4));
      label.setAttribute('text-anchor', 'end');
      label.setAttribute('fill', '#8994a2');
      label.setAttribute('font-size', '10');
      label.textContent = portfolioCurveMode === 'percent' ? `${value.toFixed(1)}%` : `${(value / 10000).toFixed(1)}万`;
      svg.appendChild(label);
    }
    const coords = points.map((point, index) => {
      const x = pad.left + (plotWidth * index) / (points.length - 1);
      const y = pad.top + ((max - point.value) / (max - min)) * plotHeight;
      return `${x},${y}`;
    });
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', coords.join(' '));
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', values[values.length - 1] >= 0 ? '#d9363e' : '#1f9d55');
    line.setAttribute('stroke-width', '2');
    svg.appendChild(line);
    for (const index of [0, points.length - 1]) {
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', String(pad.left + (plotWidth * index) / (points.length - 1)));
      label.setAttribute('y', String(height - 8));
      label.setAttribute('text-anchor', index === 0 ? 'start' : 'end');
      label.setAttribute('fill', '#8994a2');
      label.setAttribute('font-size', '10');
      label.textContent = points[index].date;
      svg.appendChild(label);
    }
  }

  function renderPortfolioStatement() {
    const body = document.getElementById('portfolioStatementRows');
    body.replaceChildren();
    const model = simulatePortfolio(portfolioTrades);
    if (!portfolioTrades.length) {
      const row = body.insertRow();
      const cell = row.insertCell();
      cell.colSpan = 9;
      cell.className = 'portfolio-empty';
      cell.textContent = '尚无交割记录';
      return;
    }
    const rows = [];
    for (const trade of portfolioTrades) {
      const execution = model.executions.get(trade.id);
      if (!execution) continue;
      rows.push({ date: trade.buyDate, direction: '买入', trade, price: trade.buyPrice, amount: -execution.amount, pnl: null });
      rows.push({
        date: trade.sellDate, direction: '卖出', trade, price: trade.sellPrice,
        amount: execution.shares * trade.sellPrice,
        pnl: execution.shares * (trade.sellPrice - trade.buyPrice),
      });
    }
    rows.sort(comparePortfolioEvents);
    rows.forEach(item => {
      const execution = model.executions.get(item.trade.id);
      const row = body.insertRow();
      const fields = [
        item.date, item.direction === '卖出' ? item.trade.sellTime || '收盘' : '--',
        item.direction, `${item.trade.stockName} (${item.trade.code})`,
        `${execution.shares}股`, money(item.price), money(item.amount),
        item.pnl === null ? '--' : money(item.pnl),
        item.pnl === null ? '--' : formatPnl(item.trade.pnlPct),
      ];
      fields.forEach((text, index) => {
        const cell = row.insertCell();
        cell.textContent = text;
        if ((index === 6 || index === 7) && item.pnl !== null) {
          cell.style.color = item.pnl > 0 ? '#d9363e' : item.pnl < 0 ? '#1f9d55' : '';
        }
      });
    });
  }

  function savePortfolioStatement() {
    const model = simulatePortfolio(portfolioTrades);
    const rows = [['日期', '时点', '方向', '股票名称', '代码', '数量', '价格', '金额', '盈亏', '收益率', '卖出原因']];
    const records = [];
    for (const trade of portfolioTrades) {
      const execution = model.executions.get(trade.id);
      if (!execution) continue;
      records.push({
        date: trade.buyDate, side: '买入', trade, execution, price: trade.buyPrice,
        amount: -execution.amount, pnl: '', returnPct: '',
      });
      records.push({
        date: trade.sellDate, side: '卖出', trade, execution, price: trade.sellPrice,
        amount: execution.shares * trade.sellPrice,
        pnl: execution.shares * (trade.sellPrice - trade.buyPrice),
        returnPct: `${trade.pnlPct}%`,
      });
    }
    records.sort(comparePortfolioEvents);
    records.forEach(item => rows.push([
      item.date, item.side === '卖出' ? item.trade.sellTime : '', item.side,
      item.trade.stockName, item.trade.code, item.execution.shares,
      item.price, item.amount, item.pnl, item.returnPct, item.trade.sellReason,
    ]));
    const csv = `\uFEFF${rows.map(row => row.map(value => `"${String(value ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n')}`;
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const base = portfolioFile.replace(/\.json$/i, '').replace(/[<>:"/\\|?*]/g, '_');
    link.href = url;
    link.download = `回测交割单_${base}.csv`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    document.getElementById('portfolioSaveStatus').textContent = '交割单已保存到本地下载文件夹';
  }

  function comparePortfolioEvents(a, b) {
    const rank = item => item.direction === '买入' || item.side === '买入'
      ? 1
      : item.trade.sellTime === '09:25' ? 0 : 2;
    return a.date.localeCompare(b.date) || rank(a) - rank(b);
  }

  function clearTradeDrawing() {
    if (priceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(priceLine);
    }
    if (sellPriceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(sellPriceLine);
    }
    priceLine = null;
    sellPriceLine = null;
    candleMarkers = [];
    if (candlestickSeries) setCandleMarkers(candleMarkers);
  }

  function setCandleMarkers(markers) {
    if (typeof candlestickSeries.setMarkers === 'function') {
      candlestickSeries.setMarkers(markers);
      return;
    }
    if (!markerController && LightweightCharts.createSeriesMarkers) {
      markerController = LightweightCharts.createSeriesMarkers(candlestickSeries, markers);
    } else if (markerController) {
      markerController.setMarkers(markers);
    }
  }

  function drawTradeMarker() {
    if (!activeTrade) return;
    if (priceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(priceLine);
      priceLine = null;
    }
    if (sellPriceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(sellPriceLine);
      sellPriceLine = null;
    }
    candleMarkers = [{
      time: activeTrade.buyDate,
      position: 'belowBar',
      color: '#f0b90b',
      shape: 'arrowUp',
      text: 'B',
    }];
    if (activeTrade.sellDate) {
      candleMarkers.push({
        time: activeTrade.sellDate,
        position: 'aboveBar',
        color: '#4cc9f0',
        shape: 'arrowDown',
        text: 'S',
      });
      sellPriceLine = candlestickSeries.createPriceLine({
        price: activeTrade.sellPrice,
        color: '#4cc9f0',
        lineWidth: 2,
        lineStyle: 2,
        axisLabelVisible: true,
        title: '卖出',
      });
    }
    setCandleMarkers(candleMarkers);
    priceLine = candlestickSeries.createPriceLine({
      price: activeTrade.buyPrice,
      color: '#f0b90b',
      lineWidth: 2,
      lineStyle: 2,
      axisLabelVisible: true,
      title: '买入',
    });
  }

  function initChart() {
    const container = document.getElementById('chartContainer');
    
    chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: container.clientHeight,
      layout: {
        background: { type: 'solid', color: '#111419' },
        textColor: '#818998',
      },
      grid: {
        vertLines: { color: '#1e232a' },
        horzLines: { color: '#1e232a' },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
      },
      rightPriceScale: {
        borderColor: '#2b2f36',
      },
      timeScale: {
        borderColor: '#2b2f36',
        timeVisible: false,
      },
      handleScroll: {
        mouseWheel: true,
        pressedMouseMove: true,
        horzTouchDrag: true,
        vertTouchDrag: false,
      },
      handleScale: {
        mouseWheel: true,
        pinch: true,
        axisPressedMouseMove: false,
        axisDoubleClickReset: true,
      },
    });

    const resizeChart = () => chart.resize(container.clientWidth, container.clientHeight);
    window.addEventListener('resize', resizeChart);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeChart).observe(container);
    }

    // 1. K 线主图层
    candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#ff3333',
      downColor: '#00b050',
      borderVisible: false,
      wickUpColor: '#ff3333',
      wickDownColor: '#00b050',
    });

    // 【关键配置 1】：设置 K 线主 Y 轴 (right)，底部留出 30% 的空间给成交量
    chart.priceScale('right').applyOptions({
      autoScale: true,
      scaleMargins: {
        top: 0.05,   // 顶部留白 5%
        bottom: 0.3, // 底部留白 30%（K线不会落入底部30%的成交量区域）
      },
    });

    ma5Series = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#ffb000',
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
    });
    ma10Series = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#00a0e9',
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
    });
    ma20Series = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#e4007f',
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
    });

    // 2. 成交量图层 (给它单独指定 priceScaleId: 'volume')
    volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: 'volume' },
      priceScaleId: 'volume', // 指定独立 Y 轴
      priceLineVisible: false , 
      lastValueVisible: false
    });

    // 【关键配置 2】：设置成交量专属 Y 轴的高度比例与隐藏数字
    chart.priceScale('volume').applyOptions({
      autoScale: true,
      scaleMargins: {
        top: 0.8,   // 顶部留白 80% -> 即成交量最高只占底部 20% 高度
        bottom: 0,
      },
      visible: true, // 隐藏成交量 Y 轴右侧的数字，避免和 K 线价格重叠
    });

    // 十字光标移动监听
    chart.subscribeCrosshairMove(param => {
      if (!param.time || !param.seriesData) return;
      const candle = param.seriesData.get(candlestickSeries);

      if (candle) {
        document.getElementById('codeVal').innerText = displayCodeLabel();
        const hoveredData = fullData.find(item => item.date === param.time);
        document.getElementById('amountVal').innerText = formatAmount(hoveredData?.amount);
      }
    });
  }

  // 核心更新逻辑：将数据写入各个 Series
  function updateChartData() {
    const displayData = fullData.slice(0, currentIndex);

    if (displayData.length === 0) return;

    // 格式化 TradingView 所需数据结构（确保 date 格式为字符串 "YYYY-MM-DD"）
    const candles = [];
    const volumes = [];
    const ma5Data = [];
    const ma10Data = [];
    const ma20Data = [];

    displayData.forEach(d => {
      // 提取纯 YYYY-MM-DD 日期
      const timeStr = typeof d.date === 'string' ? d.date.split('T')[0] : d.date;
      const candleColor = {
        'limit-up': '#f0b90b',
        'touch-limit-up-up': '#ff69b4',
        'touch-limit-up-down': '#c2185b',
        'limit-down': '#8e44ad',
        up: '#ff3333',
        down: '#00b050',
      }[d.limitStatus] || (Number(d.close) >= Number(d.open) ? '#ff3333' : '#00b050');

      candles.push({
        time: timeStr,
        open: Number(d.open),
        high: Number(d.high),
        low: Number(d.low),
        close: Number(d.close),
        color: candleColor,
        borderColor: candleColor,
        wickColor: candleColor
      });

      volumes.push({
        time: timeStr,
        value: Number(d.volume),
        color: `${candleColor}80`
      });

      if (d.ma5 !== null && d.ma5 !== undefined) {
        ma5Data.push({ time: timeStr, value: Number(d.ma5) });
      }
      if (d.ma10 !== null && d.ma10 !== undefined) {
        ma10Data.push({ time: timeStr, value: Number(d.ma10) });
      }
      if (d.ma20 !== null && d.ma20 !== undefined) {
        ma20Data.push({ time: timeStr, value: Number(d.ma20) });
      }

    });

    // 写入数据到序列
    candlestickSeries.setData(candles);
    volumeSeries.setData(volumes);
    ma5Series.setData(ma5Data);
    ma10Series.setData(ma10Data);
    ma20Series.setData(ma20Data);
    if (activeTrade) drawTradeMarker();

    // 【修正缩放】：使用 setVisibleRange 代替 Range index
    if (candles.length > 0) {
      const startIndex = Math.max(0, candles.length - DEFAULT_VISIBLE_CANDLE_COUNT);
      chart.timeScale().setVisibleRange({
        from: candles[startIndex].time,
        to: candles[candles.length - 1].time,
      });
    }

    // 更新 Legend
    const last = displayData[displayData.length - 1];
    if (last) {
      document.getElementById('codeVal').innerText = displayCodeLabel();
      document.getElementById('amountVal').innerText = formatAmount(last.amount);
    }
  }

  function loadTestCaseFile() {
    const fileName = document.getElementById('testCaseFile').value;
    if (!fileName) return;
    const source = document.getElementById('dataSource').value;
    const request = source === 'favorites'
      ? fetch('/api/favorites').then(res => res.json()).then(res => ({
        status_code: res.status_code,
        data: res.data?.groups?.[fileName] || [],
      }))
      : source === 'dailyReview'
        ? fetch(`/api/daily-review/${encodeURIComponent(fileName)}`).then(res => res.json())
        : fetch(`/api/test-cases/${encodeURIComponent(fileName)}`).then(res => res.json());
    request
      .then(res => {
        if (res.status_code !== 0 || !res.data.length) {
          alert(res.msg || 'JSON 中没有有效每日复盘数据');
          return;
        }
        testCases = res.data;
        if (isDailyReviewSource()) {
          initPortfolioForFile(document.getElementById('testCaseFile').value);
          loadedReviewFile = '';
          initReviewDates(testCases);
          const key = getProgressStorageKey();
          const saved = key ? readReviewProgress(key) : null;
          if (saved && reviewDates.includes(saved.selectedReviewDate)) {
            if (confirm(`检测到未完成的每日复盘进度（${describeReviewProgress(saved)}），是否继续？`)) {
              applyReviewProgress(saved);
            } else {
              clearDailyReviewFileCache(document.getElementById('testCaseFile').value);
            }
          } else if (key) {
            localStorage.removeItem(key);
          }
          loadedReviewFile = document.getElementById('testCaseFile').value;
          invalidateLegacyPortfolioProgress();
          startDailyReviewSession();
          return;
        }
        portfolioFile = '';
        portfolioTrades = [];
        updateReviewPnlBoard();
        updatePortfolioButtons();
        const savedProgress = readProgressCheckpoint();
        const resume = savedProgress && confirm(`检测到未完成的回测进度（${savedProgress.casePosition}/${savedProgress.shuffledCases.length}），是否继续？`);
        if (resume) {
          shuffledCases = savedProgress.shuffledCases;
          casePosition = Math.min(Number(savedProgress.casePosition) || 0, shuffledCases.length);
          successCount = Number(savedProgress.successCount) || 0;
          failureCount = Number(savedProgress.failureCount) || 0;
          boughtStockNames = Array.isArray(savedProgress.boughtStockNames) ? savedProgress.boughtStockNames : [];
        } else {
          if (savedProgress) clearProgressCheckpoint();
          shuffledCases = sortCasesByDate(testCases);
          casePosition = 0;
          successCount = 0;
          failureCount = 0;
          boughtStockNames = [];
          skippedReviewCaseIds = new Set();
        }
        activeTrade = null;
        currentCaseBought = false;
        currentCaseHasFutureData = true;
        updateSourceMode();
        updateTestProgress();
        startNextCase();
      })
      .catch(() => alert('读取测试用例失败'));
  }
