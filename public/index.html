<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>K线训练与盲盒回放工具 (TradingView Lightweight Charts)</title>
  <!-- 引入 TradingView 开源 lightweight-charts -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    * {
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background-color: #0b0e11;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: clamp(8px, 2vw, 16px);
      box-sizing: border-box;
    }
    .container {
      width: min(1100px, 100%);
      max-width: 100%;
      min-width: 0;
      margin: 0 auto;
      height: calc(100dvh - clamp(16px, 4vw, 32px));
      display: flex;
      flex-direction: column;
    }
    .workspace {
      min-height: 0;
      min-width: 0;
      flex: 1;
      display: grid;
      grid-template-rows: 14.2857% minmax(0, 85.7143%);
      gap: 0;
    }
    input {
      background: #1e2329;
      color: #fff;
      border: 1px solid #474d57;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      max-width: 100%;
      box-sizing: border-box;
    }
    select {
      background: #1e2329;
      color: #fff;
      border: 1px solid #474d57;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      max-width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #1e2329;
      color: #f0b90b;
      border: 1px solid #474d57;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover {
      background: #2b313a;
    }
    button:disabled {
      color: #666;
      cursor: not-allowed;
    }
    #buyButton {
      background: #d9363e;
      color: #fff;
      border-color: #d9363e;
    }
    #buyButton:hover:not(:disabled) {
      background: #b52b33;
    }
    #nextCaseButton {
      background: #1f9d55;
      color: #fff;
      border-color: #1f9d55;
    }
    #nextCaseButton:hover:not(:disabled) {
      background: #187a43;
    }
    #nextStepButton {
      background: #1677ff;
      color: #fff;
      border-color: #1677ff;
    }
    #nextStepButton:hover:not(:disabled) {
      background: #0d5dcc;
    }
    .info-board {
      margin-left: auto;
      font-size: 14px;
      font-family: monospace;
    }
    .legend {
      display: flex;
      gap: 15px;
      font-size: 13px;
      margin-bottom: 8px;
      font-family: monospace;
      overflow-x: hidden;
      white-space: nowrap;
      padding-bottom: 2px;
    }
    .chart-area {
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .chart-area .legend {
      flex: 0 0 auto;
    }
    .test-panel {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(180px, 1.5fr) minmax(150px, 1fr) minmax(150px, 1fr) minmax(180px, 2fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid #2b2f36;
      background: #111419;
      overflow: hidden;
    }
    .test-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }
    .favorite-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }
    .favorite-controls input,
    .favorite-controls select {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
    }
    .favorite-controls button {
      flex: 0 0 auto;
      width: 38px;
      height: 34px;
      padding: 0;
      font-size: 22px;
      line-height: 1;
      color: #f0b90b;
      white-space: nowrap;
    }
    .favorite-controls button.is-saved {
      color: #f0b90b;
    }
    .test-status { color: #f0b90b; font-family: monospace; }
    .result-board { color: #aeb8c5; font-family: monospace; }
    #chartContainer {
      width: 100%;
      max-width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border: 1px solid #2b2f36;
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
      touch-action: none;
    }
    @media (max-width: 700px) {
      .test-panel {
        grid-template-columns: minmax(120px, 1fr) minmax(150px, 1.5fr);
        gap: 8px;
        padding: 6px;
      }
      .workspace {
        gap: 0;
      }
      .test-panel > label:first-child {
        grid-column: 1;
        min-width: 0;
      }
      .test-panel > label:nth-child(2) {
        grid-column: 2;
        min-width: 0;
      }
      .test-panel > span {
        display: none;
      }
      .test-panel select {
        width: 100%;
        min-height: 38px;
      }
      .favorite-controls {
        grid-column: 1 / -1;
      }
      .test-actions {
        grid-column: 2 / -1;
        justify-content: stretch;
      }
      .test-actions button {
        flex: 1;
        min-height: 38px;
      }
      .test-status {
        grid-column: 1 / -1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
    @media (max-width: 900px) and (orientation: landscape) {
      body {
        padding: 8px;
      }
      .test-panel {
        display: grid;
        grid-template-columns: minmax(110px, 1fr) minmax(150px, 1.5fr) minmax(170px, 1.5fr) minmax(175px, 2fr);
        gap: 6px;
        padding: 6px;
        font-size: 12px;
      }
      .test-panel > label:first-child {
        grid-column: 1;
      }
      .test-panel > label:nth-child(2) {
        grid-column: 2;
      }
      .test-panel > span {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .test-panel > #stockNameVal,
      .test-panel > #testStatus {
        display: none;
      }
      .test-panel select {
        min-height: 32px;
        max-width: 100%;
        font-size: 12px;
      }
      .test-actions {
        grid-column: 4;
        grid-row: 1;
        gap: 6px;
        width: 100%;
      }
      .test-actions button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 32px;
        padding: 4px 6px;
        font-size: 12px;
        white-space: nowrap;
      }
      .favorite-controls {
        grid-column: 3;
        grid-row: 1;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="workspace">
    <div class="test-panel">
      <label>
        <select id="dataSource" onchange="switchDataSource()">
          <option value="testcases">测试用例 JSON</option>
          <option value="favorites">收藏 JSON</option>
        </select>
      </label>
      <label>
        <select id="testCaseFile" onchange="loadTestCaseFile()">
          <option value="">请选择测试用例</option>
        </select>
      </label>
      <span id="stockNameVal" style="color:#f0b90b;">股票名称: --</span>
      <span id="testStatus" class="test-status">请选择测试用例 JSON 或收藏分组</span>
      <div class="favorite-controls">
        <select id="favoriteGroup" aria-label="收藏分组" onchange="updateFavoriteButton()"></select>
        <input id="newFavoriteGroup" type="text" placeholder="新建分组">
        <button id="favoriteButton" type="button" onclick="toggleFavorite()" aria-label="添加收藏" title="添加收藏">☆</button>
      </div>
      <div class="test-actions">
        <button id="buyButton" onclick="buyAtCurrentCandle()" disabled>买入</button>
        <button id="nextStepButton" onclick="nextStep()">快进</button>
        <button id="nextCaseButton" onclick="nextTestCase()" disabled>空仓</button>
      </div>
    </div>

    <div class="chart-area">
      <div class="legend">
        <span id="codeVal" style="color: #f0b90b;">股票代码: --</span>
        <span id="dateVal" style="color: #fff;">日期: --</span>
        <span id="amountVal" style="color: #b0b8c4;">成交金额: --</span>
        <span class="result-board">成功: <span id="successCount">0</span></span>
        <span class="result-board">失败: <span id="failureCount">0</span></span>
        <span class="result-board">总数: <span id="totalCount">0</span></span>
      </div>
      <div id="chartContainer"></div>
    </div>
  </div>
</div>

<script>
  let fullData = [];
  let currentIndex = 0; // 当前推演到的索引位置
  
  let chart, candlestickSeries, volumeSeries;
  let priceLine = null;
  let candleMarkers = [];
  let markerController = null;
  let testCases = [];
  let shuffledCases = [];
  let casePosition = 0;
  let favoriteGroups = {};
  let activeCase = null;
  let activeTrade = null;
  let caseResolved = false;
  let successCount = 0;
  let failureCount = 0;
  let favoriteSaved = false;

  function formatAmount(amount) {
    const value = Number(amount);
    if (!Number.isFinite(value)) return '成交金额: --';
    if (Math.abs(value) < 1e8) {
      return `成交金额: ${(value / 1e7).toFixed(2)}千万`;
    }
    return `成交金额: ${(value / 1e8).toFixed(2)}亿`;
  }

  function shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function setTestButtons(enabled) {
    document.getElementById('buyButton').disabled = !enabled;
    document.getElementById('nextCaseButton').disabled = !activeCase || (!enabled && !caseResolved);
  }

  function updateTestProgress() {
    document.getElementById('successCount').innerText = successCount;
    document.getElementById('failureCount').innerText = failureCount;
    document.getElementById('totalCount').innerText = shuffledCases.length;
  }

  function clearTradeDrawing() {
    if (priceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(priceLine);
    }
    priceLine = null;
    candleMarkers = [];
    if (candlestickSeries) setCandleMarkers(candleMarkers);
  }

  function setCandleMarkers(markers) {
    if (typeof candlestickSeries.setMarkers === 'function') {
      candlestickSeries.setMarkers(markers);
      return;
    }
    if (!markerController && LightweightCharts.createSeriesMarkers) {
      markerController = LightweightCharts.createSeriesMarkers(candlestickSeries, markers);
    } else if (markerController) {
      markerController.setMarkers(markers);
    }
  }

  function drawTradeMarker() {
    if (!activeTrade) return;
    if (priceLine && candlestickSeries) {
      candlestickSeries.removePriceLine(priceLine);
      priceLine = null;
    }
    candleMarkers = [{
      time: activeTrade.buyDate,
      position: 'belowBar',
      color: '#f0b90b',
      shape: 'arrowUp',
      text: 'B',
    }];
    setCandleMarkers(candleMarkers);
    priceLine = candlestickSeries.createPriceLine({
      price: activeTrade.buyPrice,
      color: '#f0b90b',
      lineWidth: 2,
      lineStyle: 2,
      axisLabelVisible: true,
      title: '买入',
    });
  }

  function initChart() {
    const container = document.getElementById('chartContainer');
    
    chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: container.clientHeight,
      layout: {
        background: { type: 'solid', color: '#111419' },
        textColor: '#818998',
      },
      grid: {
        vertLines: { color: '#1e232a' },
        horzLines: { color: '#1e232a' },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
      },
      rightPriceScale: {
        borderColor: '#2b2f36',
      },
      timeScale: {
        borderColor: '#2b2f36',
        timeVisible: false,
      },
      handleScroll: {
        mouseWheel: true,
        pressedMouseMove: true,
        horzTouchDrag: true,
        vertTouchDrag: false,
      },
      handleScale: {
        mouseWheel: true,
        pinch: true,
        axisPressedMouseMove: true,
        axisDoubleClickReset: false,
      },
    });

    const resizeChart = () => chart.resize(container.clientWidth, container.clientHeight);
    window.addEventListener('resize', resizeChart);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeChart).observe(container);
    }

    // 1. K 线主图层
    candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#ff3333',
      downColor: '#00b050',
      borderVisible: false,
      wickUpColor: '#ff3333',
      wickDownColor: '#00b050',
    });

    // 【关键配置 1】：设置 K 线主 Y 轴 (right)，底部留出 30% 的空间给成交量
    chart.priceScale('right').applyOptions({
      scaleMargins: {
        top: 0.05,   // 顶部留白 5%
        bottom: 0.3, // 底部留白 30%（K线不会落入底部30%的成交量区域）
      },
    });

    // 2. 成交量图层 (给它单独指定 priceScaleId: 'volume')
    volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: 'volume' },
      priceScaleId: 'volume', // 指定独立 Y 轴
      priceLineVisible: false , 
      lastValueVisible: false
    });

    // 【关键配置 2】：设置成交量专属 Y 轴的高度比例与隐藏数字
    chart.priceScale('volume').applyOptions({
      scaleMargins: {
        top: 0.8,   // 顶部留白 80% -> 即成交量最高只占底部 20% 高度
        bottom: 0,
      },
      visible: true, // 隐藏成交量 Y 轴右侧的数字，避免和 K 线价格重叠
    });

    // 十字光标移动监听
    chart.subscribeCrosshairMove(param => {
      if (!param.time || !param.seriesData) return;
      const candle = param.seriesData.get(candlestickSeries);

      if (candle) {
        document.getElementById('codeVal').innerText = `股票代码: ${activeCase?.marketCode || activeCase?.code || '--'}`;
        document.getElementById('dateVal').innerText = `日期: ${param.time}`;
        const hoveredData = fullData.find(item => item.date === param.time);
        document.getElementById('amountVal').innerText = formatAmount(hoveredData?.amount);
      }
    });
  }

  // 核心更新逻辑：将数据写入各个 Series
  function updateChartData() {
    const displayData = fullData.slice(0, currentIndex);
    const visibleCount = 100;

    if (displayData.length === 0) return;

    // 格式化 TradingView 所需数据结构（确保 date 格式为字符串 "YYYY-MM-DD"）
    const candles = [];
    const volumes = [];

    displayData.forEach(d => {
      // 提取纯 YYYY-MM-DD 日期
      const timeStr = typeof d.date === 'string' ? d.date.split('T')[0] : d.date;
      const candleColor = {
        'limit-up': '#f0b90b',
        'touch-limit-up-up': '#ff69b4',
        'touch-limit-up-down': '#c2185b',
        'limit-down': '#8e44ad',
        up: '#ff3333',
        down: '#00b050',
      }[d.limitStatus] || (Number(d.close) >= Number(d.open) ? '#ff3333' : '#00b050');

      candles.push({
        time: timeStr,
        open: Number(d.open),
        high: Number(d.high),
        low: Number(d.low),
        close: Number(d.close),
        color: candleColor,
        borderColor: candleColor,
        wickColor: candleColor
      });

      volumes.push({
        time: timeStr,
        value: Number(d.volume),
        color: `${candleColor}80`
      });

    });

    // 写入数据到序列
    candlestickSeries.setData(candles);
    volumeSeries.setData(volumes);
    if (activeTrade) drawTradeMarker();

    // 【修正缩放】：使用 setVisibleRange 代替 Range index
    if (candles.length > 0) {
      const startIndex = Math.max(0, candles.length - visibleCount);
      chart.timeScale().setVisibleRange({
        from: candles[startIndex].time,
        to: candles[candles.length - 1].time,
      });
    }

    // 更新 Legend
    const last = displayData[displayData.length - 1];
    if (last) {
      document.getElementById('codeVal').innerText = `股票代码: ${activeCase?.marketCode || activeCase?.code || '--'}`;
      document.getElementById('dateVal').innerText = `日期: ${last.date}`;
      document.getElementById('amountVal').innerText = formatAmount(last.amount);
    }
  }

  function updateFavoriteGroups() {
    const select = document.getElementById('favoriteGroup');
    const current = select.value;
    select.options.length = 0;
    Object.keys(favoriteGroups).forEach(group => {
      const option = document.createElement('option');
      option.value = group;
      option.textContent = group;
      select.appendChild(option);
    });
    if (current && favoriteGroups[current]) select.value = current;
    if (!select.options.length) {
      const option = document.createElement('option');
      option.value = '默认';
      option.textContent = '默认';
      select.appendChild(option);
    }
    updateFavoriteButton();
  }

  function updateFavoriteButton() {
    const button = document.getElementById('favoriteButton');
    if (!button) return;
    const group = document.getElementById('favoriteGroup').value || '默认';
    const saved = Boolean(activeCase && favoriteGroups[group]?.some(item => (
      item.code === activeCase.code && item.date === activeCase.date
    )));
    favoriteSaved = saved;
    button.textContent = saved ? '★' : '☆';
    button.classList.toggle('is-saved', saved);
    button.disabled = !activeCase;
    button.setAttribute('aria-label', saved ? '取消收藏' : '添加收藏');
    button.title = saved ? '取消收藏' : '添加收藏';
  }

  function updateDataSourceOptions(files) {
    const select = document.getElementById('testCaseFile');
    const source = document.getElementById('dataSource').value;
    select.options.length = 1;
    select.options[0].textContent = source === 'favorites' ? '请选择收藏分组' : '请选择测试用例 JSON';
    files.forEach(file => {
      const option = document.createElement('option');
      option.value = file;
      option.textContent = file;
      select.appendChild(option);
    });
  }

  function switchDataSource() {
    const source = document.getElementById('dataSource').value;
    if (source === 'favorites') {
      updateDataSourceOptions(Object.keys(favoriteGroups));
    } else {
      loadTestCaseFiles();
    }
  }

  function loadTestCaseFiles() {
    const status = document.getElementById('testStatus');
    fetch(`/api/test-cases?ts=${Date.now()}`, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(res => {
        if (res.status_code !== 0 || !Array.isArray(res.files)) {
          throw new Error(res.msg || '测试用例接口返回格式错误');
        }
        updateDataSourceOptions(res.files);
        if (!res.files.length) status.innerText = 'test-cases 文件夹中没有 JSON 测试用例';
      })
      .catch(error => {
        status.innerText = `无法读取测试用例: ${error.message}`;
      });
  }

  function loadTestCaseFile() {
    const fileName = document.getElementById('testCaseFile').value;
    if (!fileName) return;
    const source = document.getElementById('dataSource').value;
    const request = source === 'favorites'
      ? fetch('/api/favorites').then(res => res.json()).then(res => ({
        status_code: res.status_code,
        data: res.data?.groups?.[fileName] || [],
      }))
      : fetch(`/api/test-cases/${encodeURIComponent(fileName)}`).then(res => res.json());
    request
      .then(res => {
        if (res.status_code !== 0 || !res.data.length) {
          alert(res.msg || 'xlsx 中没有有效测试用例');
          return;
        }
        testCases = res.data;
        shuffledCases = shuffle(testCases);
        casePosition = 0;
        successCount = 0;
        failureCount = 0;
        activeTrade = null;
        updateTestProgress();
        startNextCase();
      })
      .catch(() => alert('读取测试用例失败'));
  }

  function toggleFavorite() {
    if (!activeCase) {
      alert('请先加载一个测试用例');
      return;
    }
    const inputGroup = document.getElementById('newFavoriteGroup').value.trim();
    const group = inputGroup || document.getElementById('favoriteGroup').value || '默认';
    const saved = favoriteGroups[group]?.some(item => (
      item.code === activeCase.code && item.date === activeCase.date
    ));
    if (saved) {
      removeCurrentFavorite(group);
      return;
    }
    saveCurrentFavorite(group);
  }

  function saveCurrentFavorite(group) {
    if (!activeCase) {
      alert('请先加载一个测试用例');
      return;
    }
    if (favoriteGroups[group]?.some(item => (
      item.code === activeCase.code && item.date === activeCase.date
    ))) {
      favoriteSaved = true;
      updateFavoriteButton();
      return;
    }
    fetch('/api/favorites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group, item: activeCase }),
    })
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0) throw new Error(res.msg || '收藏失败');
        favoriteGroups = res.data.groups || {};
        updateFavoriteGroups();
        document.getElementById('favoriteGroup').value = group;
        document.getElementById('newFavoriteGroup').value = '';
        favoriteGroups = res.data.groups || {};
        favoriteSaved = true;
        updateFavoriteButton();
        document.getElementById('testStatus').innerText = `股票代码 ${activeCase.marketCode || activeCase.code} 股票名称 ${activeCase.stockName || '--'} 时间 ${activeCase.date} 添加收藏夹成功`;
      })
      .catch(error => alert(error.message));
  }

  function removeCurrentFavorite(group) {
    fetch('/api/favorites', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        group,
        code: activeCase.code,
        date: activeCase.date,
      }),
    })
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0) throw new Error(res.msg || '取消收藏失败');
        favoriteGroups = res.data.groups || {};
        updateFavoriteGroups();
        favoriteSaved = false;
        updateFavoriteButton();
        document.getElementById('testStatus').innerText = `股票代码 ${activeCase.marketCode || activeCase.code} 股票名称 ${activeCase.stockName || '--'} 时间 ${activeCase.date} 取消收藏成功`;
      })
      .catch(error => alert(error.message));
  }

  function startNextCase() {
    clearTradeDrawing();
    activeTrade = null;
    caseResolved = false;
    favoriteSaved = false;
    updateFavoriteButton();
    document.getElementById('nextCaseButton').innerText = '空仓';
    if (casePosition >= shuffledCases.length) {
      setTestButtons(false);
      document.getElementById('stockNameVal').innerText = '股票名称: --';
      document.getElementById('codeVal').innerText = '股票代码: --';
      document.getElementById('testStatus').innerText = `回测结束，成功率 ${(successCount / (successCount + failureCount || 1) * 100).toFixed(2)}%`;
      alert(`回测结束\n成功：${successCount}\n失败：${failureCount}\n成功率：${(successCount / (successCount + failureCount || 1) * 100).toFixed(2)}%`);
      return;
    }

    activeCase = shuffledCases[casePosition];
    updateFavoriteButton();
    document.getElementById('stockNameVal').innerText = '股票名称: --';
    document.getElementById('stockNameVal').style.visibility = 'hidden';
    document.getElementById('testStatus').innerText = `正在回放 ${activeCase.marketCode} ${activeCase.date}`;
    setTestButtons(false);

    fetch(`/api/kline?code=${activeCase.code}&cutoffDate=${activeCase.date}`)
      .then(res => res.json())
      .then(res => {
        if (res.status_code !== 0 || !res.data.length) {
          document.getElementById('testStatus').innerText = '该用例没有 K 线数据，自动跳过';
          casePosition++;
          updateTestProgress();
          startNextCase();
          return;
        }
        fullData = res.data;
        const startIndex = fullData.findIndex(item => item.date >= activeCase.date);
        if (startIndex < 0 || startIndex + 1 >= fullData.length) {
          casePosition++;
          updateTestProgress();
          startNextCase();
          return;
        }
        currentIndex = startIndex + 1;
        updateTestProgress();
        updateChartData();
        setTestButtons(true);
      });
  }

  function finishCurrentCase(message) {
    document.getElementById('testStatus').innerText = message;
    caseResolved = true;
    document.getElementById('buyButton').disabled = true;
    document.getElementById('nextCaseButton').disabled = false;
    document.getElementById('nextCaseButton').innerText = '继续';
    updateTestProgress();
  }

  function buyAtCurrentCandle() {
    if (!activeCase || activeTrade || currentIndex === 0) return;
    const buyIndex = currentIndex - 1;
    const entryIndex = buyIndex + 1;
    const resultIndex = buyIndex + 2;
    const entryCandle = fullData[entryIndex];
    const resultCandle = fullData[resultIndex];
    if (!entryCandle || !resultCandle) {
      finishCurrentCase('没有下一根 K 线，跳过本用例');
      return;
    }

    activeTrade = {
      buyDate: entryCandle.date,
      buyPrice: Number(entryCandle.close),
    };
    // 展示 B 点以及其后的 7 根 K 线
    currentIndex = Math.min(entryIndex + 8, fullData.length);
    updateChartData();

    if (resultCandle.limitStatus === 'limit-up') {
      successCount++;
      finishCurrentCase(`成功：${resultCandle.date} 为 B 点后的第二根 K 线并收盘涨停`);
    } else {
      failureCount++;
      finishCurrentCase(`失败：${resultCandle.date} 为 B 点后的第二根 K 线但未收盘涨停`);
    }
  }

  function nextTestCase() {
    if (!activeCase) return;
    if (!caseResolved) {
      const buyIndex = currentIndex - 1;
      const entryIndex = buyIndex + 1;
      currentIndex = Math.min(entryIndex + 8, fullData.length);
      updateChartData();
      caseResolved = true;
      document.getElementById('buyButton').disabled = true;
      document.getElementById('nextCaseButton').innerText = '继续';
      document.getElementById('testStatus').innerText = '空仓：已展示后续 K 线，再次点击进入下一题';
      return;
    }
    clearTradeDrawing();
    activeTrade = null;
    casePosition++;
    updateTestProgress();
    startNextCase();
  }

  // 快捷键推进
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      nextStep();
    }
  });

  function requestLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  }

  window.addEventListener('pointerdown', requestLandscape, { once: true });

  function nextStep() {
    if (currentIndex < fullData.length) {
      currentIndex++;
      updateChartData();
    }
  }

  window.onload = () => {
    initChart();
    loadTestCaseFiles();
    fetch('/api/favorites')
      .then(res => res.json())
      .then(res => {
        favoriteGroups = res.data?.groups || {};
        updateFavoriteGroups();
      })
      .catch(() => updateFavoriteGroups());
    requestLandscape();
  };
</script>

</body>
</html>
