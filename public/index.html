<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复盘工具</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #0b0e11;
      --panel: #161a1e;
      --line: #2b313a;
      --text: #cccccc;
      --muted: #8994a2;
      --accent: #f0b90b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px 16px;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 16px; color: #eaecef; font-weight: 600; }
    nav { display: grid; gap: 10px; }
    a {
      display: block;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
    }
    a:hover, a:focus-visible { border-color: var(--accent); outline: none; }
    a b { display: block; color: #eaecef; font-size: 15px; font-weight: 600; }
    a span { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>复盘工具</h1>
    <nav>

      <a href="/limit-up-cycle.html"><b>连板情绪周期</b><span>每天的最高连板和涨停家数</span></a>
      <a href="/news-calendar.html"><b>新闻日历</b><span>按日期看当天所有涨停股、涨停时间和新闻，了解题材演绎</span></a>
      <a href="/theme-gantt.html"><b>题材演绎</b><span>题材时间线和人工评审（只在本地可用）</span></a>
      <a href="/news-category.html"><b>新闻类别评审</b><span>按类别看大模型判为重要的新闻（只在本地可用）</span></a>
    </nav>
  </main>
</body>
</html>
