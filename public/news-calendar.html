<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新闻日历</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0b0e11;
      --panel: #161a1e;
      --panel-2: #1e2329;
      --line: #2b313a;
      --text: #cccccc;
      --muted: #8994a2;
      --accent: #f0b90b;
      --heat: 91, 141, 239;
      --count: #5b8def;
      --strong: #e5484d;
      --weak: #b88800;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    button, input { font: inherit; }
    a { color: inherit; }
    main { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
    header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 0; }
    header.top h1 { font-size: 16px; margin: 0; color: #eaecef; font-weight: 600; white-space: nowrap; }
    header.top a { color: var(--muted); text-decoration: none; }
    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    header.top { position: relative; }
    #dateButton { min-width: 120px; color: #eaecef; font-variant-numeric: tabular-nums; }
    #calendarPop {
      position: absolute;
      z-index: 30;
      top: calc(100% - 4px);
      left: 0;
      width: min(420px, calc(100vw - 32px));
      padding: 9px;
      box-sizing: border-box;
      border: 1px solid #526176;
      border-radius: 4px;
      background: #111419;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    #calendarPop[hidden] { display: none; }
    .cal-head { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .cal-head select { flex: 1 1 0; min-width: 0; padding: 4px 6px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
    .cal-head .btn { padding: 2px 9px; }
    #calendar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
    #calendar .cell { min-height: 40px; padding: 3px 5px; }
    .weekday { text-align: center; color: var(--muted); font-size: 12px; }
    .cell {
      position: relative;
      min-height: 52px;
      padding: 4px 6px;
      background: rgba(var(--heat), var(--level, 0));
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .cell.empty { background: none; border-color: transparent; cursor: default; }
    .cell.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .cell b { display: block; color: #eaecef; font-weight: 600; font-size: 13px; }
    .cell span { display: block; font-size: 12px; line-height: 1.3; }
    #dayHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 14px 0 8px; }
    #dayHead b { color: #eaecef; font-size: 16px; font-weight: 600; }
    #themes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 2px 10px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .chip.active { border-color: var(--accent); color: #eaecef; }
    .chip small { color: var(--muted); }
    .chip em { font-style: normal; color: var(--accent); font-size: 12px; }
    .chip em.fx { color: #f0a020; }
    .fx-note .fx-hint { color: var(--muted); }
    .fx-note { margin: 4px 0 6px; padding: 4px 8px; border-left: 3px solid #f0a020; background: rgba(240,160,32,.08); color: #e8c27a; font-size: 12px; line-height: 1.5; }
    .tag.fx { border-color: #f0a020; color: #f0a020; }
    .bar .fx-dot { color: #f0a020; font-weight: 700; margin-right: 1px; }
    .chip .ev { color: #5fd38d; font-size: 12px; }
    .chip.static { opacity: 0.5; }
    .tag.ev { border-color: #2e9e78; color: #5fd38d; }
    .tag.follow { border-color: #6b7280; color: var(--muted); }
    .evidence { margin: 4px 0 6px; font-size: 13px; }
    .evidence div { padding: 1px 0; }
    .evidence .yes { color: #5fd38d; }
    .evidence .no { color: var(--muted); }
    .theme-day .ok { color: #5fd38d; }
    #themePanel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
    #themePanel h2 { font-size: 14px; margin: 0 0 6px; color: #eaecef; font-weight: 600; }
    #themePanel h2 small { color: var(--muted); font-weight: 400; }
    .bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; align-items: end; height: 76px; margin-bottom: 8px; }
    .bar { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: 11px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .bar i { position: relative; display: block; background: var(--count); border-radius: 2px 2px 0 0; min-height: 1px; }
    .bar i b { position: absolute; left: 0; right: 0; bottom: 0; background: #2e9e78; border-radius: 2px 2px 0 0; }
    .bar.selected { color: var(--accent); }
    .bar.selected i { outline: 1px solid var(--accent); }
    .bar.unjudged, .strip .pt.unjudged { opacity: 0.35; }
    #themePanel .bars { height: 92px; }
    /* 四连板跨度：图表下面的横条，和柱子同一列宽 */
    .four-spans { position: relative; border-top: 1px dashed var(--line); margin-top: 2px; }
    .four-span { position: absolute; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 3px; background: rgba(137, 148, 162, 0.18); border: 1px solid #4b5563; color: #aeb8c5; font-size: 11px; line-height: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 属于当前题材的四连板标红 */
    .four-span.in-theme { background: rgba(229, 72, 77, 0.28); border-color: #e5484d; color: #ffd0d1; }
    .four-spans-empty { color: var(--muted); font-size: 12px; padding: 2px 0; }
    #themeSearchBar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 8px; }
    #themeSearch { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; width: 220px; max-width: 100%; }
    #themeSearchHint { color: var(--muted); font-size: 12px; }
    /* 全部历史：列多时固定列宽、横向滚动 */
    .trend-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
    .trend-inner { min-width: 100%; }
    .trend-nav { display: inline-flex; gap: 4px; margin-left: 8px; }
    .trend-nav .btn { padding: 0 8px; font-size: 12px; }
    .strip-caption { align-items: center; }
    .bar .day b { color: #eaecef; font-weight: 600; }
    .bar.today .day { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 2px; }
    /* 最高板折线：和下面的柱子同样的列，纵轴独立且固定 1 到 max(5, 这段最高板)，不同题材能直接比高度 */
    .strip-caption { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .strip { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; height: 62px; margin-bottom: 4px; border-bottom: 1px dashed var(--line); }
    .strip svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .strip polyline { fill: none; stroke: #ff8f93; stroke-width: 1.5; }
    .strip .pt { position: relative; background: none; border: 0; padding: 0; cursor: pointer; }
    .strip .pt i { position: absolute; left: 50%; width: 7px; height: 7px; margin: 0 0 -3.5px -3.5px; border-radius: 50%; background: #ff8f93; }
    .strip .pt span { position: absolute; left: -6px; right: -6px; text-align: center; font-size: 11px; line-height: 1; color: #ff8f93; font-variant-numeric: tabular-nums; }
    .strip .pt.selected i { box-shadow: 0 0 0 2px var(--accent); }
    /* 家数柱按板数分层：首板、2 板、3 板及以上，越高越亮 */
    .bar i.tiers { display: flex; flex-direction: column-reverse; background: none; overflow: hidden; }
    .bar i.tiers s { display: block; text-decoration: none; }
    .tier-legend { display: inline-flex; gap: 8px; font-size: 11px; color: var(--muted); }
    .tier-legend s { display: inline-block; width: 9px; height: 9px; margin-right: 3px; border-radius: 2px; vertical-align: -1px; text-decoration: none; }
    .panel-summary { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .panel-summary b { color: #eaecef; font-weight: 600; }
    .panel-day { border-top: 1px dashed var(--line); padding-top: 6px; }
    .panel-day h3 { font-size: 13px; margin: 0 0 4px; color: #eaecef; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    .panel-day h3 .btn { font-size: 12px; padding: 0 8px; font-weight: 400; }
    .panel-stock { font-size: 13px; padding: 3px 0; }
    .panel-stock .name { margin-right: 6px; }
    .panel-stock .why { color: var(--muted); }
    .panel-stock .src { color: var(--muted); font-size: 12px; padding-left: 12px; }
    .panel-stock .src a { color: var(--muted); }
    .tag.event { border-color: #7d5fd3; color: #c3b0ff; }
    .theme-day { font-size: 13px; padding: 2px 0; }
    .theme-day button { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font: inherit; font-variant-numeric: tabular-nums; }
    .theme-day button:hover { color: var(--text); }
    .origin-news { font-size: 13px; color: var(--muted); padding: 2px 0 2px 12px; }
    #filters {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      padding: 8px 0;
      background: var(--bg);
    }
    #filters label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    #search {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 8px;
      min-width: 0;
      width: 180px;
    }
    #count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
    .group { margin: 14px 0 4px; color: #eaecef; font-weight: 600; }
    .group small { color: var(--muted); font-weight: 400; }
    details.stock { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); margin-bottom: 4px; }
    details.stock > summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px 10px;
      padding: 7px 10px;
      cursor: pointer;
      list-style: none;
    }
    details.stock > summary::-webkit-details-marker { display: none; }
    .name { color: #eaecef; font-weight: 600; }
    .time { color: var(--muted); font-variant-numeric: tabular-nums; }
    .reason { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 160px; }
    .tag { font-size: 12px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
    .tag.strong { border-color: var(--strong); color: #ff8f93; }
    .tag.weak { border-color: var(--weak); color: #e0b84c; }
    .body { padding: 2px 10px 10px; border-top: 1px solid var(--line); }
    .origin { margin: 6px 0; font-size: 13px; }
    .origin b { color: #eaecef; font-weight: 600; }
    .news { padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13px; }
    .news:first-of-type { border-top: 0; }
    .news a { color: var(--text); text-decoration: none; }
    .news a:hover { text-decoration: underline; }
    .news.important a { color: #eaecef; font-weight: 600; }
    .news time { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
    .kind {
      display: inline-block;
      margin-right: 6px;
      padding: 0 6px;
      border-left: 3px solid var(--k);
      border-radius: 2px;
      background: color-mix(in srgb, var(--k) 22%, transparent);
      color: #eaecef;
      font-size: 12px;
      white-space: nowrap;
    }
    .kind.plain { color: var(--muted); background: none; }
    #legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; padding-bottom: 4px; }
    #legend button.kind { border-top: 0; border-right: 0; border-bottom: 0; font: inherit; font-size: 12px; cursor: pointer; }
    #legend.filtering button.kind:not(.active) { opacity: 0.4; }
    #legend button.kind.active { outline: 1px solid var(--k); }
    #legend .legend-hint { color: var(--muted); font-size: 12px; margin-left: 6px; }
    .news p { margin: 2px 0 0; color: var(--muted); }
    .hint { color: var(--muted); font-size: 13px; padding: 6px 0; }
    @media (max-width: 560px) {
      .cell { min-height: 46px; padding: 3px 4px; }
      .cell span { font-size: 11px; white-space: nowrap; }
      #search { width: 120px; }
      .reason { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <h1>新闻日历</h1>
      <button class="btn" id="dateButton" aria-haspopup="true" aria-expanded="false" title="选择日期"></button>
      <button class="btn" id="prevDay" title="键盘 ←">前一天</button>
      <button class="btn" id="nextDay" title="键盘 →">后一天</button>
      <a href="/" style="margin-left:auto">首页</a>
      <div id="calendarPop" hidden>
        <div class="cal-head">
          <button class="btn" id="prevMonth" type="button" aria-label="上个月">‹</button>
          <select id="calendarYear" aria-label="年"></select>
          <select id="calendarMonth" aria-label="月"></select>
          <button class="btn" id="nextMonth" type="button" aria-label="下个月">›</button>
        </div>
        <div id="calendar"></div>
      </div>
    </header>
    <div id="dayHead"></div>
    <div id="themeSearchBar">
      <input id="themeSearch" type="search" list="themeNames" placeholder="搜索题材，看全部历史" aria-label="搜索题材" autocomplete="off">
      <datalist id="themeNames"></datalist>
      <span id="themeSearchHint"></span>
    </div>
    <div id="themes"></div>
    <div id="themePanel" hidden></div>
    <div id="filters">
      <label title="只显示有重要新闻的票，展开后也只列重要新闻。没跑过新闻判断的票不显示"><input id="onlyImportant" type="checkbox">只看重要新闻</label>
      <label title="隐藏新闻条数为 0 的票。没跑过新闻判断的票还不知道有没有新闻，会保留"><input id="hideNoNews" type="checkbox">隐藏无新闻</label>
      <label title="一只票有几个概念就出现在几组里"><input id="byTheme" type="checkbox">按题材分组</label>
      <label title="默认题材按新闻事件归（同一催化的票归一起，题材名是从事件提炼的关键词，连板票沿用首板那天的）；勾上改回按同花顺涨停原因的概念。没跑过事件归类的日期总是按概念"><input id="conceptThemes" type="checkbox">按涨停原因概念</label>
      <label title="题材走势只画到页面当前日期，看不到之后的走势（复盘时避免看到未来）"><input id="trendToToday" type="checkbox">走势只到当天</label>
      <label title="题材走势图下面固定画出全市场走到四连板及以上的票（不分题材）：从首板到最后一板的跨度、名称和最高板；属于当前题材的标红（按新闻事件归的题材才有这张图）"><input id="showFours" type="checkbox">四连板跨度</label>
      <label title="按涨停原因概念时有效：题材标签只显示当天至少有一只票用自己的新闻佐证了这个涨停原因的；题材走势里只数和只列有佐证的票。没跑过佐证判断的日期不受影响"><input id="onlyEvidenced" type="checkbox">只看有佐证</label>
      <input id="search" type="search" placeholder="搜索名称 / 代码 / 原因" aria-label="搜索">
      <button class="btn" id="expandAll">全部展开</button>
      <span id="count"></span>
    </div>
    <div id="legend" title="彩色是大模型判为重要的类别；灰色是按标题关键词机械分的，没有判断重要性。点击类别只看当天有这类新闻的票，再点一次取消"></div>
    <div id="list"><div class="hint">加载中…</div></div>
  </main>

  <script>
    const WEEK = ['周一', '周二', '周三', '周四', '周五'];
    const HEAT_MAX = 150;
    const THEME_TREND_DAYS = 21; // 题材走势看今天之前多少个交易日（连今天约一个月）
    const NEW_THEME_DAYS = 4; // 事件题材前这么多个交易日都没出现过，标「新」
    let showAllThemes = false; // 只有 1 家的题材默认收起
    // 重要新闻的类别（大模型判断）：暖色两类是弱类，其余是强类
    const IMPORTANT_KINDS = {
      新叙事: '#b05ac4',
      '海外/明星公司': '#4f8ae0',
      资本运作转型: '#2e9e78',
      '企业荣誉/重要会议': '#1f9fb3',
      政策规范: '#d9822b',
      行业利好: '#c9a227',
    };
    // 其他新闻按标题关键词机械分，只为看着省力，不代表重要性
    const PLAIN_KINDS = [
      ['公告财报', '#8a94a6', /公告|财报|业绩|季报|年报|净利|营收|营业收入|分红|减持|增持|股东|回购|定增|董事会|问询|立案/],
      ['龙虎榜资金', '#7f9a86', /龙虎榜|成交明细|主力|资金|融资|融券|高频透视|大宗交易|游资/],
      ['行情复盘', '#a08f76', /复盘|涨停|跌停|拉升|异动|封板|连板|竞价|盘中|涨超|跌超|午评|收评|早盘|尾盘|板块|概念股|走强|走高|大涨|大跌|一字/],
    ];
    let months = [];
    const loaded = new Map(); // 月份 → { days, news }
    const liveNews = new Map(); // 没跑过新闻判断的票，展开时现查的标题
    let monthIndex = 0;
    let selectedDate = '';
    let activeTheme = '';
    let activeKind = ''; // 点图例筛选的新闻类别
    let panelDate = ''; // 题材走势里点选的那天，只换走势下面的详情，不换页面日期
    let themeFromSearch = false; // 题材是从搜索框选的（事件题材），这天不是事件模式也按事件题材画走势
    const TREND_COLUMN_PX = 26; // 走势列多时每列的宽度，横向滚动
    const BAR_PX = 56; // 家数柱最高的像素

    const el = id => document.getElementById(id);
    // 新闻事件题材：这天跑过事件归类、且没勾「按涨停原因概念」
    const eventMode = day => Boolean(day?.ed) && !el('conceptThemes').checked;
    const themesOfStock = (stock, day) => (eventMode(day) ? stock.et || [] : stock.ths);
    const eventsOf = (stock, date) => loaded.get(date.slice(0, 7))?.events?.[`${stock.c}|${stock.fd || date}`] || null;
    const dayOf = date => loaded.get(date.slice(0, 7))?.days.find(day => day.d === date);
    const newsOf = (stock, date) => loaded.get(date.slice(0, 7))?.news[`${stock.c}|${stock.fd || date}`] || null;
    const evidenceOf = (stock, date) => loaded.get(date.slice(0, 7))?.evidence?.[`${stock.c}|${stock.fd || date}`] || null;
    const hasImportant = stock => stock.v === '强类' || stock.v === '仅弱类';

    async function loadMonth(month) {
      if (loaded.has(month)) return loaded.get(month);
      const payload = await (await fetch(`/api/news-calendar/${month}`)).json();
      if (payload.status_code !== 0) throw new Error(payload.msg);
      loaded.set(month, payload.data);
      return payload.data;
    }

    function renderCalendar() {
      const month = months[monthIndex];
      const years = [...new Set(months.map(item => item.slice(0, 4)))];
      el('calendarYear').innerHTML = years.map(year => `<option value="${year}"${year === month.slice(0, 4) ? ' selected' : ''}>${year}年</option>`).join('');
      el('calendarMonth').innerHTML = months.filter(item => item.startsWith(month.slice(0, 4)))
        .map(item => `<option value="${item}"${item === month ? ' selected' : ''}>${Number(item.slice(5))}月</option>`).join('');
      el('dateButton').textContent = `${selectedDate || month} ▾`;
      el('prevMonth').disabled = monthIndex === 0;
      el('nextMonth').disabled = monthIndex === months.length - 1;
      const days = new Map(loaded.get(month).days.map(day => [day.d, day]));
      const [year, monthNumber] = month.split('-').map(Number);
      const last = new Date(Date.UTC(year, monthNumber, 0)).getUTCDate();
      const cells = WEEK.map(name => `<div class="weekday">${name}</div>`);
      for (let date = 1; date <= last; date++) {
        const weekday = new Date(Date.UTC(year, monthNumber - 1, date)).getUTCDay();
        if (weekday === 0 || weekday === 6) continue;
        if (date === 1 || !cells.some(cell => cell.includes('data-d') || cell.includes('empty'))) {
          for (let pad = 1; pad < weekday; pad++) cells.push('<div class="cell empty"></div>');
        }
        const text = `${month}-${String(date).padStart(2, '0')}`;
        const day = days.get(text);
        if (!day) {
          cells.push(`<div class="cell empty"><span style="color:var(--line)">${date}</span></div>`);
          continue;
        }
        const level = Math.min(day.t / HEAT_MAX, 1) * 0.55;
        cells.push(`<button class="cell${text === selectedDate ? ' selected' : ''}" style="--level:${level.toFixed(3)}" data-d="${text}"><b>${date}</b><span>${day.t}家 ${day.top}板</span></button>`);
      }
      el('calendar').innerHTML = cells.join('');
    }

    function filteredStocks(day) {
      const query = el('search').value.trim().toLowerCase();
      return day.stocks.filter(stock => {
        if (el('onlyImportant').checked && !hasImportant(stock)) return false;
        if (el('hideNoNews').checked && stock.nc === 0) return false;
        if (activeTheme && !themesOfStock(stock, day).includes(activeTheme)) return false;
        // 按类别筛选只看已存的新闻（跑过新闻判断的票），没跑过的不知道有什么新闻，不显示
        if (activeKind && !(newsOf(stock, day.d) || []).some(item => kindsOf(item).includes(activeKind))) return false;
        if (query && ![stock.n, stock.c, stock.r, stock.fr].some(text => (text || '').toLowerCase().includes(query))) return false;
        return true;
      });
    }

    function renderHead(day) {
      const judged = day.stocks.filter(stock => stock.v !== null).length;
      el('dayHead').innerHTML = `<b>${day.d}</b><span>涨停 ${day.t} 家</span><span>首板 ${day.first}</span><span>连板 ${day.t - day.first}</span><span>最高 ${day.top} 板</span><span>有重要新闻 ${day.imp}</span><span style="color:var(--muted)">已判断新闻 ${judged}/${day.t}</span>${day.evd ? `<span style="color:var(--muted)" title="首板涨停原因有没有自己三天新闻佐证（2026-11-06 起不再每天跑），已判断的票数">已判断佐证 ${day.evd}/${day.t}</span>` : ''}`;
      if (eventMode(day)) {
        const grouped = day.stocks.filter(stock => stock.et?.length).length;
        el('dayHead').insertAdjacentHTML('beforeend', `<span style="color:var(--muted)" title="首板按自己首板日及前四个交易日新闻里的催化事件归题材（不看涨停原因），连板票沿用首板那天的；没有事件新闻的票不归类">按新闻事件归题材 ${grouped}/${day.t}</span>`);
        const shown = day.ets.filter(theme => showAllThemes || theme.c > 1 || theme.n === activeTheme);
        const single = day.ets.filter(theme => theme.c === 1).length;
        el('themes').innerHTML = shown.map(theme => {
          // 新题材：前 4 个交易日都没有这个题材（2026-11-12 用户定，如 2026-04-09 储能）
          const isNew = theme.tr.length && theme.tr.slice(-NEW_THEME_DAYS).every(count => count === 0);
          const title = `新闻里是同一类催化事件的票。今天 ${theme.c} 家${theme.l ? `，其中连板 ${theme.l} 只` : ''}，最高 ${theme.top} 板；近 ${theme.tr.length} 个交易日每天家数：${theme.tr.join(' → ') || '无'}${theme.fx ? `

⚠ 可能分化：${divergenceText(theme.fx)}` : ''}`;
          return `<button class="chip${theme.n === activeTheme ? ' active' : ''}" data-theme="${escapeAttr(theme.n)}" title="${escapeAttr(title)}">${escapeHtml(theme.n)} ${theme.c}${theme.top > 1 ? `<small>（最高${theme.top}板）</small>` : ''}${isNew ? ' <em>新</em>' : ''}${theme.fx ? ' <em class="fx">分化?</em>' : ''}</button>`;
        }).join('') + (single ? `<button class="chip" id="toggleSingles">${showAllThemes ? '收起只有 1 家的' : `还有 ${single} 个只有 1 家`}</button>` : '');
        return;
      }
      const hasEvidence = day.evd > 0;
      const visible = day.themes.filter(theme => !(hasEvidence && el('onlyEvidenced').checked && !theme.e) || theme.n === activeTheme);
      const shown = visible.filter(theme => showAllThemes || theme.c > 1 || theme.n === activeTheme);
      const single = visible.filter(theme => theme.c === 1).length;
      el('themes').innerHTML = shown.map(theme => {
        const isNew = theme.tr.length && theme.tr.every(count => count === 0);
        // 发动：今天有佐证，前面几个交易日都没有佐证
        const isStart = hasEvidence && theme.e > 0 && (theme.te || []).every(count => count === 0);
        const evidenceText = hasEvidence ? `；其中用自己新闻佐证了这个涨停原因的 ${theme.e} 家，近 ${(theme.te || []).length} 个交易日每天有佐证的家数：${(theme.te || []).join(' → ') || '无'}` : '';
        const title = `涨停原因含这个概念的都算。近 ${theme.tr.length} 个交易日每天家数：${theme.tr.join(' → ') || '无'}，今天 ${theme.c}${theme.l ? `，其中连板 ${theme.l} 只` : ''}${evidenceText}`;
        const staticClass = hasEvidence && !theme.e ? ' static' : '';
        return `<button class="chip${theme.n === activeTheme ? ' active' : ''}${staticClass}" data-theme="${escapeAttr(theme.n)}" title="${escapeAttr(title)}">${escapeHtml(theme.n)} ${theme.c}${theme.l ? `<small>（连${theme.l}）</small>` : ''}${hasEvidence && theme.e ? ` <span class="ev">✓${theme.e}</span>` : ''}${isStart ? ' <em>发动</em>' : isNew ? ' <em>新</em>' : ''}</button>`;
      }).join('') + (single ? `<button class="chip" id="toggleSingles">${showAllThemes ? '收起只有 1 家的' : `还有 ${single} 个只有 1 家`}</button>` : '');
    }

    // 题材内部分化提示的文字（news-calendar.js 用 theme-divergence.js 算的 fx）：只提醒，不下结论
    // fx.t：首板共同的新标题 [[标题, 挂了几只首板]]；fx.w：这些标题里高位票当初没出现过的两字词（高亮用）
    // 分化提示的文字：模型（mn 说明、mk 关键词）和关键词法（t 首板共同的新标题）任一判了就有
    const divergenceText = fx => {
      const parts = [];
      if (fx.mn) parts.push(`模型：${fx.mn}（区分关键词：${(fx.mk || []).join('、')}）`);
      if (fx.t?.length) parts.push(`标题：今天 ${fx.f} 只首板里，${fx.t.map(([title, count]) => `${count} 只都有「${title}」`).join('；')}；${fx.h.map(item => `${item.n}（${item.s}板）`).join('、')} 首板时的新闻里没有`);
      return `${parts.join('。')}。可能是同题材下的新发酵，请看各票依据自己判断`;
    };
    const escapeHtml = text => String(text ?? '').replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    const escapeAttr = escapeHtml;

    // 今天和之前 THEME_TREND_DAYS 个交易日，跨月时加载上个月
    async function trendDays(date) {
      let list = [];
      for (let index = months.indexOf(date.slice(0, 7)); index >= 0 && list.length <= THEME_TREND_DAYS; index--) {
        const data = await loadMonth(months[index]);
        list = [...data.days.filter(day => day.d <= date), ...list];
      }
      return list.slice(-(THEME_TREND_DAYS + 1));
    }

    let themePanelToken = 0;
    async function renderThemePanel() {
      const panel = el('themePanel');
      const token = ++themePanelToken;
      if (!activeTheme) {
        panel.hidden = true;
        return;
      }
      const theme = activeTheme;
      const byEvent = eventMode(dayOf(selectedDate)) || themeFromSearch;
      // 每天一行：{ date, count, top, topName, tiers:[首板,2板,≥3板], judged, evidenced, stocks? }
      // 事件题材：从题材索引取，从第一次出现到最新一天（全部历史，可左右滚动）；概念题材：今天和之前约一个月，从月份数据里数
      let rows;
      let fourSpans = []; // 四连板及以上的连板跨度 [首板日, 最后一板日, 名称, 最高板]
      if (byEvent) {
        const index = await loadThemeIndex();
        // 全市场的四连板及以上，不分题材
        fourSpans = (Array.isArray(index.fours) ? index.fours : []).map(([start, end, name, top, themes]) => [index.days[start], index.days[end], name, top, themes || '']);
        if (token !== themePanelToken) return;
        const series = index?.themes[theme] || [];
        const byDay = new Map(series.map(([at, count, top, first, second, third, topName, fx]) => [at, { count, top, topName, tiers: [first, second, third], fx: Boolean(fx) }]));
        const start = series.length ? Math.max(0, series[0][0] - 2) : Math.max(0, index.days.indexOf(selectedDate) - THEME_TREND_DAYS);
        rows = index.days.slice(start).map((date, offset) => {
          const at = start + offset;
          const found = byDay.get(at);
          return { date, count: found?.count || 0, top: found?.top || 0, topName: found?.topName || '', tiers: found?.tiers || [0, 0, 0], judged: Boolean(index.ed[at]), evidenced: 0, fx: Boolean(found?.fx) };
        });
        // 勾了「走势只到当天」：页面当前日期之后的不画
        if (el('trendToToday').checked) rows = rows.filter(row => row.date <= selectedDate);
      } else {
        const list = await trendDays(selectedDate);
        if (token !== themePanelToken) return;
        // 勾了「只看有佐证」：跑过佐证判断的日期只数、只列用自己新闻佐证了这个题材的票；没跑过的日期照常
        const onlyEvidenced = el('onlyEvidenced').checked;
        rows = list.map(day => {
          const all = day.stocks.filter(stock => stock.ths.includes(theme));
          const evidenced = all.filter(stock => stock.ev?.includes(theme));
          const judged = day.evd > 0;
          const stocks = onlyEvidenced && judged ? evidenced : all;
          const top = stocks.reduce((best, stock) => (stock.s > (best?.s || 0) ? stock : best), null);
          return { date: day.d, count: stocks.length, top: top?.s || 0, topName: stocks.filter(stock => stock.s === top?.s).map(stock => stock.n).join('、'), tiers: [0, 0, 0], judged, evidenced: evidenced.length };
        });
      }
      if (!rows.length) {
        panel.innerHTML = `<h2>${escapeHtml(theme)}</h2><div class="hint">没有这个题材的数据</div>`;
        panel.hidden = false;
        return;
      }
      const max = Math.max(1, ...rows.map(row => row.count));
      const active = rows.find(row => row.date === panelDate)
        || rows.find(row => row.date === selectedDate && row.count)
        || [...rows].reverse().find(row => row.count && row.date <= selectedDate) || rows.find(row => row.count) || rows.at(-1);
      // 按事件归题材时柱子按板数分层；按概念时保持单色，绿色是有佐证的
      const TIERS = [['首板', '#2f4a78'], ['2板', '#4f7fd6'], ['≥3板', '#a8c8ff']];
      const dim = row => (byEvent && !row.judged ? ' unjudged' : '');
      const classes = row => `${row === active ? ' selected' : ''}${row.date === selectedDate ? ' today' : ''}${dim(row)}`;
      // 日期标签：每月第一根写「N月」，其余写日
      const label = (row, index) => (index === 0 || row.date.slice(5, 7) !== rows[index - 1].date.slice(5, 7) ? `<b>${Number(row.date.slice(5, 7))}月</b>` : row.date.slice(8));
      const bars = rows.map((row, index) => {
        const height = row.count / max * 44;
        const evidencedHeight = !byEvent && row.judged && row.count ? height * row.evidenced / row.count : 0;
        const title = byEvent
          ? `${row.date}：${row.count} 家（${TIERS.map(([name], at) => `${name} ${row.tiers[at]}`).join('，')}），最高 ${row.top} 板${row.judged ? '' : '（这天的首板没跑过事件归类，只有沿用的连板票）'}${row.fx ? '；⚠ 首板和高位票的依据可能不是同一件事，点开看详情' : ''}`
          : `${row.date}：${row.count} 家${row.judged ? `，有佐证 ${row.evidenced} 家` : '，没跑过佐证判断'}，最高 ${row.top} 板`;
        const fill = byEvent
          ? `<i class="tiers" style="height:${height.toFixed(0)}px">${TIERS.map(([, color], at) => (row.tiers[at] ? `<s style="height:${(row.tiers[at] / row.count * 100).toFixed(1)}%;background:${color}"></s>` : '')).join('')}</i>`
          : `<i style="height:${height.toFixed(0)}px">${evidencedHeight ? `<b style="height:${evidencedHeight.toFixed(0)}px"></b>` : ''}</i>`;
        return `<button class="bar${classes(row)}" data-d="${row.date}" title="${escapeAttr(title)}">
        <span>${row.fx ? '<b class="fx-dot">!</b>' : ''}${row.count || ''}</span>${fill}<span class="day">${label(row, index)}</span></button>`;
      }).join('');

      // 最高板折线：纵轴 1 到 max(5, 这段最高板)，没有票的日子断开
      const boardMax = Math.max(5, ...rows.map(row => row.top));
      const level = top => 8 + (top - 1) / (boardMax - 1) * 64; // 离底部的百分比，上面留出标数字的地方
      const segments = [];
      rows.forEach((row, index) => {
        if (!row.top) {
          segments.push([]);
          return;
        }
        if (!segments.length) segments.push([]);
        segments.at(-1).push(`${index + 0.5},${(100 - level(row.top)).toFixed(1)}`);
      });
      const lines = segments.filter(points => points.length > 1).map(points => `<polyline points="${points.join(' ')}" vector-effect="non-scaling-stroke"/>`).join('');
      const points = rows.map(row => {
        const tip = row.top ? `${row.date}：最高 ${row.top} 板（${escapeAttr(row.topName)}）` : `${row.date}：没有这个题材的涨停`;
        return `<button class="pt${classes(row)}" data-d="${row.date}" title="${tip}">${row.top ? `<i style="bottom:${level(row.top).toFixed(1)}%"></i><span style="bottom:calc(${level(row.top).toFixed(1)}% + 6px)">${row.top}</span>` : ''}</button>`;
      }).join('');
      // 列多时每列固定宽度、横向滚动；少时铺满
      // 事件题材的全部历史始终用固定列宽：列少时（如勾了「走势只到当天」、题材刚出现）不拉伸铺满，靠右对齐，最新一天在右边
      const scrolling = byEvent || rows.length > THEME_TREND_DAYS + 1;
      const innerStyle = scrolling ? ` style="width:${rows.length * TREND_COLUMN_PX}px;min-width:0;margin-left:auto"` : '';
      const nav = scrolling ? `<span class="trend-nav"><button class="btn" data-scroll="start" title="最早">«</button><button class="btn" data-scroll="-1" title="往前">‹</button><button class="btn" data-scroll="1" title="往后">›</button><button class="btn" data-scroll="end" title="最新">»</button></span>` : '';
      const strip = `<div class="strip-caption"><span>最高板（纵轴 1–${boardMax} 板）</span>${byEvent ? `<span class="tier-legend">家数：${TIERS.map(([name, color]) => `<span><s style="background:${color}"></s>${name}</span>`).join('')}</span>` : ''}${nav}</div>
        <div class="trend-scroll"><div class="trend-inner"${innerStyle}>
        <div class="strip"><svg viewBox="0 0 ${rows.length} 100" preserveAspectRatio="none">${lines}</svg>${points}</div>`;

      // 摘要：首次出现、有涨停的天数、家数最多、板数最高、最近一次
      const withStocks = rows.filter(row => row.count);
      const first = withStocks[0];
      const peak = withStocks.reduce((best, row) => (row.count > (best?.count || 0) ? row : best), null);
      const highest = withStocks.reduce((best, row) => (row.top > (best?.top || 0) ? row : best), null);
      const span = !byEvent ? `近 ${rows.length} 个交易日` : el('trendToToday').checked ? `到 ${selectedDate} 为止` : '全部历史';
      const summary = first
        ? `${span}：首次出现 <b>${first.date}</b>；有涨停 <b>${withStocks.length}</b> 天；家数最多 <b>${peak.count}</b> 家（${peak.date}）；最高 <b>${highest.top}</b> 板（${escapeHtml(highest.topName)}，${highest.date}）；最近一次 <b>${withStocks.at(-1).date}</b>`
        : `${span}没有这个题材的票`;

      // 选中那天的详情：每只票的板数、首板日、归到这个题材的催化和依据新闻
      let fxNews = null; // 这天题材可能分化时，首板的新闻简介换成的代表新闻
      const detailOf = (stock, date) => {
        if (byEvent) {
          const found = (eventsOf(stock, date) || []).find(item => item.t === theme);
          if (!found) return '';
          const news = (newsOf(stock, date) || []).find(item => item.t === found.n);
          // 分化时首板的新闻简介统一换成代表新闻（首板里最能说明这次发酵的一条，news-calendar.js 算的 fx.rt），不用逐只展开对照
          const shown = stock.s === 1 && fxNews ? { t: fxNews.t, u: fxNews.u } : found.n ? { t: found.n, u: news?.u } : null;
          const source = shown ? `<div class="src">${shown.u ? `<a href="${escapeAttr(shown.u)}" target="_blank" rel="noopener">${escapeHtml(shown.t)}</a>` : escapeHtml(shown.t)}</div>` : '';
          const shared = found.via === 2 ? ' <span class="tag" title="第一遍没归进来，复看时模型按它自己的新闻归进当天已有的这个题材">复看补</span>'
            : found.via ? ' <span class="tag" title="模型没把这只归进来；它的新闻里有这个题材其他票当天被引作依据的同一条标题，按同标题补进来">同标题补</span>' : '';
          return `<span class="why">${escapeHtml(found.e)}</span>${shared}${source}`;
        }
        const evidenced = (evidenceOf(stock, date) || []).filter(item => item.e && item.n);
        const concept = evidenced.find(item => item.c.includes(theme) || theme.includes(item.c)) || evidenced[0];
        const mark = stock.ev?.includes(theme) ? '<span class="ok">✓</span> ' : '';
        return `<span class="why">${mark}${escapeHtml(stock.fr || stock.r)}</span>${concept && stock.ev?.includes(theme) ? `<div class="src">${escapeHtml(concept.n)}</div>` : ''}`;
      };
      // 选中那天的票：按需加载那天所在的月份
      await loadMonth(active.date.slice(0, 7));
      if (token !== themePanelToken) return;
      const activeDay = dayOf(active.date);
      const onlyEvidenced = !byEvent && el('onlyEvidenced').checked;
      const activeStocks = (activeDay?.stocks || []).filter(stock => (byEvent ? stock.et?.includes(theme)
        : stock.ths.includes(theme) && (!onlyEvidenced || !activeDay.evd || stock.ev?.includes(theme))));
      const fresh = activeStocks.filter(stock => stock.s === 1).length;
      const fx = byEvent ? activeDay?.ets?.find(item => item.n === theme)?.fx : null;
      const lowRelated = new Set((fx?.h || []).map(item => item.n));
      fxNews = fx?.rt || null;
      const fxNote = fx ? `<div class="fx-note">⚠ 可能分化（${fx.h.map(item => `${escapeHtml(item.n)} ${item.s}板`).join('、')} 和今天 ${fx.f} 只首板）${fx.mn ? `<div>模型：${escapeHtml(fx.mn)}；区分关键词：${escapeHtml((fx.mk || []).join('、'))}</div>` : ''}${fx.t?.length ? `<div>标题：${fx.t.map(([title, count]) => `${count} 只首板都有「${escapeHtml(title)}」`).join('；')}，高位票首板时的新闻里没有</div>` : ''}${fx.rt ? `<div>下面首板的新闻简介换成了代表新闻（${fx.rt.c} 只首板都有）</div>` : ''}<div class="fx-hint">请看下面各票依据自己判断</div></div>` : '';
      const detail = `<div class="panel-day"><h3><span>${active.date}</span><span>${activeStocks.length} 家（首板 ${fresh}，连板 ${activeStocks.length - fresh}）</span><span>最高 ${active.top || 0} 板</span>${active.date !== selectedDate ? `<button class="btn" data-goto="${active.date}">切到这天</button>` : ''}</h3>
        ${fxNote}${activeStocks.length ? [...activeStocks].sort((left, right) => right.s - left.s).map(stock => `<div class="panel-stock"><span class="name">${escapeHtml(stock.n)}</span>${stock.s > 1 ? `<span class="tag">${stock.s}板</span> <span class="why">首板 ${stock.fd.slice(5)}</span> ${lowRelated.has(stock.n) ? '<span class="tag fx" title="它首板那几天的新闻里没有今天首板共同的这些新闻">和今天首板关联低</span> ' : ''}` : '<span class="tag">首板</span> '}${detailOf(stock, active.date)}</div>`).join('') : '<div class="hint">这天没有这个题材的涨停</div>'}</div>`;

      const note = byEvent ? '新闻里是同一类催化事件的票，连板票沿用首板那天的；柱高按看得到的范围缩放，数字是实际家数；黄色下划线是页面当前日期'
        : onlyEvidenced ? '只数用自己新闻佐证了这个题材的票（没跑过佐证判断的日期照常）' : '涨停原因含这个概念的都算，绿色是有佐证的';
      // 同一个题材重画（点柱子）时保持滚动位置；换题材时滚到选中那天
      const previous = panel.querySelector('.trend-scroll');
      const keepScroll = previous && panel.dataset.theme === theme ? previous.scrollLeft : null;
      panel.dataset.theme = theme;
      // 四连板跨度：按列位置画横条，重叠的分行；只画在当前图表日期范围内的部分
      let spans = '';
      if (byEvent && el('showFours').checked) {
        const position = new Map(rows.map((row, at) => [row.date, at]));
        const firstDate = rows[0].date;
        const lastDate = rows.at(-1).date;
        const visible = fourSpans
          .filter(([start, end]) => end >= firstDate && start <= lastDate)
          .map(([start, end, name, top, themes]) => {
            const from = position.get(start < firstDate ? firstDate : start);
            const clippedEnd = end > lastDate ? lastDate : end;
            return { from, to: position.get(clippedEnd), name, top, start, end, themes, cut: end > lastDate };
          })
          .filter(span => span.from !== undefined && span.to !== undefined)
          .sort((left, right) => left.from - right.from || right.top - left.top);
        const lanes = [];
        for (const span of visible) {
          const lane = lanes.findIndex(lastTo => lastTo < span.from);
          span.lane = lane < 0 ? lanes.length : lane;
          lanes[span.lane] = span.to + 3; // 名字写在条上，留几列间隔再放下一条
        }
        spans = visible.length
          ? `<div class="four-spans" style="height:${lanes.length * 18 + 4}px">${visible.map(span => {
            const inTheme = span.themes.split('、').includes(theme);
            const tip = `${span.name}：${span.start} 首板 → ${span.end}，最高 ${span.top} 板；题材 ${span.themes || '无事件'}${span.cut ? '（之后的走势没画）' : ''}`;
            return `<span class="four-span${inTheme ? ' in-theme' : ''}" style="left:${span.from * TREND_COLUMN_PX + 1}px;top:${span.lane * 18 + 2}px;width:${(span.to - span.from + 1) * TREND_COLUMN_PX - 2}px" title="${escapeAttr(tip)}">${escapeHtml(span.name)} ${span.top}板</span>`;
          }).join('')}</div>`
          : '<div class="four-spans-empty">这段时间全市场没有四连板及以上的票</div>';
      }
      panel.innerHTML = `<h2>${escapeHtml(theme)} <small>${note}；点柱子看那天的详情</small></h2>
        ${strip}
        <div class="bars">${bars}</div>
        ${spans}
        </div></div>
        <div class="panel-summary">${summary}</div>
        ${detail}`;
      panel.hidden = false;
      const scroller = panel.querySelector('.trend-scroll');
      if (keepScroll !== null) scroller.scrollLeft = keepScroll;
      else {
        const at = rows.indexOf(active);
        scroller.scrollLeft = Math.max(0, (at + 3) * TREND_COLUMN_PX - scroller.clientWidth);
      }
      // 柱高按当前看得到的那几列里最多的家数缩放（全部历史里偶尔一天特别多，按它缩放其余的柱子就看不见了），滚动时重算；柱上的数字是实际家数
      const barEls = [...scroller.querySelectorAll('.bar')];
      const rescale = () => {
        const width = scrolling ? TREND_COLUMN_PX : scroller.clientWidth / rows.length;
        const from = Math.max(0, Math.floor(scroller.scrollLeft / width));
        const to = Math.min(rows.length, Math.ceil((scroller.scrollLeft + scroller.clientWidth) / width));
        const localMax = Math.max(1, ...rows.slice(from, to).map(row => row.count));
        barEls.forEach((bar, at) => {
          const row = rows[at];
          const height = row.count ? Math.min(BAR_PX, Math.max(3, row.count / localMax * BAR_PX)) : 0;
          const fill = bar.querySelector('i');
          fill.style.height = `${height.toFixed(0)}px`;
          const evidenced = fill.querySelector('b');
          if (evidenced) evidenced.style.height = `${(row.evidenced / row.count * height).toFixed(0)}px`;
        });
      };
      rescale();
      let pending = false;
      scroller.addEventListener('scroll', () => {
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => {
          pending = false;
          rescale();
        });
      });
    }

    // 事件题材索引（news-calendar.js 生成的 themes.json）：每个题材每天的家数、分层、最高板；只加载一次
    let themeIndexPromise = null;
    function loadThemeIndex() {
      if (!themeIndexPromise) {
        themeIndexPromise = fetch('/api/news-calendar-themes').then(response => response.json()).then(payload => {
          if (payload.status_code !== 0) throw new Error(payload.msg);
          return payload.data;
        }).catch(error => {
          themeIndexPromise = null;
          console.error(error);
          return { days: [], ed: [], themes: {} };
        });
      }
      return themeIndexPromise;
    }

    // 搜题材：下拉候选按有涨停的总家数排，标出天数、最高板和起止日期
    async function fillThemeSearch() {
      const index = await loadThemeIndex();
      const items = Object.entries(index.themes).map(([name, series]) => ({
        name,
        total: series.reduce((sum, item) => sum + item[1], 0),
        days: series.length,
        top: Math.max(...series.map(item => item[2])),
        first: index.days[series[0][0]],
        last: index.days[series.at(-1)[0]],
      })).sort((left, right) => right.total - left.total);
      el('themeNames').innerHTML = items.map(item => `<option value="${escapeAttr(item.name)}" label="${item.days} 天，最高 ${item.top} 板，${item.first.slice(5)}～${item.last.slice(5)}"></option>`).join('');
    }

    async function pickSearchedTheme() {
      const name = el('themeSearch').value.trim();
      if (!name) return;
      const index = await loadThemeIndex();
      if (!index.themes[name]) {
        el('themeSearchHint').textContent = `没有叫「${name}」的事件题材，请从下拉里选`;
        return;
      }
      el('themeSearchHint').textContent = '';
      // 搜到的是事件题材：页面在概念模式时切回事件题材
      if (el('conceptThemes').checked) el('conceptThemes').checked = false;
      themeFromSearch = true;
      activeTheme = name;
      panelDate = '';
      renderHead(dayOf(selectedDate));
      renderList();
      await renderThemePanel();
      el('themePanel').scrollIntoView({ block: 'nearest' });
    }

    // 有佐证判断的票：选了题材时标「佐证/跟风」，没选时列出有佐证的题材
    function evidenceTag(stock) {
      if (!stock.ev) return '';
      if (activeTheme) {
        return stock.ev.includes(activeTheme)
          ? '<span class="tag ev" title="首板时自己的新闻佐证了这个题材">佐证</span>'
          : '<span class="tag follow" title="首板时没有自己的新闻佐证这个题材（静态标签，或连板中后加的概念）">跟风</span>';
      }
      return stock.ev.length
        ? `<span class="tag ev" title="首板涨停原因里有自己新闻佐证的题材">✓${escapeHtml(stock.ev.join('、'))}</span>`
        : '<span class="tag follow" title="首板涨停原因的概念都没有自己的新闻佐证">无佐证</span>';
    }

    // 按新闻事件归题材时：票后面列它归到的题材，没有事件新闻的标出来
    function eventTag(stock) {
      if (!stock.et) return '<span class="tag" title="首板那天没跑过事件归类">未归类</span>';
      if (!stock.et.length) return '<span class="tag follow" title="首板时自己的新闻里没有可归类的催化事件">无事件</span>';
      return stock.et.map(theme => `<span class="tag event${theme === activeTheme ? ' ev' : ''}">${escapeHtml(theme)}</span>`).join('');
    }

    function stockRow(stock, date) {
      const verdict = stock.v === '强类' ? '<span class="tag strong">强类</span>'
        : stock.v === '仅弱类' ? '<span class="tag weak">仅弱类</span>'
          : stock.v === '无' ? (stock.nc === 0 ? '<span class="tag">无新闻</span>' : '<span class="tag">无重要</span>')
            : '<span class="tag">未判断</span>';
      const time = stock.tm ? escapeHtml(stock.tm.replace('~', '约 ')) : '--:--';
      return `<details class="stock" data-code="${stock.c}" data-date="${date}">
        <summary>
          <span class="name">${escapeHtml(stock.n)}</span>
          <span class="time" title="${stock.tm.startsWith('~') ? '逐笔里第一次到涨停价的时间，不一定封住' : '首次涨停时间'}">${time}</span>
          ${stock.s > 1 ? `<span class="tag">${stock.s}板</span>` : ''}
          ${verdict}
          ${eventMode(dayOf(date)) ? eventTag(stock) : evidenceTag(stock)}
          <span class="reason">${escapeHtml(stock.r)}</span>
        </summary>
        <div class="body"></div>
      </details>`;
    }

    function renderList() {
      const day = dayOf(selectedDate);
      if (!day) return;
      const stocks = filteredStocks(day);
      el('count').textContent = `显示 ${stocks.length}/${day.t}${activeKind ? `（有「${activeKind}」新闻）` : ''}`;
      const groups = new Map();
      const add = (name, stock) => {
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(stock);
      };
      if (el('byTheme').checked) {
        const fallback = eventMode(day) ? '无事件' : '其他';
        for (const stock of stocks) {
          const themes = themesOfStock(stock, day);
          (themes.length ? themes : [fallback]).forEach(theme => add(theme, stock));
        }
      } else {
        for (const stock of stocks) add(stock.s > 1 ? `${stock.s} 板` : '首板', stock);
      }
      const ordered = el('byTheme').checked ? [...groups.entries()].sort((left, right) => right[1].length - left[1].length) : [...groups.entries()];
      el('list').innerHTML = ordered.map(([name, list]) => `<div class="group">${escapeHtml(name)} <small>${list.length} 只</small></div>${list.map(stock => stockRow(stock, day.d)).join('')}`).join('')
        || '<div class="hint">没有符合条件的票</div>';
      el('expandAll').textContent = '全部展开';
    }

    const kindTag = (name, color, plain = false) => `<span class="kind${plain ? ' plain' : ''}" style="--k:${color}">${escapeHtml(name)}</span>`;

    function kindsOf(item) {
      if (item.cats?.length) return item.cats;
      const kind = PLAIN_KINDS.find(([, , pattern]) => pattern.test(item.t));
      return kind ? [kind[0]] : [];
    }

    function kindTags(item) {
      if (item.cats?.length) return item.cats.map(category => kindTag(category, IMPORTANT_KINDS[category] || '#8994a2')).join('');
      const kind = PLAIN_KINDS.find(([, , pattern]) => pattern.test(item.t));
      return kind ? kindTag(kind[0], kind[1], true) : '';
    }

    function newsHtml(list) {
      return list.map(item => `<div class="news${item.i ? ' important' : ''}">
        <time>${escapeHtml((item.tm || '').slice(5, 16))}</time>${item.g ? '<span class="kind plain" style="--k:#6b7280" title="首板当时在同花顺个股资讯里，之后被撤掉了（现在客户端里找不到），缓存里留着">已撤</span>' : ''}${kindTags(item)}${item.u ? `<a href="${escapeAttr(item.u)}" target="_blank" rel="noopener">${escapeHtml(item.t)}</a>` : escapeHtml(item.t)}
        ${item.i && (item.nt || item.why) ? `<p>${escapeHtml(item.nt || item.why)}</p>` : ''}
      </div>`).join('');
    }

    async function renderBody(details) {
      const body = details.querySelector('.body');
      if (body.dataset.done) return;
      body.dataset.done = '1';
      const date = details.dataset.date;
      const stock = dayOf(date).stocks.find(item => item.c === details.dataset.code);
      let origin = stock.s > 1
        ? `<div class="origin"><b>首板 ${stock.fd}</b>：${escapeHtml(stock.fr || '无涨停原因')}<br><b>今天 ${stock.s} 板</b>：${escapeHtml(stock.r)}</div>
           <div class="origin" style="color:var(--muted)">下面是首板时的新闻</div>`
        : `<div class="origin"><b>涨停原因</b>：${escapeHtml(stock.r)}</div>`;
      const events = eventsOf(stock, date);
      if (events?.length) origin += `<div class="evidence"><div style="color:var(--muted)">新闻事件题材${stock.s > 1 ? `（首板 ${stock.fd}）` : ''}：</div>${events.map(item => `<div class="yes">${escapeHtml(item.t)}：${escapeHtml(item.e)}${item.n ? `「${escapeHtml(item.n)}」` : ''}${item.via === 2 ? '（复看补）' : item.via ? '（同标题补）' : ''}</div>`).join('')}</div>`;
      const concepts = evidenceOf(stock, date);
      if (concepts) origin += `<div class="evidence"><div style="color:var(--muted)">首板涨停原因佐证${stock.s > 1 ? `（${stock.fd}）` : ''}：</div>${concepts.map(item => `<div class="${item.e ? 'yes' : 'no'}">${item.e ? '✓' : '✗'} ${escapeHtml(item.c)}：${escapeHtml(item.r)}${item.n ? `「${escapeHtml(item.n)}」` : ''}</div>`).join('')}</div>`;
      const cached = newsOf(stock, date);
      if (cached) {
        const list = cached
          .filter(item => !el('onlyImportant').checked || item.i)
          .filter(item => !activeKind || kindsOf(item).includes(activeKind));
        const hidden = cached.length - list.length;
        const hiddenLabel = activeKind ? `不是「${activeKind}」${el('onlyImportant').checked ? '或非重要' : ''}的新闻` : '非重要新闻';
        body.innerHTML = origin + (list.length ? newsHtml(list) : '<div class="hint">首板前的新闻窗口里没有新闻</div>')
          + (hidden ? `<div class="hint">已隐藏 ${hidden} 条${hiddenLabel}</div>` : '');
        return;
      }
      body.innerHTML = `${origin}<div class="hint">这只票没跑过新闻判断，正在现查标题…</div>`;
      const key = `${stock.c}|${stock.fd || date}`;
      try {
        if (!liveNews.has(key)) {
          const payload = await (await fetch(`/api/news?code=${stock.c}&date=${stock.fd || date}&days=${(stock.fd || date) < '2025-06-01' ? 3 : 5}`)).json();
          if (payload.status_code !== 0) throw new Error(payload.msg);
          liveNews.set(key, payload.data.map(item => ({
            t: item.title,
            tm: new Date(Number(item.publishTime) + 8 * 3600_000).toISOString().replace('T', ' ').slice(0, 19),
            u: item.jumpUrl || '',
          })));
        }
        const list = liveNews.get(key);
        body.innerHTML = `${origin}<div class="hint">未做重要性判断，只有标题</div>${list.length ? newsHtml(list) : '<div class="hint">首板前的新闻窗口里没有新闻</div>'}`;
      } catch (error) {
        body.innerHTML = `${origin}<div class="hint">新闻查询失败：${escapeHtml(error.message)}</div>`;
      }
    }

    async function selectDate(date, { keepTheme = false } = {}) {
      selectedDate = date;
      panelDate = '';
      if (!keepTheme) {
        activeTheme = '';
        themeFromSearch = false;
      }
      const month = date.slice(0, 7);
      await loadMonth(month);
      monthIndex = months.indexOf(month);
      renderCalendar();
      renderHead(dayOf(date));
      renderList();
      renderThemePanel();
      try { history.replaceState(null, '', `#${date}`); } catch { /* 预览环境可能不允许 */ }
    }

    async function stepDay(delta) {
      const month = selectedDate.slice(0, 7);
      const days = loaded.get(month).days;
      const index = days.findIndex(day => day.d === selectedDate) + delta;
      if (days[index]) return selectDate(days[index].d);
      const other = months[months.indexOf(month) + Math.sign(delta)];
      if (!other) return undefined;
      const data = await loadMonth(other);
      return selectDate(delta > 0 ? data.days[0].d : data.days.at(-1).d);
    }

    async function viewMonth(index) {
      if (!months[index]) return;
      await loadMonth(months[index]);
      monthIndex = index;
      renderCalendar();
    }
    const showMonth = delta => viewMonth(monthIndex + delta);

    function toggleCalendar(open = el('calendarPop').hidden) {
      el('calendarPop').hidden = !open;
      el('dateButton').setAttribute('aria-expanded', String(open));
      if (open && selectedDate) viewMonth(months.indexOf(selectedDate.slice(0, 7)));
    }

    function renderLegend() {
      const button = (name, color, plain = false) => `<button type="button" class="kind${plain ? ' plain' : ''}${name === activeKind ? ' active' : ''}" style="--k:${color}" data-kind="${escapeAttr(name)}">${escapeHtml(name)}</button>`;
      el('legend').classList.toggle('filtering', Boolean(activeKind));
      el('legend').innerHTML = [
        ...Object.entries(IMPORTANT_KINDS).map(([name, color]) => button(name, color)),
        ...PLAIN_KINDS.map(([name, color]) => button(name, color, true)),
      ].join('') + (activeKind ? '<span class="legend-hint">只看有这类新闻的票，没跑过新闻判断的票不显示；再点一次取消</span>' : '');
    }
    renderLegend();
    el('legend').addEventListener('click', event => {
      const chip = event.target.closest('button[data-kind]');
      if (!chip) return;
      activeKind = activeKind === chip.dataset.kind ? '' : chip.dataset.kind;
      renderLegend();
      renderList();
    });

    el('calendar').addEventListener('click', event => {
      const cell = event.target.closest('button.cell');
      if (!cell) return;
      toggleCalendar(false);
      selectDate(cell.dataset.d);
    });
    el('themes').addEventListener('click', event => {
      const chip = event.target.closest('.chip');
      if (!chip) return;
      if (chip.id === 'toggleSingles') {
        showAllThemes = !showAllThemes;
        renderHead(dayOf(selectedDate));
        return;
      }
      activeTheme = activeTheme === chip.dataset.theme ? '' : chip.dataset.theme;
      panelDate = '';
      themeFromSearch = false;
      renderHead(dayOf(selectedDate));
      renderList();
      renderThemePanel();
    });
    el('themeSearch').addEventListener('change', pickSearchedTheme);
    el('themeSearch').addEventListener('keydown', event => {
      if (event.key === 'Enter') pickSearchedTheme();
    });
    el('themePanel').addEventListener('click', event => {
      // 走势左右滚动：« 最早，‹ › 翻大半屏，» 最新
      const scroll = event.target.closest('button[data-scroll]');
      if (scroll) {
        const scroller = el('themePanel').querySelector('.trend-scroll');
        const step = scroll.dataset.scroll;
        if (step === 'start') scroller.scrollTo({ left: 0, behavior: 'smooth' });
        else if (step === 'end') scroller.scrollTo({ left: scroller.scrollWidth, behavior: 'smooth' });
        else scroller.scrollBy({ left: Number(step) * scroller.clientWidth * 0.75, behavior: 'smooth' });
        return;
      }
      // 点柱子只换下面的详情，不换页面日期；要换日期点「切到这天」
      const goto = event.target.closest('button[data-goto]');
      if (goto) {
        selectDate(goto.dataset.goto, { keepTheme: true });
        return;
      }
      const target = event.target.closest('button[data-d]');
      if (!target) return;
      panelDate = target.dataset.d;
      renderThemePanel();
    });
    el('list').addEventListener('toggle', event => {
      if (event.target.matches('details.stock') && event.target.open) renderBody(event.target);
    }, true);
    for (const id of ['onlyImportant', 'hideNoNews', 'byTheme']) el(id).addEventListener('change', renderList);
    el('showFours').addEventListener('change', () => renderThemePanel());
    el('trendToToday').addEventListener('change', () => {
      panelDate = '';
      el('themePanel').dataset.theme = ''; // 列变了，重新滚到当前日期
      renderThemePanel();
    });
    el('conceptThemes').addEventListener('change', () => {
      activeTheme = '';
      panelDate = '';
      themeFromSearch = false;
      renderHead(dayOf(selectedDate));
      renderList();
      renderThemePanel();
    });
    el('onlyEvidenced').addEventListener('change', () => {
      renderHead(dayOf(selectedDate));
      renderThemePanel();
    });
    el('search').addEventListener('input', renderList);
    el('expandAll').addEventListener('click', () => {
      const open = el('expandAll').textContent === '全部展开';
      document.querySelectorAll('details.stock').forEach(details => { details.open = open; });
      el('expandAll').textContent = open ? '全部收起' : '全部展开';
    });
    el('dateButton').addEventListener('click', () => toggleCalendar());
    el('calendarYear').addEventListener('change', () => {
      // 换年：同一个月有数据就用同一个月，没有就用这一年最接近的月份
      const year = el('calendarYear').value;
      const sameMonth = `${year}-${months[monthIndex].slice(5)}`;
      const inYear = months.filter(item => item.startsWith(year));
      viewMonth(months.indexOf(months.includes(sameMonth) ? sameMonth : (sameMonth < inYear[0] ? inYear[0] : inYear.at(-1))));
    });
    el('calendarMonth').addEventListener('change', () => viewMonth(months.indexOf(el('calendarMonth').value)));
    // 点日历和日期按钮以外的地方收起
    document.addEventListener('pointerdown', event => {
      if (el('calendarPop').hidden) return;
      if (el('calendarPop').contains(event.target) || el('dateButton').contains(event.target)) return;
      toggleCalendar(false);
    });
    el('prevMonth').addEventListener('click', () => showMonth(-1));
    el('nextMonth').addEventListener('click', () => showMonth(1));
    el('prevDay').addEventListener('click', () => stepDay(-1));
    el('nextDay').addEventListener('click', () => stepDay(1));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') toggleCalendar(false);
      if (event.target.matches('input, select')) return;
      if (event.key === 'ArrowLeft') stepDay(-1);
      if (event.key === 'ArrowRight') stepDay(1);
    });

    (async () => {
      try {
        const payload = await (await fetch('/api/news-calendar')).json();
        if (payload.status_code !== 0) throw new Error(payload.msg);
        months = payload.months;
        // #日期 或 #日期/题材（复盘页「新闻题材」链接过来时直接打开这个题材）
        const [hashDate, hashTheme] = decodeURIComponent(location.hash.slice(1)).split('/');
        const wanted = /^\d{4}-\d{2}-\d{2}$/.test(hashDate || '') ? hashDate : '';
        const month = wanted && months.includes(wanted.slice(0, 7)) ? wanted.slice(0, 7) : months.at(-1);
        const data = await loadMonth(month);
        await selectDate(data.days.some(day => day.d === wanted) ? wanted : data.days.at(-1).d);
        fillThemeSearch();
        if (hashTheme) {
          el('themeSearch').value = hashTheme;
          await pickSearchedTheme();
        }
      } catch (error) {
        el('list').innerHTML = `<div class="hint">加载失败：${escapeHtml(error.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
